     * - different hash, same filename → prompt "Replace existing X.d64? yes/no"
     * - different hash, different filename → add as new
     */
    async _insertBytes(bytes, fileName) {
        await GMDisk._ensureHashes();
        const hash = await GMDisk._hashBytes(bytes);
        const pool = GMDisk.getPool();

        const hashMatch = pool.find(e => e.hash === hash);
        if (hashMatch) {
            this.selectDisk(hashMatch.id);
            this._updatePopupDirectory();
            return true;
        }

        const nameMatch = pool.find(e => e.name === fileName);
        if (nameMatch) {
            const replace = await this._askReplace(fileName);
            if (!replace) return false;
            GMDisk.removeFromPool(nameMatch.id);
        }

        const id = await GMDisk.addToPool(bytes, fileName);
        this.selectDisk(id);
        this._updatePopupDirectory();
        return true;
    }

    // =========================================================================
    // POPUP UI
    // =========================================================================

    /**
     * Show the disk popup
     * @param {Object} options
     * @param {Object} options.fileType - GMDisk.FILE_TYPES value (default: ALL)
     * @param {Function} options.onSelect - Callback(fileName, data) when file selected
     * @param {Function} options.onClose - Callback when popup closed
     * @param {boolean} options.showSave - Show save button (default: false)
     * @param {Function} options.onSave - Callback for save button
     * @param {string} options.title - Popup title (default: 'D64 Disk')
     * @param {Array} options.customButtons - Array of {label, onClick} for page-specific actions
     */
    showPopup(options = {}) {
        this.popupOptions = {
            fileType: options.fileType || GMDisk.FILE_TYPES.ALL,
            onSelect: options.onSelect || null,
            onClose: options.onClose || null,
            showSave: options.showSave || false,
            onSave: options.onSave || null,
            title: options.title || 'D64 Disk Drive',
            customButtons: options.customButtons || [],
            suggestedSaveName: options.suggestedSaveName || null
        };

        this._createPopup();
        this._updatePopupDirectory();

        // Keyboard handler runs in CAPTURE phase. Editor pages have their
        // own bubble-phase window keydown listeners that interpret arrow
        // keys as program-editor navigation; without capture we'd fire
        // last (they registered first) and the editor would see keys
        // pressed inside the popup. With capture we run first and
        // stopImmediatePropagation in the handler kills the leak.
        window.addEventListener('keydown', this._onKeyDown, { capture: true });
    }

    /**
     * Close the popup
     */
    closePopup() {
        // Close any active prompt first so its document-level
        // outside-mousedown listener gets unregistered (and any
        // awaiting Promise — e.g. _askReplace — resolves).
        if (this._activePrompt) this._activePrompt.restore();

        if (this.popup) {
            this.popup.remove();
            this.popup = null;
        }

        window.removeEventListener('keydown', this._onKeyDown, { capture: true });
        this.selectedIndex = -1;
        this.directoryEntries = [];

        if (this.popupOptions?.onClose) {
            this.popupOptions.onClose();
        }
        this.popupOptions = null;
    }

    // =========================================================================
    // POPUP INTERNALS
    // =========================================================================

    _createPopup() {
        // Remove existing popup if any
        if (this.popup) {
            this.popup.remove();
        }

        // Page actions. The last one shares the bottom row with Download D64; any others stack
        // above it in a full-width row, so a long label (e.g. "Export Game Assets to New
        // Disk") gets the whole dialog width instead of wrapping beside Download.
        const customBtn = (btn, i) => `<button class="gm-disk-custom" data-custom-index="${i}">${btn.label}</button>`;
        const customs = this.popupOptions.customButtons;
        const extraCustomHtml = customs.slice(0, -1).map(customBtn).join('');
        const lastCustomHtml = customs.length ? customBtn(customs[customs.length - 1], customs.length - 1) : '';

        // Create overlay (uses standard classes from c64-ui.css)
        this.popup = document.createElement('div');
        this.popup.className = 'popup-overlay';
        this.popup.innerHTML = `
            <div class="popup-dialog gm-disk-dialog">
                <button class="gm-disk-close popup-close-x">X</button>
                <div class="popup-title">${this.popupOptions.title}</div>
                <div class="gm-disk-disk-row">
                    <button class="gm-disk-insert">Insert Disk</button>
                    <button class="gm-disk-blank">New Disk</button>
                    <button class="gm-disk-rename">Rename Disk</button>
                    <button class="gm-disk-eject">Eject</button>
                </div>
                <input type="file" class="gm-disk-file-input" accept=".d64" style="display:none">
                <div class="gm-disk-message-bar">
                    <!-- All prompts share .gm-disk-prompt for the yellow-text
                         + flex-1 + chip styling. They're mutually exclusive:
                         only one is visible at a time, managed by _openPrompt. -->
                    <span class="gm-disk-prompt gm-disk-overwrite-prompt" hidden>
                        overwrite? <a class="gm-disk-overwrite-yes">yes</a>&nbsp;&nbsp;<a class="gm-disk-overwrite-no">no</a>
                    </span>
                    <span class="gm-disk-prompt gm-disk-replace-prompt" hidden>
                        <span class="gm-disk-replace-text"></span>&nbsp;<a class="gm-disk-replace-yes">yes</a>&nbsp;&nbsp;<a class="gm-disk-replace-no">no</a>
                    </span>
                    <span class="gm-disk-prompt gm-disk-delete-prompt" hidden>
                        delete? <a class="gm-disk-delete-yes">yes</a>&nbsp;&nbsp;<a class="gm-disk-delete-no">no</a>
                    </span>
                    <span class="gm-disk-prompt gm-disk-eject-prompt" hidden>
                        eject? <a class="gm-disk-eject-yes">yes</a>&nbsp;&nbsp;<a class="gm-disk-eject-no">no</a>
                    </span>
                    <!-- Shared name-prompt: used by both Rename Disk and New
                         Disk. The triggering button gets an .active highlight
                         while the prompt is open and stands in for any "you're
                         in this mode" label. -->
                    <span class="gm-disk-prompt gm-disk-prompt--form gm-disk-name-prompt" hidden>
                        <input type="text" class="gm-disk-name-prompt-input" maxlength="40" autocomplete="off" spellcheck="false">
                        <span class="gm-disk-name-prompt-actions">
                            <a class="gm-disk-name-prompt-ok">ok</a>&nbsp;&nbsp;<a class="gm-disk-name-prompt-cancel">cancel</a>
                        </span>
                    </span>
                    <span class="gm-disk-info-message" hidden></span>
                </div>
                <div class="info-bar">
                    <div class="gm-disk-name">
                        <span class="gm-disk-filename">No disk loaded</span>
                        <span class="gm-disk-free"></span>
                    </div>
                </div>
                <div class="file-list-container">
                    <table class="file-list">
                        <thead class="file-list-head">
                            <tr>
                                <th class="file-list-header-name">filename</th>
                                <th class="file-list-header-type">type</th>
                                <th class="file-list-header-blocks">blocks</th>
                            </tr>
                        </thead>
                        <tbody class="gm-disk-files"></tbody>
                    </table>
                </div>
                <!-- File-scoped actions row, directly under the listing.
                     Delete is left-aligned (destructive — kept away from the
                     constructive controls). Load + filename + Save are
                     pushed to the right as the "save-and-load" cluster. -->
                <div class="gm-disk-file-actions-row">
                    <button class="gm-disk-delete" disabled>Delete</button>
                    <button class="gm-disk-load gm-disk-actions-right" disabled>Load</button>
                    ${this.popupOptions.showSave ? `
                    <input type="text" class="gm-disk-name-input" maxlength="6" placeholder="filename" autocomplete="off" spellcheck="false">
                    <button class="gm-disk-save">Save</button>` : ''}
                </div>
                ${extraCustomHtml ? `<div class="gm-disk-extra-actions">${extraCustomHtml}</div>` : ''}
                <div class="popup-buttons-bottom">
                    <div class="popup-buttons-left">
                        <button class="gm-disk-download">Download D64</button>
                    </div>
                    <div class="popup-buttons-right">
                        ${lastCustomHtml}
                    </div>
                </div>
            </div>
        `;

        // Wire up events
        const fileInput = this.popup.querySelector('.gm-disk-file-input');
        const insertBtn = this.popup.querySelector('.gm-disk-insert');
        const blankBtn = this.popup.querySelector('.gm-disk-blank');
        const renameBtn = this.popup.querySelector('.gm-disk-rename');
        const ejectBtn = this.popup.querySelector('.gm-disk-eject');
        const saveBtn = this.popup.querySelector('.gm-disk-save');
        const downloadBtn = this.popup.querySelector('.gm-disk-download');
        const closeBtn = this.popup.querySelector('.gm-disk-close');

        insertBtn.onclick = () => {
            // Dismiss any active prompt before opening the OS file
            // picker (we'd otherwise leave it visible behind the picker
            // with its trigger button still highlighted).
            this._activePrompt?.restore();
            fileInput.click();
        };
        fileInput.onclick = () => { fileInput.value = ''; };  // Allow re-selecting same file
        fileInput.onchange = async (e) => {
            if (e.target.files[0]) {
                await this.loadFromFile(e.target.files[0]);
                this._updatePopupDirectory();
            }
        };

        blankBtn.onclick = () => this._showNewDiskPrompt();
        renameBtn.onclick = () => this._showRenamePrompt();

        ejectBtn.onclick = () => this._showEjectPrompt();

        if (saveBtn) {
            const input = this.popup.querySelector('.gm-disk-name-input');

            // Pre-fill with the tool's current filename if provided
            const suggested = this.popupOptions.suggestedSaveName;
            if (suggested) {
                const raw = typeof suggested === 'function' ? suggested() : suggested;
                input.value = this._baseNameForInput(raw);
            }

            // Hard-constrain input: lowercase, [a-z0-9 ], 6 chars
            input.addEventListener('input', () => {
                const cleaned = input.value.toLowerCase().replace(/[^a-z0-9 ]/g, '').substring(0, 6);
                if (input.value !== cleaned) input.value = cleaned;
            });

            // Enter in the input triggers save
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    this._triggerSave();
                }
            });

            saveBtn.onclick = () => this._triggerSave();
        }

        downloadBtn.onclick = () => this.download();
        closeBtn.onclick = () => this.closePopup();

        // Per-file action buttons. Disabled until the user selects a row.
        const loadBtn = this.popup.querySelector('.gm-disk-load');
        const deleteBtn = this.popup.querySelector('.gm-disk-delete');
        loadBtn.onclick = () => this._loadSelected();
        deleteBtn.onclick = () => this._promptDelete();

        // Wire up custom buttons
        const customBtns = this.popup.querySelectorAll('.gm-disk-custom');
        customBtns.forEach(btn => {
            const index = parseInt(btn.dataset.customIndex);
            btn.onclick = () => {
                const customBtn = this.popupOptions.customButtons[index];
                if (customBtn && customBtn.onClick) {
                    customBtn.onClick();
                }
            };
        });

        // Close on overlay click (but not dialog click)
        this.popup.onclick = (e) => {
            if (e.target === this.popup) {
                this.closePopup();
            }
        };

        this.container.appendChild(this.popup);
    }

    // Strip the fileType extension from a filename so it's safe to put in the input.
    // Accepts either "PLAYER" or "PLAYER/SPR" or "  PLAYER/SPR".
    _baseNameForInput(name) {
        if (!name) return '';
        const ext = this.popupOptions.fileType && this.popupOptions.fileType.extension;
        let s = String(name);
        if (ext && s.toUpperCase().endsWith(ext)) {
            s = s.substring(0, s.length - ext.length);
        }
        return s.toLowerCase().trim().substring(0, 6);
    }

    _triggerSave() {
        if (!this.hasDisk()) {
            this.showInfoMessage('Insert a disk first');
            return;
        }
        const input = this.popup.querySelector('.gm-disk-name-input');
        // Don't trim — internal whitespace can be significant in GM filenames.
        // We only need a non-empty (after trim) check to reject blank input.
        const name = input.value;
        if (!name.trim()) {
            input.focus();
            return;
        }
        const ext = (this.popupOptions.fileType && this.popupOptions.fileType.extension) || '';
        const extNoSlash = ext.replace(/^\//, '');
        const fileName = extNoSlash
            ? GMTools.formatFileName(name, extNoSlash)
            : name.toUpperCase();

        // Check for existing file on disk
        const exists = this.listFiles().some(
            e => e.fileName.trim().toUpperCase() === fileName.toUpperCase()
        );

        if (exists) {
            this._showOverwritePrompt(fileName);
        } else {
            this._doSave(fileName);
        }
    }

    _doSave(fileName) {
        // Save is a terminal action — close the popup on success so the user
        // gets back to whatever they were doing. On failure, leave the popup
        // open so the failure info-message (set by the callback) stays visible.
        // Callbacks should return true on success.
        const ok = this.popupOptions.onSave
            ? !!this.popupOptions.onSave(fileName)
            : true;
        this._updatePopupDirectory();
        if (ok) this.closePopup();
    }

    /**
     * Show a temporary informational message in the disk info-bar (replaces
     * the disk-name + free spans). Auto-clears after `duration` ms. For real
     * flashing-color alarms, see GMTools.flashingMessage.
     *
     * @param {string} text - Message text
     * @param {Object} options
     * @param {number} options.duration - ms before auto-clear (default 2500; 0 = sticky)
     * @param {string} options.color - CSS color (default var(--c64-red))
     */
    showInfoMessage(text, options = {}) {
        if (!this.popup) return;
        // Don't clobber an active prompt — the message bar is exclusive.
        if (this._activePrompt) return;
        const msg = this.popup.querySelector('.gm-disk-info-message');

        if (this._messageTimer) {
            clearTimeout(this._messageTimer);
            this._messageTimer = null;
        }

        msg.hidden = false;
        msg.textContent = text;
        msg.style.color = options.color || 'var(--c64-red)';

        const duration = options.duration !== undefined ? options.duration : 2500;
        if (duration > 0) {
            this._messageTimer = setTimeout(() => this.clearMessage(), duration);
        }
    }

    clearMessage() {
        if (!this.popup) return;
        const msg = this.popup.querySelector('.gm-disk-info-message');
        if (this._messageTimer) {
            clearTimeout(this._messageTimer);
            this._messageTimer = null;
        }
        msg.hidden = true;
        msg.textContent = '';
    }

    // === SHARED PROMPT INFRASTRUCTURE ===
    //
    // Every message-bar prompt (overwrite, replace, delete, eject, name)
    // goes through _openPrompt so they all behave identically:
    //   - Mutually exclusive — opening one closes any other.
    //   - Outside-mousedown cancels (clicks anywhere not inside the
    //     prompt itself; capture phase, so it fires before chip
    //     onclicks which means inside-prompt clicks reach their handlers
    //     unhindered).
    //   - Optional triggerBtn gets .active highlight while open.
    //   - Returns restore(); caller wires yes/no/ok onclicks to call it
    //     after running the confirm action.
    //
    // The single this._activePrompt field replaces what used to be four
    // separate per-prompt restore/listener fields. closePopup, the Escape
    // handler, and Insert Disk all just use this._activePrompt?.restore().
    _openPrompt({ promptEl, triggerBtn = null }) {
        if (this._activePrompt) this._activePrompt.restore();

        promptEl.hidden = false;
        if (triggerBtn) triggerBtn.classList.add('active');

        const onOutsideMouseDown = (e) => {
            // Clicks inside any prompt element (input, chips) don't
            // dismiss — they belong to the prompt's own handlers.
            if (e.target.closest('.gm-disk-prompt')) return;
            restore();
        };
        document.addEventListener('mousedown', onOutsideMouseDown, true);

        const restore = () => {
            promptEl.hidden = true;
            if (triggerBtn) triggerBtn.classList.remove('active');
            document.removeEventListener('mousedown', onOutsideMouseDown, true);
            this._activePrompt = null;
        };
        this._activePrompt = { restore };
        return restore;
    }

    _showOverwritePrompt(fileName) {
        const prompt = this.popup.querySelector('.gm-disk-overwrite-prompt');
        const yes = prompt.querySelector('.gm-disk-overwrite-yes');
        const no = prompt.querySelector('.gm-disk-overwrite-no');
        const restore = this._openPrompt({ promptEl: prompt });
        yes.onclick = () => { restore(); this._doSave(fileName); };
        no.onclick  = () => restore();
    }

    // Eject removes the disk from the pool — destructive if the user
    // hasn't downloaded it first. Button stays highlighted while the
    // prompt is open (matches the rename / new-disk mode-indicator
    // pattern).
    _showEjectPrompt() {
        if (!this.currentDiskId) return;
        const prompt = this.popup.querySelector('.gm-disk-eject-prompt');
        const yes = prompt.querySelector('.gm-disk-eject-yes');
        const no = prompt.querySelector('.gm-disk-eject-no');
        const restore = this._openPrompt({
            promptEl: prompt,
            triggerBtn: this.popup.querySelector('.gm-disk-eject')
        });
        yes.onclick = () => {
            restore();
            this.clear();
            this._updatePopupDirectory();
        };
        no.onclick = () => restore();
    }

    // Shared name-prompt: text input + ok/cancel in the message bar.
    // Used by Rename Disk and New Disk — same UX shape, different
    // onOk callback and triggering button. The triggering button gets
    // an `.active` highlight while the prompt is open, so it doubles
    // as the "you're in this mode" indicator (no separate label text
    // needed in the message bar). Pre-fills + selects the initialValue
    // so the user can confirm with Enter or replace by typing.
    _showNamePrompt({ initialValue, onOk, triggerBtn }) {
        const prompt = this.popup.querySelector('.gm-disk-name-prompt');
        const input  = prompt.querySelector('.gm-disk-name-prompt-input');
        const okBtn  = prompt.querySelector('.gm-disk-name-prompt-ok');
        const cancel = prompt.querySelector('.gm-disk-name-prompt-cancel');

        input.value = initialValue || '';
        const restore = this._openPrompt({ promptEl: prompt, triggerBtn });
        input.focus();
        input.select();

        const confirm = () => {
            const name = input.value.trim();
            restore();
            if (!name) return;
            onOk(name);
        };
        okBtn.onclick  = confirm;
        cancel.onclick = () => restore();
        input.onkeydown = (e) => {
            if (e.key === 'Enter')       { e.preventDefault(); confirm(); }
            else if (e.key === 'Escape') { e.preventDefault(); restore(); }
        };
    }

    _showRenamePrompt() {
        if (!this.disk || !this.currentDiskId) {
            this.showInfoMessage('No disk loaded');
            return;
        }
        // Pre-fill with the current filename (sans .d64 — we add it back
        // on confirm so the user doesn't have to type/keep the extension).
        const entry = GMDisk.getPool().find(e => e.id === this.currentDiskId);
        this._showNamePrompt({
            initialValue: entry ? entry.name.replace(/\.d64$/i, '') : '',
            onOk: (newName) => this._renameCurrentDisk(newName),
            triggerBtn: this.popup.querySelector('.gm-disk-rename')
        });
    }

    _showNewDiskPrompt() {
        // Suggest the next auto-numbered name — user can accept (Enter) for
        // the fast scratch-disk path or type a meaningful name instead.
        const suggested = `NEW DISK ${String(GMDisk._nextNewDiskNumber()).padStart(2, '0')}`;
        this._showNamePrompt({
            initialValue: suggested,
            onOk: async (name) => {
                await this.createBlank(name);
                this._updatePopupDirectory();
            },
            triggerBtn: this.popup.querySelector('.gm-disk-blank')
        });
    }

    // Apply a new filename to the current pool entry. Strips filesystem-
    // unsafe chars (slash, colon, etc.) and ensures the .d64 extension is
    // present exactly once. Disk bytes / BAM are untouched — this is a
    // pure metadata rename.
    _renameCurrentDisk(newName) {
        if (!this.currentDiskId) return;
        const safe = newName.replace(/[\/\\:*?"<>|]/g, '').trim() || 'NEW';
        const safeFile = /\.d64$/i.test(safe) ? safe : safe + '.d64';
        GMDisk.updatePoolEntry(this.currentDiskId, { name: safeFile });
        // Keep the in-memory cached filename in sync — download() and the
        // editor's "from disk: …" hint both read diskFileName, so without
        // this they'd keep showing the pre-rename name until reload.
        this.diskFileName = safeFile;
        this._updatePopupDirectory();
    }

    _askReplace(fileName) {
        return this.confirm(`Replace existing ${fileName}?`);
    }

    /**
     * Ask a yes/no question in the popup's message bar (the same chip prompt as "Replace
     * existing X?"). Resolves true on yes; false on no or any dismissal (outside click,
     * Escape, popup close). Requires the popup to be open.
     * @param {string} question
     * @returns {Promise<boolean>}
     */
    confirm(question) {
        if (!this.popup) return Promise.resolve(false);
        return new Promise((resolve) => {
            const prompt = this.popup.querySelector('.gm-disk-replace-prompt');
            const text = prompt.querySelector('.gm-disk-replace-text');
            const yes = prompt.querySelector('.gm-disk-replace-yes');
            const no = prompt.querySelector('.gm-disk-replace-no');

            text.textContent = question;
            const baseRestore = this._openPrompt({ promptEl: prompt });

            // Single resolution path. The promise MUST resolve exactly
            // once (addToPool awaits us). Any dismissal — yes/no chip,
            // outside-click, Escape, popup close — routes through here.
            let resolved = false;
            const finish = (answer) => {
                if (resolved) return;
                resolved = true;
                baseRestore();
                resolve(answer);
            };
            // Patch the active prompt's restore so external closers
            // (outside-click, Escape, popup-close) resolve as "no".
            this._activePrompt.restore = () => finish(false);
            yes.onclick = () => finish(true);
            no.onclick  = () => finish(false);
        });
    }


    /**
     * Refresh the popup directory listing (public wrapper)
     */
    refreshPopup() {
        this._updatePopupDirectory();
    }

    /**
     * Attach the shared-pool disk picker to the disk-name element. Idempotent —
     * safe to call on every refresh. Uses GMTools.draggableField so behaviour
     * matches every other dropdown in the suite.
     */
    _wireDiskPicker(nameEl) {
        if (typeof GMTools === 'undefined' || !GMTools.draggableField) return;

        const pool = GMDisk.getPool();
        const ids = pool.map(e => e.id);

        GMTools.draggableField.attach(nameEl, {
            type: 'enum',
            values: ids,
            getValue: () => this.currentDiskId,
            setValue: (id) => {
                this.selectDisk(id);
                this._updatePopupDirectory();
            },
            // Used for typed-search matching (e.g. user types "game" to filter)
            formatValue: (id) => {
                const entry = GMDisk.getPool().find(e => e.id === id);
                return entry ? entry.name : '';
            },
            // Dropdown entry mirrors the resting display: filename (left,
            // truncated if long) and "N free" (right).
            renderItem: (id) => {
                const entry = GMDisk.getPool().find(e => e.id === id);
                if (!entry) return '';

                const wrap = document.createElement('div');
                wrap.className = 'gm-disk-item';

                const filename = document.createElement('span');
                filename.className = 'gm-disk-filename';
                filename.textContent = GMDisk._truncateDiskName(entry.name);

                const free = document.createElement('span');
                free.className = 'gm-disk-free';
                const bytes = GMDisk._getDiskBytes(id);
                if (bytes) {
                    try {
                        free.textContent = `${new D64(bytes).getFreeBlocks()} free`;
                    } catch (e) { /* leave blank */ }
                }

                wrap.appendChild(filename);
                wrap.appendChild(free);
                return wrap;
            }
        });

        // Picker reads as a button — pointer cursor over the draggable default
        nameEl.style.cursor = 'pointer';
    }

    _updatePopupDirectory() {
        if (!this.popup) return;

        const nameEl = this.popup.querySelector('.gm-disk-name');
        const filenameEl = this.popup.querySelector('.gm-disk-filename');
        const freeEl = this.popup.querySelector('.gm-disk-free');
        const tbody = this.popup.querySelector('.gm-disk-files');

        this._wireDiskPicker(nameEl);

        if (!this.disk) {
            filenameEl.textContent = 'No disk loaded';
            freeEl.textContent = '';
            tbody.innerHTML = '<tr class="gm-disk-empty"><td colspan="3">Insert a disk to browse files</td></tr>';
            this.directoryEntries = [];
            return;
        }

        const entry = GMDisk.getPool().find(e => e.id === this.currentDiskId);
        filenameEl.textContent = GMDisk._truncateDiskName(entry ? entry.name : '');
        freeEl.textContent = `${this.getFreeBlocks()} free`;

        // Build the unified entry list. Every row is selectable (so Delete
        // can work on any type), but only the editor's primary type is
        // LOADable — non-primary entries render dimmed and the Load
        // button stays disabled when one is selected.
        // The popup always shows every file on the disk. Files matching
        // the editor's primary type are loadable and lead the list;
        // remaining GM types (sprites, scenes, etc.), then standalones,
        // then anything else all follow, greyed out. Rationale for
        // always-on: hiding non-primary types made disks look empty when
        // (e.g.) a compilation disk contained only standalones — the
        // user's mental model is "here's the disk; here's what's on
        // it" not "here's what my current editor cares about."
        const TYPE_ORDER = ['/SPR', '/PIC', '/SND', '/SNG', '/PRG'];
        const rawAll = this.listFiles();
        const all = rawAll.filter(e => GMDisk._isGmFile(e.fileName));
        const primaryExt = (this.popupOptions.fileType.extension || '').toUpperCase();
        const byExt = {};
        for (const entry of all) {
            const slash = entry.fileName.lastIndexOf('/');
            const ext = slash >= 0 ? entry.fileName.substring(slash).toUpperCase() : '';
            if (!byExt[ext]) byExt[ext] = [];
            byExt[ext].push(entry);
        }
        const otherExts = TYPE_ORDER.filter(ext => byExt[ext] && ext !== primaryExt);
        // Non-GM-named entries split into standalones (recognisable by
        // $0302 magic + 191-block size) and everything else.
        const standalones = [];
        const nonGm = [];
        for (const e of rawAll) {
            if (GMDisk._isGmFile(e.fileName)) continue;
            if (GMDisk._isStandaloneEntry(this.disk, e)) standalones.push(e);
            else nonGm.push(e);
        }
        const groups = [];
        if (byExt[primaryExt]) groups.push({ entries: byExt[primaryExt], loadable: true, ext: primaryExt });
        for (const ext of otherExts) groups.push({ entries: byExt[ext], loadable: false, ext });
        // Standalones only load in the program editor — it's the only
        // editor that detects the $0302 magic and routes the raw bytes
        // through standaloneToPRG; anywhere else a load would error. So
        // they're loadable here iff this IS the program editor (primary
        // type /PRG); in every other editor they render dimmed and Load
        // dispatches to the program editor (see dispatchTo below). Grouped
        // below regular GM files, above generic files — "these are
        // GameMaker exports, not native project files."
        const inProgramEditor = primaryExt === '/PRG';
        if (standalones.length) {
            groups.push({ entries: standalones, loadable: inProgramEditor, ext: 'STANDALONE' });
        }
        // Anything else on the disk gets a "non-GameMaker" bucket at the
        // bottom so the user can see the full disk contents rather than
        // wondering why block count doesn't match visible entries.
        if (nonGm.length) {
            groups.push({ entries: nonGm, loadable: false, ext: 'NON_GM' });
        }

        // Flatten groups into directoryEntries (single source of truth) and
        // render. Each entry carries its loadable flag so click/select logic
        // can decide which buttons to enable. For non-loadable rows that
        // ARE GM files (e.g. a /SPR selected while in scene-maker), attach
        // the dispatch target so the Load button + dblclick can navigate.
        // A dimmed standalone dispatches to the program editor; only
        // non-GM rows have no target. (In the program editor standalones
        // are loadable, so they skip this branch entirely.)
        this.directoryEntries = [];
        for (const g of groups) {
            for (const e of g.entries) {
                const entry = { ...e, loadable: g.loadable };
                if (!g.loadable && g.ext !== 'NON_GM') {
                    const targetEditor = GMDisk._editorForExt(g.ext);
                    if (targetEditor) entry.dispatchTo = targetEditor;
                }
                this.directoryEntries.push(entry);
            }
        }

        // Build table. Single click selects (highlight + prefill save name);
        // double click is the shortcut for load.
        tbody.innerHTML = '';
        let index = 0;
        groups.forEach((group, groupIdx) => {
            // Visual gap between groups — a thin spacer row so the type
            // buckets read as distinct sections.
            if (groupIdx > 0) {
                const spacer = document.createElement('tr');
                spacer.className = 'gm-disk-group-gap';
                spacer.innerHTML = '<td colspan="3">&nbsp;</td>';
                tbody.appendChild(spacer);
            }
            group.entries.forEach((entry) => {
                const row = document.createElement('tr');
                row.dataset.fileName = entry.fileName;
                const myIndex = index++;
                row.dataset.index = myIndex;
                row.onclick = () => this._highlightFile(myIndex);
                if (group.loadable) {
                    row.ondblclick = () => this._loadSelected();
                } else {
                    row.classList.add('gm-disk-row-dimmed');
                    // Dimmed rows that can be dispatched (a GM file the
                    // wrong editor is currently viewing) still respond to
                    // double-click — the gesture just navigates instead
                    // of loading. Non-dispatchable dimmed rows (non-GM,
                    // no target editor) stay inert.
                    if (this.directoryEntries[myIndex].dispatchTo) {
                        row.ondblclick = () => this._loadSelected();
                    }
                }

                // Split "PLAYER/SPR" → "PLAYER" + "sprite". The full filename
                // with extension is still the canonical identifier in code
                // (and on row.dataset.fileName); the split here is purely
                // presentational. Standalones have no extension; the group
                // carries a synthetic `ext: 'STANDALONE'` marker so the
                // type cell can still label them.
                const slash = entry.fileName.lastIndexOf('/');
                const baseName = slash >= 0 ? entry.fileName.substring(0, slash) : entry.fileName;
                const ext = group.ext || (slash >= 0 ? entry.fileName.substring(slash).toUpperCase() : '');

                const nameCell = document.createElement('td');
                nameCell.textContent = baseName;

                const typeCell = document.createElement('td');
                typeCell.textContent = GMDisk._typeLabel(ext);

                const sizeCell = document.createElement('td');
                sizeCell.textContent = entry.fileSize;

                row.appendChild(nameCell);
                row.appendChild(typeCell);
                row.appendChild(sizeCell);
                tbody.appendChild(row);
            });
        });

        if (groups.length === 0) {
            tbody.innerHTML = `<tr class="gm-disk-empty"><td colspan="3">Empty disk</td></tr>`;
        }

        this.selectedIndex = -1;
        this._updateFileActionButtons();
    }

    // Enable/disable the per-file action buttons based on the selection.
    // Delete works on any selection; Load handles two modes:
    //   - loadable rows: load into the current editor
    //   - dispatchTo rows: same "Load" label, but clicking navigates to
    //     the matching editor with the disk + file encoded in the URL.
    //     Non-loadable non-dispatchable rows (non-GM files) leave Load
    //     disabled. We deliberately don't relabel the button when the
    //     action changes — testing showed the "Open in sprite-maker"
    //     rewrite made the UI feel busy; the dispatch is discovered
    //     naturally when the user tries to load a dimmed file.
    _updateFileActionButtons() {
        if (!this.popup) return;
        const entry = this.directoryEntries[this.selectedIndex];
        const loadBtn = this.popup.querySelector('.gm-disk-load');
        const deleteBtn = this.popup.querySelector('.gm-disk-delete');
        if (loadBtn) {
            const canDispatch = !!(entry && !entry.loadable && entry.dispatchTo);
            loadBtn.disabled = !entry || (!entry.loadable && !canDispatch);
        }
        if (deleteBtn) deleteBtn.disabled = !entry;
    }

    // Load the currently selected file (called from double-click, Enter,
    // or the Load button). Loadable rows go through the host's onSelect
    // callback; dispatchable rows navigate to the correct editor.
    _loadSelected() {
        const entry = this.directoryEntries[this.selectedIndex];
        if (!entry) return;
        if (entry.loadable) {
            const data = this.loadFile(entry.fileName);
            if (this.popupOptions.onSelect) {
                this.popupOptions.onSelect(entry.fileName, data);
                this.closePopup();
            }
            return;
        }
        if (entry.dispatchTo) {
            this._dispatchToEditor(entry.dispatchTo, entry.fileName);
        }
    }

    // Cross-editor dispatch: navigate to the target editor page with
    // the current pool disk id + file name encoded in URL params. The
    // target's GMTools.initFromUrl picks up the params, calls
    // loadDiskFromUrl (which honors the `pool:` prefix by selecting the
    // pool entry directly — no fetch), and auto-loads the file.
    // Uses location.href for same-tab navigation so browser-back
    // returns the user to this editor with session-restored state.
    _dispatchToEditor(editorPage, fileName) {
        if (!this.currentDiskId) return;
        const params = new URLSearchParams();
        params.set('disk', `pool:${this.currentDiskId}`);
        params.set('file', fileName);
        location.href = `${editorPage}.html?${params.toString()}`;
    }

    // Delete prompt for the currently selected file. yes performs the
    // delete, no/outside-click cancels (the cancellation is handled by
    // _openPrompt's outside-mousedown dismissal).
    _promptDelete() {
        if (this.selectedIndex < 0 || this.selectedIndex >= this.directoryEntries.length) return;
        const prompt = this.popup.querySelector('.gm-disk-delete-prompt');
        const yes = prompt.querySelector('.gm-disk-delete-yes');
        const no = prompt.querySelector('.gm-disk-delete-no');
        const restore = this._openPrompt({ promptEl: prompt });
        yes.onclick = () => { restore(); this._performDelete(); };
        no.onclick  = () => restore();
    }

    _performDelete() {
        if (this.selectedIndex < 0 || this.selectedIndex >= this.directoryEntries.length) return;
        const entry = this.directoryEntries[this.selectedIndex];
        try {
            this.disk.deleteFile(entry.fileName);
            this.save();  // persist to localStorage
        } catch (e) {
            console.error('GMDisk: delete failed:', e.message);
            this.showInfoMessage('Delete failed');
            return;
        }
        this._updatePopupDirectory();
    }

    _onKeyDown(e) {
        if (!this.popup) return;

        // If a form field inside the popup is focused, let the event
        // flow naturally to the input — the field's own onkeydown
        // (Enter/Escape → confirm/cancel) and native browser handling
        // (arrow-key cursor movement) own the keys. We intentionally
        // do NOT stopPropagation in this branch: a capture-phase stop
        // at window would prevent the event from ever reaching the
        // input (capture descends from window → input). The editor's
        // own keydown handlers already skip when target is an input,
        // so there's no leak risk for this branch.
        const tag = e.target?.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;

        // Non-input target: block editor / page-level keydown handlers
        // from seeing keys while popup is open. Done before any other
        // logic so the early-returns below still block the leak.
        e.stopImmediatePropagation();

        // Don't handle if a program is running
        if (window.vm && window.vm.running) return;

        switch (e.key) {
            case 'ArrowUp':
            case 'ArrowLeft':
                e.preventDefault();
                if (this.selectedIndex > 0) {
                    this._highlightFile(this.selectedIndex - 1);
                } else if (this.selectedIndex === -1 && this.directoryEntries.length > 0) {
                    this._highlightFile(this.directoryEntries.length - 1);
                }
                break;

            case 'ArrowDown':
            case 'ArrowRight':
                e.preventDefault();
                if (this.selectedIndex < this.directoryEntries.length - 1) {
                    this._highlightFile(this.selectedIndex + 1);
                }
                break;

            case 'Enter':
                e.preventDefault();
                this._loadSelected();
                break;

            case 'Escape':
                e.preventDefault();
                // Escape dismisses the active prompt if there is one;
                // closing the whole popup takes another Escape.
                if (this._activePrompt) this._activePrompt.restore();
                else this.closePopup();
                break;
        }
    }

    _highlightFile(index) {
        if (index < 0 || index >= this.directoryEntries.length) return;

        const rows = this.popup.querySelectorAll('.gm-disk-files tr[data-index]');
        rows.forEach((row, i) => {
            row.classList.toggle('selected', i === index);
        });
        this.selectedIndex = index;

        if (rows[index]) {
            rows[index].scrollIntoView({ block: 'nearest' });
        }

        // Prefill the save filename input with the selected file's base name —
        // matches the common file-dialog convention (selecting a file makes it
        // the default save target). Only when the save row exists.
        const input = this.popup.querySelector('.gm-disk-name-input');
        if (input) {
            input.value = this._baseNameForInput(this.directoryEntries[index].fileName);
        }

        this._updateFileActionButtons();
    }
}

// =========================================================================
// HELPER: Display name conversion
// =========================================================================

/**
 * Convert disk filename to display name
 * "PLAYER/SPR" -> "player"
 */
GMDisk.toDisplayName = function(diskName) {
    const slashIndex = diskName.lastIndexOf('/');
    const baseName = slashIndex >= 0 ? diskName.substring(0, slashIndex) : diskName;
    return baseName.toLowerCase().trim();
};

/**
 * Convert display name to disk filename
 * "player" + SPRITE -> "PLAYER/SPR"
 */
GMDisk.toDiskName = function(displayName, fileType) {
    return displayName.toUpperCase().trim() + fileType.extension;
};
</script>
<script>/**
 * gmTools.js — GMC64 shared utilities
 *
 * Small utilities shared across the GMC64 editor pages.
 *
 * Used by: sprite-maker.html, scene-maker.html
 * Requires: c64lib.js (for c64Palette, c64ColorNames)
 * CSS: css/c64-ui.css (defines .color-picker-overlay, .color-picker-dialog, etc.)
 */

const GMTools = {

    // Filename used when the bundled demo disk is mounted into the shared
    // pool — shown to users in the disk picker and stored in localStorage.
    // Kept lowercase to match the on-disk file (disks/gmc64-demo.d64) and
    // the project's lowercase branding.
    DEMO_DISK_FILENAME: 'gmc64-demo.d64',

    // =========================================================================
    // COLOR PICKER
    // =========================================================================
    // Shows a 16-color C64 palette picker popup positioned near the click point.
    // Creates DOM elements dynamically on first use; reuses them thereafter.
    // Layout (2 columns, 8 rows) is controlled by CSS in c64-ui.css.
    //
    // Usage:
    //   GMTools.colorPicker.show({
    //       x: event.clientX,
    //       y: event.clientY,
    //       onSelect: (colorIndex) => { ... }  // colorIndex is 0-15
    //   });

    colorPicker: {
        _overlay: null,
        _dialog: null,
        _onSelect: null,
        _onClose: null,

        /**
         * Show the color picker
         * @param {Object} options
         * @param {number} options.x - Click X position (dialog will center horizontally on this)
         * @param {number} options.y - Click Y position (dialog will appear 10px below this)
         * @param {Function} options.onSelect - Callback(colorIndex) when color is picked
         * @param {Function} options.onClose - Optional callback when picker is closed without selection
         */
        show(options) {
            this._onSelect = options.onSelect || null;
            this._onClose = options.onClose || null;

            // Create overlay if needed
            if (!this._overlay) {
                this._createElements();
            }

            // Show overlay
            this._overlay.style.display = 'block';

            // Position dialog: top-center at click, 10px down
            const dialog = this._dialog;
            dialog.style.left = options.x + 'px';
            dialog.style.top = (options.y + 10) + 'px';
            dialog.style.transform = 'translateX(-50%)';

            // Adjust if off-screen (check after positioning)
            requestAnimationFrame(() => {
                const rect = dialog.getBoundingClientRect();

                // Too far right?
                if (rect.right > window.innerWidth) {
                    dialog.style.left = (window.innerWidth - rect.width / 2 - 10) + 'px';
                }
                // Too far left?
                if (rect.left < 0) {
                    dialog.style.left = (rect.width / 2 + 10) + 'px';
                }
                // Too far down?
                if (rect.bottom > window.innerHeight) {
                    // Position above the click instead
                    dialog.style.top = (options.y - rect.height - 10) + 'px';
                }
            });
        },

        /**
         * Hide the color picker
         */
        hide() {
            if (this._overlay) {
                this._overlay.style.display = 'none';
            }
            this._onSelect = null;
            this._onClose = null;
        },

        /**
         * Check if picker is currently open
         */
        isOpen() {
            return this._overlay && this._overlay.style.display === 'block';
        },

        /**
         * Create the overlay and dialog elements
         */
        _createElements() {
            // Create overlay
            this._overlay = document.createElement('div');
            this._overlay.className = 'color-picker-overlay';
            this._overlay.onclick = (e) => {
                if (e.target === this._overlay) {
                    if (this._onClose) this._onClose();
                    this.hide();
                }
            };

            // Create dialog
            this._dialog = document.createElement('div');
            this._dialog.className = 'color-picker-dialog';

            // Create grid
            const grid = document.createElement('div');
            grid.className = 'color-picker-grid';

            // Add color swatches (0-15)
            for (let i = 0; i < 16; i++) {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch';
                swatch.style.background = this._paletteToCSS(i);
                swatch.textContent = c64ColorNames[i];

                // Light text on dark colors (black, red, blue, brown, dark gray)
                if ([0, 2, 6, 9, 11].includes(i)) {
                    swatch.style.color = `rgb(${c64Palette.white[0]}, ${c64Palette.white[1]}, ${c64Palette.white[2]})`;
                }

                swatch.onclick = () => {
                    if (this._onSelect) {
                        this._onSelect(i);
                    }
                    this.hide();
                };

                grid.appendChild(swatch);
            }

            this._dialog.appendChild(grid);
            this._overlay.appendChild(this._dialog);
            document.body.appendChild(this._overlay);
        },

        /**
         * Convert C64 palette index to CSS color string
         */
        _paletteToCSS(colorIndex) {
            const rgba = c64Palette[colorIndex];
            if (!rgba) return `rgb(${c64Palette.black[0]}, ${c64Palette.black[1]}, ${c64Palette.black[2]})`;
            return `rgb(${rgba[0]}, ${rgba[1]}, ${rgba[2]})`;
        }
    },

    // =========================================================================
    // FILENAME FORMATTING
    // =========================================================================

    /**
     * Format a GMC64 filename: 6 chars (space-padded) + /EXT
     *
     * Whitespace is preserved as-is — names can contain significant
     * spaces (e.g. "JET R /SPR", "STARS /PIC"). We don't trim and we
     * don't strip middle spaces; we only filter out characters the GMC64
     * character set doesn't have.
     *
     * @param {string} baseName - The base name (will be uppercased, truncated to 6 chars)
     * @param {string} extension - The extension without slash (e.g., 'SPR', 'PIC', 'SND')
     * @returns {string} Formatted filename like "PLAYER/SPR" or "AB CD /SPR"
     */
    formatFileName(baseName, extension) {
        const cleanName = baseName.toUpperCase().replace(/[^A-Z0-9 ]/g, '').substring(0, 6);
        const paddedName = cleanName.padEnd(6, ' ');
        return paddedName + '/' + extension;
    },

    // =========================================================================
    // DRAGGABLE FIELD
    // =========================================================================
    // Makes an element draggable to change its value (numeric or enumerated).
    // Supports three interaction modes:
    // - Drag up/down to change value
    // - Click (not drag) to open dropdown with all options
    // - Type to search/filter options in dropdown
    //
    // Features:
    // - Numeric values with min/max bounds
    // - Enumerated values (array of options)
    // - Configurable sensitivity for drag
    // - 5-pixel threshold before drag starts (allows clicks)
    // - Keyboard navigation (arrows, enter, escape, typing)
    //
    // Usage:
    //   GMTools.draggableField.attach(element, {
    //       type: 'numeric',           // or 'enum'
    //       min: 0, max: 31,           // for numeric
    //       values: ['a', 'b', 'c'],   // for enum
    //       getValue: () => currentValue,
    //       setValue: (v) => { currentValue = v; },
    //       sensitivity: 0.2,          // optional, pixels per unit (default auto)
    //       onChange: (v) => { ... },  // optional callback after value changes
    //       formatValue: (v) => '...',  // optional display formatter for dropdown
    //       liveUpdate: false,         // optional, if true setValue called on arrow key nav
    //       closeOnSelect: true        // optional, if false dropdown stays open on click
    //   });

    draggableField: {
        _active: null,  // Current drag state
        _dropdown: {
            overlay: null,
            dialog: null,
            element: null,
            options: null,
            allValues: [],
            filteredValues: [],
            selectedIndex: 0,
            searchText: '',
            keyHandler: null
        },

        /**
         * Attach draggable behavior to an element
         */
        attach(element, options) {
            const DRAG_THRESHOLD = 5;

            // Idempotent: if already attached, just refresh the options and bail.
            // Use the _draggableOptions marker as the source of truth — the data-draggable
            // attribute can be stripped externally, which would otherwise cause a
            // second attach to stack duplicate listeners.
            if (element._draggableOptions) {
                element._draggableOptions = options;
                element.dataset.draggable = 'true'; // restore in case it was cleared
                return;
            }
            element._draggableOptions = options;

            // All listeners below read options from element._draggableOptions, so the
            // options passed to attach() can be replaced on subsequent calls.
            const opts = () => element._draggableOptions;

            element.style.cursor = 'ns-resize';
            element.dataset.draggable = 'true';
            if (!element.hasAttribute('tabindex')) {
                element.tabIndex = 0;
            }

            // Track focus so .is-interacting persists for arrow-key use
            element.addEventListener('focus', () => {
                element.classList.add('is-interacting');
            });
            element.addEventListener('blur', () => {
                // Don't drop interacting state while our dropdown is open for this element
                if (this.isDropdownOpen() && this._dropdown.element === element) return;
                element.classList.remove('is-interacting');
            });

            // Arrow-key increment/decrement when focused (dropdown closed)
            element.addEventListener('keydown', (e) => {
                if (this.isDropdownOpen()) return; // dropdown's own handler takes over
                if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;

                e.preventDefault();
                e.stopImmediatePropagation();

                const options = opts();
                const cur = options.getValue();
                let next;
                if (options.type === 'enum') {
                    const idx = options.values.indexOf(cur);
                    const step = e.key === 'ArrowUp' ? -1 : 1;
                    const newIdx = Math.max(0, Math.min(options.values.length - 1, idx + step));
                    next = options.values[newIdx];
                } else {
                    const step = e.key === 'ArrowUp' ? 1 : -1;
                    const lo = options.min !== undefined ? options.min : 0;
                    const hi = options.max !== undefined ? options.max : 100;
                    next = Math.max(lo, Math.min(hi, cur + step));
                }

                if (next !== cur) {
                    options.setValue(next);
                    if (options.onChange) options.onChange(next);
                }
            });

            // Pointer Events (unified mouse/touch/pen). Replaces the old
            // mousedown/mousemove/mouseup trio so drag-to-scrub works on
            // touch devices — the mouse path fell apart on touch because
            // touchmove doesn't dispatch synthetic mousemove events until
            // the touch ends.
            //
            // setPointerCapture keeps events flowing to this element even if
            // the finger drifts off, so the drag doesn't cut out unexpectedly.
            element.style.touchAction = 'none'; // block browser scroll during drag
            element.addEventListener('pointerdown', (e) => {
                // Only respond to the primary pointer — ignore extra fingers
                // during a pinch-zoom gesture, for example.
                if (!e.isPrimary) return;
                e.preventDefault();

                // Mark this element as the active interaction target and lock out other draggables
                element.focus();
                element.classList.add('is-interacting');
                document.body.classList.add('draggable-dragging');
                try { element.setPointerCapture(e.pointerId); } catch {}

                const options = opts();
                const startY = e.clientY;
                const startX = e.clientX;
                const startValue = options.getValue();

                // Calculate sensitivity based on range
                let sensitivity = options.sensitivity;
                if (sensitivity === undefined) {
                    if (options.type === 'enum') {
                        // For enums: larger lists need lower sensitivity
                        const count = options.values.length;
                        sensitivity = count > 20 ? 0.1 : (count > 10 ? 0.15 : 0.25);
                    } else {
                        // For numeric: scale based on range
                        const range = (options.max || 100) - (options.min || 0);
                        sensitivity = range > 100 ? 1.0 : (range > 20 ? 0.5 : 0.2);
                    }
                }

                let dragStarted = false;
                let lastValue = startValue;

                const onMove = (moveEvent) => {
                    const deltaY = startY - moveEvent.clientY;

                    // Check threshold
                    if (!dragStarted && Math.abs(deltaY) < DRAG_THRESHOLD) {
                        return;
                    }
                    dragStarted = true;

                    let newValue;
                    if (options.type === 'enum') {
                        // For enum: delta moves through list
                        // Drag up = earlier items (lower index), drag down = later items (higher index)
                        const startIndex = options.values.indexOf(startValue);
                        const indexDelta = Math.round(-deltaY * sensitivity); // Negate for natural direction
                        let newIndex = startIndex + indexDelta;
                        newIndex = Math.max(0, Math.min(options.values.length - 1, newIndex));
                        newValue = options.values[newIndex];
                    } else {
                        // For numeric: delta changes value
                        newValue = startValue + Math.round(deltaY * sensitivity);
                        newValue = Math.max(options.min || 0, Math.min(options.max || 100, newValue));
                    }

                    if (newValue !== lastValue) {
                        lastValue = newValue;
                        options.setValue(newValue);
                        if (options.onChange) {
                            options.onChange(newValue);
                        }
                    }
                };

                const onUp = () => {
                    element.removeEventListener('pointermove', onMove);
                    element.removeEventListener('pointerup', onUp);
                    element.removeEventListener('pointercancel', onUp);
                    document.body.classList.remove('draggable-dragging');
                    try { element.releasePointerCapture(e.pointerId); } catch {}
                    this._active = null;

                    // If no drag happened, it was a tap - toggle dropdown
                    if (!dragStarted) {
                        // If dropdown is already open for this element, close it
                        if (this.isDropdownOpen() && this._dropdown.element === element) {
                            this._hideDropdown();
                        } else {
                            this._showDropdown(element, options, startX, startY);
                        }
                    }
                };

                element.addEventListener('pointermove', onMove);
                element.addEventListener('pointerup', onUp);
                element.addEventListener('pointercancel', onUp);
                this._active = { element, options };
            });
        },

        /**
         * Check if a drag is currently active
         */
        isActive() {
            return this._active !== null;
        },

        /**
         * Check if dropdown is open
         */
        isDropdownOpen() {
            return this._dropdown.overlay && this._dropdown.overlay.style.display === 'block';
        },

        /**
         * Show the dropdown picker
         */
        _showDropdown(element, options, x, y) {
            const dd = this._dropdown;
            dd.element = element;
            dd.options = options;
            dd.searchText = '';

            // Build list of values
            if (options.type === 'enum') {
                dd.allValues = options.values.slice();
            } else {
                // Numeric: create array of values
                dd.allValues = [];
                for (let v = options.min || 0; v <= (options.max || 100); v++) {
                    dd.allValues.push(v);
                }
            }

            dd.filteredValues = dd.allValues.slice();

            // Find current value's index
            const currentValue = options.getValue();
            dd.selectedIndex = dd.filteredValues.indexOf(currentValue);
            if (dd.selectedIndex < 0) dd.selectedIndex = 0;

            // Create overlay if needed
            if (!dd.overlay) {
                this._createDropdownElements();
            }

            // Add keyboard handler
            this._addKeyHandler();

            // Show and position. Width matches the host element so dropdown
            // entries can use its full width for structured layouts.
            dd.overlay.style.display = 'block';
            const rect = element.getBoundingClientRect();
            dd.dialog.style.left = rect.left + 'px';
            dd.dialog.style.top = (rect.bottom + 2) + 'px';
            dd.dialog.style.width = rect.width + 'px';

            // Clear any leftover search text from a previous open.
            if (dd.search) dd.search.value = '';

            this._renderDropdown();

            // Center the currently-selected item in the visible area on initial open.
            // (Subsequent renders during arrow-key nav use 'nearest' to avoid jumping.)
            const scrollContainer = dd.itemsContainer || dd.dialog;
            const selectedEl = scrollContainer.querySelector('.draggable-dropdown-item.selected');
            if (selectedEl) {
                scrollContainer.scrollTop = selectedEl.offsetTop
                    - (scrollContainer.clientHeight - selectedEl.clientHeight) / 2;
            }

            // Adjust if off-screen
            requestAnimationFrame(() => {
                const dialogRect = dd.dialog.getBoundingClientRect();
                if (dialogRect.right > window.innerWidth) {
                    dd.dialog.style.left = (window.innerWidth - dialogRect.width - 10) + 'px';
                }
                if (dialogRect.bottom > window.innerHeight) {
                    dd.dialog.style.top = (rect.top - dialogRect.height - 2) + 'px';
                }
            });

            // Focus the search input so mobile users get the OS keyboard.
            // On desktop it's a mild convenience — arrow keys still work.
            // Called from within a user-gesture handler (pointer tap), so
            // iOS Safari's focus-in-gesture restriction is satisfied.
            if (dd.search) {
                try { dd.search.focus(); } catch {}
            }
        },

        /**
         * Hide the dropdown
         */
        _hideDropdown() {
            const dd = this._dropdown;
            if (dd.overlay) {
                dd.overlay.style.display = 'none';
            }
            if (dd.keyHandler) {
                document.removeEventListener('keydown', dd.keyHandler, true);
                dd.keyHandler = null;
            }
            // Restore focus to the field so arrow keys keep working after close
            if (dd.element) {
                dd.element.focus();
            }
            dd.element = null;
            dd.options = null;
        },

        /**
         * Create dropdown DOM elements
         */
        _createDropdownElements() {
            const dd = this._dropdown;

            dd.overlay = document.createElement('div');
            dd.overlay.className = 'draggable-dropdown-overlay';
            dd.overlay.onclick = (e) => {
                if (e.target === dd.overlay) {
                    this._hideDropdown();
                }
            };

            dd.dialog = document.createElement('div');
            dd.dialog.className = 'draggable-dropdown';

            // Text input at the top of the dropdown. Two purposes:
            //   1. On mobile, focusing it summons the OS keyboard so the user
            //      can actually type — the existing document-level keydown
            //      handler only works if the OS provides key events, which
            //      requires a focused input on touch devices.
            //   2. On desktop, it's a visible affordance for "you can type to
            //      filter this list" that used to be implicit.
            // `font-size: 16px` prevents iOS from zooming the page on focus.
            dd.search = document.createElement('input');
            dd.search.type = 'text';
            dd.search.className = 'draggable-dropdown-search';
            dd.search.autocomplete = 'off';
            dd.search.autocapitalize = 'off';
            dd.search.spellcheck = false;
            dd.search.setAttribute('inputmode', 'search');
            dd.search.style.fontSize = '16px';
            dd.search.placeholder = 'type to filter';

            // Input events update dd.searchText and re-filter. This is the
            // authoritative path on mobile — the document-level keydown
            // handler skips itself when the search input is focused.
            dd.search.addEventListener('input', () => {
                dd.searchText = dd.search.value;
                this._filterDropdown();
            });

            // Route navigation keys (Arrows / Enter / Escape) to the same
            // logic the document-level handler uses. Prevent default so the
            // Arrow keys don't move the input's caret and Enter doesn't
            // submit a stray form ancestor.
            dd.search.addEventListener('keydown', (e) => {
                switch (e.key) {
                    case 'ArrowUp':
                        e.preventDefault();
                        if (dd.selectedIndex > 0) {
                            dd.selectedIndex--;
                            this._renderDropdown();
                            if (dd.options.liveUpdate) this._applySelectedValue();
                        }
                        break;
                    case 'ArrowDown':
                        e.preventDefault();
                        if (dd.selectedIndex < dd.filteredValues.length - 1) {
                            dd.selectedIndex++;
                            this._renderDropdown();
                            if (dd.options.liveUpdate) this._applySelectedValue();
                        }
                        break;
                    case 'Enter':
                        e.preventDefault();
                        this._selectDropdownItem(dd.selectedIndex, true);
                        break;
                    case 'Escape':
                        e.preventDefault();
                        this._hideDropdown();
                        break;
                }
            });

            dd.dialog.appendChild(dd.search);

            // Items container — separate from the search input so scrolling
            // the list doesn't scroll the input off-screen on mobile.
            dd.itemsContainer = document.createElement('div');
            dd.itemsContainer.className = 'draggable-dropdown-items';
            dd.dialog.appendChild(dd.itemsContainer);

            dd.overlay.appendChild(dd.dialog);
            document.body.appendChild(dd.overlay);
        },

        /**
         * Add keyboard handler for dropdown navigation
         */
        _addKeyHandler() {
            const dd = this._dropdown;
            if (dd.keyHandler) return; // Already attached

            dd.keyHandler = (e) => {
                if (!this.isDropdownOpen()) return;

                // If the dropdown's search input has focus (default on
                // mobile, or if the user clicked into it on desktop), let
                // its own keydown handler process the key. Skipping here
                // prevents double-handling and keeps typed characters
                // flowing to the input naturally.
                if (dd.search && document.activeElement === dd.search) return;

                // Use stopImmediatePropagation to prevent other document-level handlers from seeing these keys
                switch (e.key) {
                    case 'ArrowUp':
                        e.preventDefault();
                        e.stopImmediatePropagation();
                        if (dd.selectedIndex > 0) {
                            dd.selectedIndex--;
                            this._renderDropdown();
                            // If liveUpdate, apply value immediately
                            if (dd.options.liveUpdate) {
                                this._applySelectedValue();
                            }
                        }
                        break;
                    case 'ArrowDown':
                        e.preventDefault();
                        e.stopImmediatePropagation();
                        if (dd.selectedIndex < dd.filteredValues.length - 1) {
                            dd.selectedIndex++;
                            this._renderDropdown();
                            // If liveUpdate, apply value immediately
                            if (dd.options.liveUpdate) {
                                this._applySelectedValue();
                            }
                        }
                        break;
                    case 'Enter':
                        e.preventDefault();
                        e.stopImmediatePropagation();
                        this._selectDropdownItem(dd.selectedIndex, true); // true = close dropdown
                        break;
                    case 'Escape':
                        e.preventDefault();
                        e.stopImmediatePropagation();
                        this._hideDropdown();
                        break;
                    case 'Backspace':
                        e.preventDefault();
                        e.stopImmediatePropagation();
                        if (dd.searchText.length > 0) {
                            dd.searchText = dd.searchText.slice(0, -1);
                            this._filterDropdown();
                        }
                        break;
                    default:
                        // Typing - add to search if printable
                        if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
                            e.preventDefault();
                            e.stopImmediatePropagation();
                            dd.searchText += e.key;
                            this._filterDropdown();
                        }
                        break;
                }
            };
            document.addEventListener('keydown', dd.keyHandler, true); // Capture phase to run before other handlers
        },

        /**
         * Filter dropdown values based on search text
         */
        _filterDropdown() {
            const dd = this._dropdown;
            const search = dd.searchText.toLowerCase();

            if (!search) {
                dd.filteredValues = dd.allValues.slice();
            } else {
                dd.filteredValues = dd.allValues.filter(v => {
                    const display = this._formatDropdownValue(v, dd.options);
                    return display.toLowerCase().startsWith(search);
                });
            }

            dd.selectedIndex = 0;
            this._renderDropdown();
        },

        /**
         * Format a value for display
         */
        _formatDropdownValue(value, options) {
            if (options.formatValue) {
                return options.formatValue(value);
            }
            return String(value);
        },

        /**
         * Render the dropdown contents
         */
        _renderDropdown() {
            const dd = this._dropdown;
            // Only clear the items container — leave the search input and any
            // other chrome at the top of the dialog intact.
            const container = dd.itemsContainer || dd.dialog;
            container.innerHTML = '';

            if (dd.filteredValues.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'draggable-dropdown-empty';
                empty.textContent = 'no match';
                container.appendChild(empty);
                return;
            }

            dd.filteredValues.forEach((value, index) => {
                const item = document.createElement('div');
                item.className = 'draggable-dropdown-item' + (index === dd.selectedIndex ? ' selected' : '');

                // Custom rendering hook for structured items (e.g. multi-line).
                // formatValue is still used for typed-search matching.
                if (typeof dd.options.renderItem === 'function') {
                    const content = dd.options.renderItem(value);
                    if (content instanceof Node) {
                        item.appendChild(content);
                    } else {
                        item.innerHTML = String(content);
                    }
                } else {
                    const display = this._formatDropdownValue(value, dd.options);

                    // Highlight matching text if searching
                    if (dd.searchText) {
                        const matchLen = dd.searchText.length;
                        const displayLower = display.toLowerCase();
                        const searchLower = dd.searchText.toLowerCase();

                        if (displayLower.startsWith(searchLower)) {
                            const matchSpan = document.createElement('span');
                            matchSpan.className = 'match-highlight';
                            matchSpan.textContent = display.substring(0, matchLen);
                            item.appendChild(matchSpan);
                            item.appendChild(document.createTextNode(display.substring(matchLen)));
                        } else {
                            item.textContent = display;
                        }
                    } else {
                        item.textContent = display;
                    }
                }

                item.onclick = () => this._selectDropdownItem(index);
                container.appendChild(item);
            });

            // Scroll selected into view
            const selected = dd.dialog.querySelector('.draggable-dropdown-item.selected');
            if (selected) {
                selected.scrollIntoView({ block: 'nearest' });
            }
        },

        /**
         * Apply the currently selected value without closing dropdown
         */
        _applySelectedValue() {
            const dd = this._dropdown;
            if (dd.selectedIndex < 0 || dd.selectedIndex >= dd.filteredValues.length) return;

            const value = dd.filteredValues[dd.selectedIndex];
            dd.options.setValue(value);
            if (dd.options.onChange) {
                dd.options.onChange(value);
            }
        },

        /**
         * Select an item from the dropdown
         * @param {number} index - Index in filteredValues
         * @param {boolean} forceClose - If true, always close. If false, respect closeOnSelect option.
         */
        _selectDropdownItem(index, forceClose = false) {
            const dd = this._dropdown;

            if (index < 0 || index >= dd.filteredValues.length) {
                this._hideDropdown();
                return;
            }

            const value = dd.filteredValues[index];
            dd.options.setValue(value);
            if (dd.options.onChange) {
                dd.options.onChange(value);
            }

            // Close dropdown unless closeOnSelect is explicitly false
            const shouldClose = forceClose || (dd.options.closeOnSelect !== false);
            if (shouldClose) {
                this._hideDropdown();
            } else {
                // Just update selection visually
                this._renderDropdown();
            }
        }
    },

    // =========================================================================
    // PREVIEW LOADER
    // =========================================================================
    // Browse files on a disk with live preview — the GameMaker-original loading
    // UX. Currently used for sprites; built so scene-maker (and any other visual
    // tool) can plug in by passing a renderer.
    //
    // Behaviour:
    // - Lists files of the given type on the disk; bails out with a flashing
    //   message if there are none.
    // - Saves the tool's current state on entry so a Cancel can restore it.
    // - Shows "load FILENAME? yes  no" in the message area. The filename is a
    //   GMTools.draggableField so users can drag/type/arrow-key through files.
    // - ArrowUp/Down cycle. Enter / 'y' / clicking 'yes' commits. Escape /
    //   'n' / clicking 'no' cancels.
    // - Every cycle calls onPreview(fileName, fileData) so the tool can update
    //   its display in place.
    //
    // Usage:
    //   GMTools.previewLoader.enter({
    //       disk,                          // GMDisk instance
    //       fileType,                      // GMDisk.FILE_TYPES.SPRITE | .SCENE
    //       messageArea,                   // DOM element for the prompt UI
    //       emptyMessage: 'no sprites on disk',
    //       saveState:  () => {...stateObj...},
    //       onPreview:  (fileName, fileData) => { ... draw ... },
    //       onConfirm:  (fileName, fileData) => { ... commit ... },
    //       onCancel:   (savedState) => { ... restore from saveState() ... },
    //       onExit:     () => { ... optional, fires after confirm or cancel ... }
    //   });

    previewLoader: {
        _active: false,
        _files: [],
        _currentIndex: 0,
        _savedState: null,
        _options: null,
        _keyHandler: null,

        isActive() {
            return this._active;
        },

        currentIndex() {
            return this._currentIndex;
        },

        files() {
            return this._files;
        },

        enter(options) {
            if (this._active) return false;

            // No disk mounted OR disk has no files of this type — either way,
            // flash the same "empty" message. Caller sees the same "there's
            // nothing to preview here" outcome without having to distinguish.
            const files = options.disk ? options.disk.listFiles(options.fileType) : [];
            if (files.length === 0) {
                GMTools.flashingMessage.show(options.messageArea, options.emptyMessage || 'no files on disk');
                const dismiss = () => {
                    GMTools.flashingMessage.hide();
                    options.messageArea.innerHTML = '';
                    document.removeEventListener('click', dismiss, true);
                };
                document.addEventListener('click', dismiss, true);
                return false;
            }

            this._active = true;
