            this._files = files;
            this._currentIndex = 0;
            this._options = options;
            this._savedState = options.saveState ? options.saveState() : null;

            this._keyHandler = (e) => this._onKey(e);
            document.addEventListener('keydown', this._keyHandler);

            this._preview(0);
            return true;
        },

        exit() {
            if (!this._active) return;
            this._active = false;

            if (this._keyHandler) {
                document.removeEventListener('keydown', this._keyHandler);
                this._keyHandler = null;
            }
            GMTools.flashingMessage.hide();
            if (this._options && this._options.messageArea) {
                this._options.messageArea.innerHTML = '';
            }

            const opts = this._options;
            this._options = null;
            this._files = [];
            this._currentIndex = 0;
            this._savedState = null;

            if (opts && opts.onExit) opts.onExit();
        },

        confirm() {
            if (!this._active) return;
            const entry = this._files[this._currentIndex];
            const opts = this._options;
            const data = opts.disk.loadFile(entry.fileName);
            if (opts.onConfirm) opts.onConfirm(entry.fileName, data);
            this.exit();
        },

        cancel() {
            if (!this._active) return;
            const opts = this._options;
            const saved = this._savedState;
            if (opts.onCancel) opts.onCancel(saved);
            this.exit();
        },

        /**
         * Jump to a specific file by index. Called by the draggable filename
         * field and by internal arrow-key handling.
         */
        previewAtIndex(index) {
            if (!this._active) return;
            if (index < 0 || index >= this._files.length) return;
            if (index === this._currentIndex) return;
            this._preview(index);
        },

        _preview(index) {
            this._currentIndex = index;
            const entry = this._files[index];
            const data = this._options.disk.loadFile(entry.fileName);
            if (!data) return;
            try {
                this._options.onPreview(entry.fileName, data);
            } catch (e) {
                console.error('previewLoader: onPreview threw:', e);
            }
            this._renderMessage();
        },

        _renderMessage() {
            const opts = this._options;
            const entry = this._files[this._currentIndex];
            const ext = (opts.fileType && opts.fileType.extension) || '';
            // Strip extension and lowercase; trailing space from 6-char padding kept as-is.
            const display = (ext ? entry.fileName.replace(new RegExp(ext.replace('/', '\\/') + '$', 'i'), '') : entry.fileName).toLowerCase();

            const area = opts.messageArea;
            // Down-arrow trick: C64 font only ships ↑ (matches the historical
            // C64 keyboard) — no ↓. Rotating a ↑ span 180° via CSS gives a
            // pixel-perfect ↓ in the same C64 style, since it IS the same
            // glyph. Cheaper than an inline SVG or font patch.
            const arrowDown = '<span style="display:inline-block; transform:rotate(180deg)">↑</span>';
            area.innerHTML =
                '<span style="color: var(--c64-yellow)">load </span>' +
                '<span class="load-filename" style="color: var(--c64-white); background: var(--c64-blue); padding: 0 4px">' + display + '</span>' +
                '<span style="color: var(--c64-yellow)">? (↑' + arrowDown + ' to preview)</span><br>' +
                '<span class="load-yes gm-yes-no">yes</span>' +
                '<span style="display: inline-block; width: 80px"></span>' +
                '<span class="load-no gm-yes-no">no</span>';

            area.querySelector('.load-yes').addEventListener('click', () => this.confirm());
            area.querySelector('.load-no').addEventListener('click', () => this.cancel());

            // Filename is draggable so users can scrub/click-pick/type-search through files
            const filenameSpan = area.querySelector('.load-filename');
            GMTools.draggableField.attach(filenameSpan, {
                type: 'enum',
                values: this._files.map(f => f.fileName),
                getValue: () => this._files[this._currentIndex].fileName,
                setValue: (fileName) => {
                    const newIndex = this._files.findIndex(f => f.fileName === fileName);
                    if (newIndex >= 0 && newIndex !== this._currentIndex) {
                        this._preview(newIndex);
                    }
                },
                formatValue: (fileName) => {
                    const slashIndex = fileName.indexOf('/');
                    return (slashIndex > 0 ? fileName.substring(0, slashIndex) : fileName).toLowerCase().trim();
                },
                liveUpdate: true,
                closeOnSelect: false
            });
        },

        _onKey(e) {
            if (!this._active) return;
            switch (e.key) {
                case 'ArrowUp':
                    e.preventDefault();
                    if (this._currentIndex > 0) this._preview(this._currentIndex - 1);
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    if (this._currentIndex < this._files.length - 1) this._preview(this._currentIndex + 1);
                    break;
                case 'Enter':
                case 'y':
                case 'Y':
                    e.preventDefault();
                    this.confirm();
                    break;
                case 'Escape':
                case 'n':
                case 'N':
                    e.preventDefault();
                    this.cancel();
                    break;
            }
        }
    },

    // =========================================================================
    // CLICK COOLDOWN
    // =========================================================================
    // Briefly block clicks on a morphing button. Use case: after a button label
    // swaps (e.g. "ok" → "quit" when exiting a submode), a rapid second click
    // would fire the new action unintentionally. armCooldown installs a
    // capture-phase guard for `ms` milliseconds that swallows clicks before
    // they reach the button's onclick handler.
    //
    // Usage:
    //   document.getElementById('btnQuit').textContent = 'quit';
    //   GMTools.armClickCooldown(document.getElementById('btnQuit'));

    armClickCooldown(button, ms = 300) {
        if (!button) return;
        const block = (e) => {
            e.stopImmediatePropagation();
            e.preventDefault();
        };
        button.addEventListener('click', block, true);
        setTimeout(() => button.removeEventListener('click', block, true), ms);
    },

    // =========================================================================
    // SESSION PERSISTENCE
    // =========================================================================
    // Per-editor "what was I working on" buffer in localStorage. Editors call
    // .save() on each edit (typically debounced) and .load() on init to restore.
    // The shape of the saved blob is editor-specific — usually serialized bytes
    // of the current item + filename + small bits of UI state.
    //
    // Disks live in their own shared pool (see GMDisk). The session is the
    // *unsaved* in-progress work alongside that.
    //
    // Usage:
    //   GMTools.session.save('sprite-maker', { bytes, fileName, frame, quad });
    //   const restored = GMTools.session.load('sprite-maker'); // or null
    //   GMTools.session.clear('sprite-maker');
    //
    //   // Convenience: debounced saver — pass a function that builds the blob,
    //   // call the returned function on every edit, it writes once per idle period.
    //   const saveSession = GMTools.session.debouncedSaver('sprite-maker', () => ({
    //       bytes: bytesToBase64(currentSprite.serialize()),
    //       fileName: currentSpriteFileName,
    //       frame: currentFrame
    //   }));
    //   // call saveSession() after any edit; the write fires 500ms after the last call.

    session: {
        _key(name) { return 'gm_session_' + name; },

        save(name, blob) {
            try {
                localStorage.setItem(this._key(name), JSON.stringify(blob));
            } catch (e) {
                console.warn('GMTools.session.save failed:', e.message);
            }
        },

        load(name) {
            const raw = localStorage.getItem(this._key(name));
            if (!raw) return null;
            try {
                return JSON.parse(raw);
            } catch (e) {
                console.warn('GMTools.session.load: corrupt session, ignoring');
                return null;
            }
        },

        clear(name) {
            localStorage.removeItem(this._key(name));
        },

        debouncedSaver(name, build, ms = 500) {
            let timer = null;
            return () => {
                if (timer) clearTimeout(timer);
                timer = setTimeout(() => {
                    try {
                        const blob = build();
                        if (blob) this.save(name, blob);
                    } catch (e) {
                        console.warn('GMTools.session: build failed:', e.message);
                    }
                }, ms);
            };
        },

        // Convert Uint8Array → base64 in chunks so large payloads don't blow
        // String.fromCharCode.apply's argument limit. Same trick as gmDisk uses.
        bytesToBase64(bytes) {
            const CHUNK = 0x8000;
            let binary = '';
            for (let i = 0; i < bytes.length; i += CHUNK) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
            }
            return btoa(binary);
        },

        base64ToBytes(b64) {
            const binary = atob(b64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes;
        }
    },

    // === SAVE DIALOG (removed) ===
    // Was an in-app GM-style save UI (filename input + overwrite confirm).
    // Save now happens exclusively through the d64 popup's Save button,
    // which handles the same input + confirm flow natively. `git log --all
    // -S "saveDialog:"` to recover the code if the two paths ever diverge.

    // =========================================================================
    // FLASHING MESSAGE
    // =========================================================================
    // Displays a message that flashes between two colors. This is the *only*
    // genuinely flashing API in the suite. For the other "message" patterns:
    //   - disk.showInfoMessage(text, opts): static info text in the disk popup's
    //     info-bar that auto-clears after a timeout.
    //   - per-page showMessage / clearMessage (scene-maker, sprite-maker):
    //     static text in the page's own message area, no auto-clear.
    // Use flashingMessage when you specifically want the alternating-color
    // alarm effect; use the others for static informational text.
    //
    // Usage:
    //   GMTools.flashingMessage.show(element, 'no files on disk', {
    //       color1: 'yellow',      // CSS color or C64 index
    //       color2: 'lt-blue',     // CSS color or C64 index
    //       interval: 250          // ms between color changes (default 250 for 2Hz)
    //   });
    //   GMTools.flashingMessage.hide();

    flashingMessage: {
        _element: null,
        _intervalId: null,
        _isColor1: true,

        /**
         * Show a flashing message
         */
        show(element, text, options = {}) {
            this.hide(); // Clear any existing

            this._element = element;

            // Default colors: yellow and lt-blue (C64 palette)
            const color1 = options.color1 || 'var(--c64-yellow)';
            const color2 = options.color2 || 'var(--c64-lt-blue)';
            const interval = options.interval || 250; // 250ms = 2 flashes per second

            element.textContent = text;
            element.style.color = color1;
            this._isColor1 = true;

            this._intervalId = setInterval(() => {
                this._isColor1 = !this._isColor1;
                element.style.color = this._isColor1 ? color1 : color2;
            }, interval);
        },

        /**
         * Hide the flashing message and clear interval
         */
        hide() {
            if (this._intervalId) {
                clearInterval(this._intervalId);
                this._intervalId = null;
            }
            if (this._element) {
                this._element.style.color = '';
                this._element = null;
            }
        },

        /**
         * Check if a message is currently flashing
         */
        isActive() {
            return this._intervalId !== null;
        }
    },

    // =========================================================================
    // QUIT MENU
    // =========================================================================
    // Shows a navigation menu popup for switching between GM tools.
    // Gray3 box with lopsided border, blue text links.
    // Click outside or press Escape to dismiss.
    //
    // Usage:
    //   GMTools.quitMenu.show();

    quitMenu: {
        _overlay: null,
        _keyHandler: null,

        show() {
            if (this._overlay) return; // Already showing

            // Attach to the tool's #screen if present so the menu covers exactly
            // the tool's work area; otherwise fall back to a full-viewport overlay.
            const host = document.getElementById('screen') || document.body;
            const screenFit = host.id === 'screen';

            this._overlay = document.createElement('div');
            this._overlay.className = 'quit-menu-overlay' + (screenFit ? ' screen-fit' : '');
            this._overlay.innerHTML = `
                <div class="quit-menu-outer">
                    <div class="quit-menu-container">
                        <div class="quit-menu-box">
                            <a href="program-editor.html">program editor</a>
                            <a href="sprite-maker.html">sprite maker</a>
                            <a href="sound-maker.html">sound maker</a>
                            <a href="scene-maker.html">scene maker</a>
                            <a href="music-maker.html">music maker</a>
                        </div>
                    </div>
                </div>
            `;

            // Click outside menu box to dismiss
            this._overlay.onclick = (e) => {
                const cl = e.target.classList;
                if (e.target === this._overlay || cl.contains('quit-menu-outer') || cl.contains('quit-menu-container')) {
                    this.hide();
                }
            };

            // Escape to dismiss
            this._keyHandler = (e) => {
                if (e.key === 'Escape') {
                    this.hide();
                    e.preventDefault();
                }
            };

            host.appendChild(this._overlay);
            document.addEventListener('keydown', this._keyHandler);
        },

        hide() {
            if (this._overlay) {
                this._overlay.remove();
                this._overlay = null;
            }
            if (this._keyHandler) {
                document.removeEventListener('keydown', this._keyHandler);
                this._keyHandler = null;
            }
        },

        isOpen() {
            return this._overlay !== null;
        }
    },

    // === URL-DRIVEN DISK LOADING ===
    // Shared helpers for the `?disk=<url>&file=<name>` URL scheme that
    // every editor page implements. Each editor wires its own
    // file-specific load callback; the disk fetch + pool insert + case-
    // insensitive directory lookup live here.

    /**
     * Fetch a .d64 from the given URL, validate it as a real D64 image,
     * insert it into the shared pool, and select it on the given gmDisk.
     *
     * Calls showMessage with a brief user-facing string for any error
     * along the way (CORS, 404, wrong file size, parse failure).
     *
     * @returns {Promise<boolean>} true if the disk was loaded + selected
     */
    async loadDiskFromUrl({ diskUrl, disk, showMessage }) {
        // Editors without a visible message area still get a console
        // fallback — silent failure makes URL bugs invisible to debug.
        const msg = (text) => { if (showMessage) showMessage(text); else console.warn(text); };
        try {
            let bytes;
            let displayName;

            // Magic alias: `?disk=demo` lazy-loads the bundled demo disk
            // (js/demo-disk-source.js) via dynamic <script> injection,
            // letting any editor honor the alias without preloading the
            // ~228KB bundle at page-init. Works on file:// too (script
            // tags don't have fetch's CORS restriction).
            if (diskUrl === 'demo') {
                bytes = await GMTools.getDemoDiskBytes();
                if (!bytes) {
                    msg(`couldn't load demo disk bundle`);
                    return false;
                }
                displayName = GMTools.DEMO_DISK_FILENAME;
            } else if (diskUrl.startsWith('pool:')) {
                // Cross-editor dispatch reference: the disk already lives
                // in the shared localStorage pool. Skip fetch + validate
                // + re-insert entirely — just resolve the pool id and
                // selectDisk. If the id is stale (user cleared their pool
                // between editors, or dispatch URL bookmarked), fall
                // through with a friendly error instead of a fetch attempt.
                const poolId = diskUrl.substring('pool:'.length);
                if (!disk.selectDisk(poolId)) {
                    msg(`disk not in local pool`);
                    return false;
                }
                return true;
            } else {
                const response = await fetch(diskUrl);
                if (!response.ok) {
                    msg(`couldn't load disk (HTTP ${response.status})`);
                    return false;
                }
                bytes = new Uint8Array(await response.arrayBuffer());
                try {
                    displayName = new URL(diskUrl, location.href).pathname.split('/').pop() || 'remote.d64';
                } catch (e) {
                    displayName = 'remote.d64';
                }
            }

            // Standard D64 sizes: 35-track (174,848) or 40-track (196,608).
            if (bytes.length !== 174848 && bytes.length !== 196608) {
                msg(`not a valid disk image (${bytes.length} bytes)`);
                return false;
            }
            const id = await GMDisk.addToPool(bytes, displayName);
            if (!disk.selectDisk(id)) {
                msg(`couldn't open disk`);
                return false;
            }
            return true;
        } catch (e) {
            msg(`couldn't load disk: ${e.message}`);
            return false;
        }
    },

    // Lazy loader for the bundled demo disk. The script is injected the
    // first time it's needed and the promise is cached, so concurrent
    // callers share one fetch and subsequent calls short-circuit.
    // Returns Uint8Array of disk bytes (or null if the bundle failed).
    _demoDiskPromise: null,
    getDemoDiskBytes() {
        if (globalThis._demoDiskBase64) {
            return Promise.resolve(GMTools._decodeBase64ToBytes(globalThis._demoDiskBase64));
        }
        if (!GMTools._demoDiskPromise) {
            GMTools._demoDiskPromise = new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = 'js/demo-disk-source.js';
                s.onload = () => {
                    if (globalThis._demoDiskBase64) {
                        resolve(GMTools._decodeBase64ToBytes(globalThis._demoDiskBase64));
                    } else {
                        GMTools._demoDiskPromise = null; // allow retry
                        reject(new Error('demo bundle loaded but _demoDiskBase64 missing'));
                    }
                };
                s.onerror = () => {
                    GMTools._demoDiskPromise = null; // allow retry
                    reject(new Error('failed to load js/demo-disk-source.js'));
                };
                document.head.appendChild(s);
            });
        }
        return GMTools._demoDiskPromise;
    },

    _decodeBase64ToBytes(b64) {
        const binary = atob(b64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
    },

    /**
     * First-visit convenience: if the shared disk pool is completely empty
     * (visitor has never touched an editor before), mount the bundled demo
     * disk so the file picker isn't a dead end. No file is opened — canvas
     * stays blank, `?disk=…` / `?play_demo=1` URL routes still win. Safe to
     * call from every editor on init: pool-check is synchronous, and
     * addToPool dedupes by SHA-256 so a concurrent `?disk=demo` won't
     * duplicate the entry.
     *
     * Fire-and-forget from callers: the demo bundle load is async but the
     * only observable effect is the file menu picking up the disk once it
     * lands (typically <100ms).
     */
    async ensureDemoDiskInPool(gmDisk) {
        if (GMDisk.getPool().length > 0) return;
        const bytes = await GMTools.getDemoDiskBytes();
        if (!bytes) return;
        const id = await GMDisk.addToPool(bytes, GMTools.DEMO_DISK_FILENAME);
        // Only claim the seeded disk if no URL-driven load beat us to it.
        if (!gmDisk.hasDisk()) gmDisk.selectDisk(id);
    },

    /**
     * Case-insensitive file lookup against a D64 disk's directory.
     * Returns the actual on-disk filename (preserving real case + space
     * padding so it can be passed straight to readFile), or null.
     */
    findFileCaseInsensitive(disk, fileName) {
        const target = fileName.toUpperCase();
        for (const entry of disk.getDirectory()) {
            if (entry.fileName.toUpperCase() === target) {
                return entry.fileName;
            }
        }
        return null;
    },

    /**
     * Return every filename on `disk` whose name ends with `ext` (case-
     * insensitive). Extension form matches the on-disk convention:
     * '/PRG', '/SPR', etc. Preserves each file's original casing +
     * space padding so entries can be passed directly to readFile.
     */
    listFilesByExtension(disk, ext) {
        const target = ext.toUpperCase();
        const out = [];
        for (const entry of disk.getDirectory()) {
            if (entry.fileName.toUpperCase().endsWith(target)) {
                out.push(entry.fileName);
            }
        }
        return out;
    },

    /**
     * Full URL-driven init for an editor page. Reads the `?disk=` /
     * `?file=` query params, fetches the disk, validates the file's
     * extension matches what this editor handles, then hands the loaded
     * bytes to the editor's own loader callback.
     *
     * Each editor passes its own `expectedExt` (e.g. '/SPR') and
     * `loadFile(name, bytes, params)` callback. The params object is
     * passed through so callers can read extras like `?play=1`.
     *
     * Missing-`file=` behavior: if `?disk=` is present without `?file=`,
     * we enumerate all files on the disk matching `expectedExt`.
     *   0 matches → error message via showMessage
     *   1 match  → auto-load it (no picker; there's nothing to choose)
     *   2+ matches → invoke the caller-provided `showPicker(names, onPick)`
     *                callback if given; otherwise no-op silently.
     * That's how each editor gets "just show me the picker" behavior for
     * free when someone shares a `?disk=` link with no file specified.
     *
     * `params` is optional. If omitted, we read `location.search`. Pass
     * a synthesized URLSearchParams to dispatch a load without changing
     * the browser URL — used by program-editor.html's `?play_demo=1` alias,
     * which rewrites itself to `disk=demo&file=GMC64I/PRG&play=1&…`.
     *
     * No-op when `?disk=` isn't in the URL. Surfaces all errors via
     * showMessage; nothing throws.
     */
    async initFromUrl({ disk, showMessage, expectedExt, loadFile, showPicker, params }) {
        const msg = (text) => { if (showMessage) showMessage(text); else console.warn(text); };
        if (!params) params = new URLSearchParams(location.search);
        if (!params.has('disk')) return;

        const ok = await GMTools.loadDiskFromUrl({
            diskUrl: params.get('disk'), disk, showMessage
        });
        if (!ok) return;

        const proceed = (actualName) => {
            const fileData = disk.disk.readFile(actualName);
            if (!fileData) return msg(`couldn't read "${actualName}"`);
            loadFile(actualName, fileData, params);
        };

        const fileName = params.get('file');
        if (!fileName) {
            // No `?file=` — auto-load if there's only one candidate,
            // hand off to the picker if there are multiple.
            const matches = GMTools.listFilesByExtension(disk.disk, expectedExt);
            if (matches.length === 0) {
                return msg(`no ${expectedExt.replace('/', '.')} files on disk`);
            }
            if (matches.length === 1) return proceed(matches[0]);
            if (showPicker) showPicker(matches, proceed);
            return;
        }

        const actualName = GMTools.findFileCaseInsensitive(disk.disk, fileName);
        if (!actualName) return msg(`"${fileName}" not on disk`);
        if (!actualName.toUpperCase().endsWith(expectedExt.toUpperCase())) {
            // Standalone exports have no GM extension but ARE program files:
            // the program editor's loader sniffs the $0302 self-launch magic
            // and converts them via standaloneToPRG. So when the program
            // editor (expectedExt /PRG) is handed an extension-less file
            // that starts with $0302, let it through rather than rejecting
            // on the extension mismatch — the dispatch from other editors'
            // disk popups relies on this path. Genuine type mismatches
            // (a /SPR opened in the program editor, etc.) still bounce.
            const data = disk.disk.readFile(actualName);
            const isStandalone = data && data.length >= 2 && data[0] === 0x02 && data[1] === 0x03;
            if (!(expectedExt.toUpperCase() === '/PRG' && isStandalone)) {
                const ext = actualName.split('/').pop().toLowerCase();
                const target = {
                    prg: 'program-editor', spr: 'sprite-maker', pic: 'scene-maker',
                    snd: 'sound-maker', sng: 'music-maker'
                }[ext];
                return msg(target ? `"${actualName}" is a ${ext} — try ${target}.html` : `wrong file type`);
            }
        }
        proceed(actualName);
    }
};
</script>
<script>/*
 * GameMaker Opcodes Definition File
 *
 * This file defines all 103 GameMaker instructions with explicit argument specification.
 *
 * === CRITICAL: ARGUMENT ALIGNMENT ===
 * The template MUST match which argument the runtime (gmRuntime.js) actually uses!
 *
 * GameMaker bytecode quirk: Many "single argument" opcodes store the value in arg2,
 * leaving arg1 as 0/unused. If the template says {type:1} but runtime uses arg2,
 * the display will be wrong (e.g., variable 'a' showing as '`' backtick).
 *
 * When adding/modifying opcodes:
 * 1. Check gmRuntime.js to see which arg (arg1 or arg2) is actually used
 * 2. Template must reference the correct arg: {type:1} for arg1, {type:2} for arg2
 * 3. Args array must match: ['type'] for arg1-only, ['unused', 'type'] for arg2-only
 *
 * Examples of arg2-only opcodes (arg1 unused):
 *   0x01 jump to label l001      - label in arg2
 *   0x02 jump to label l[a]      - variable in arg2
 *   0x2E display scene X         - scene in arg2
 *   0x3D print value of [a]      - variable in arg2
 *   0x53 clear scene X           - scene in arg2
 *   0x67 clear sprite X          - sprite in arg2
 *
 * Template syntax:
 *   {type:1} - arg1 value formatted according to type
 *   {type:2} - arg2 value formatted according to type
 *   Literal text is included as-is
 *
 * Types:
 *   var        - Variable name (a-z), 1-based index
 *   num        - Numeric literal (0-255)
 *   label      - Label number (1-255), displayed as 3-digit padded
 *   sprite     - Sprite slot number (1-8)
 *   spriteName - Sprite data page name, resolved from data pages
 *   scene      - Scene index (1-2) or target (0=scene1, 1=scene2, 2=both)
 *   sceneName  - Scene data page name, resolved from data pages
 *   score      - Score index (1-2)
 *   scoreValue - Score value (0-100, scaled by 10)
 *   scoreComp  - Score comparison (0-255, scaled by 1000)
 *   color      - Color index in palette (0-15)
 *   colorSlot  - Color slot index (1-3 for scene colors)
 *   joystick   - Joystick number (1-2)
 *   joyDir     - Joystick direction (0=off,1=up,2=down,3=left,4=right)
 *   button     - Button number (1-2)
 *   channel    - Sound channel (1-3)
 *   sound      - Sound data page name
 *   song       - Song data page name
 *   volume     - Volume level (0-15)
 *   row        - Print row (0-24)
 *   col        - Print column (0-19)
 *   seconds    - Pause duration (0-255, scaled by 0.1)
 *   string     - String pointer, resolved from data pages
 *   animSpeed  - Animation speed (0-32)
 *   rndRange   - Random range (1-255)
 *   onOff      - On/off toggle (0=off, 1=on)
 *   overUnder  - Sprite priority (0=over, 1=under)
 *   direction  - Sprite direction (0-255 maps to 0-359 degrees)
 *   color23    - Shared color slot (2 or 3)
 */

const gmOpcodes = {
    // No operation / blank line
    0x00: {
        name: '',
        template: '',
        args: []
    },

    // === FLOW CONTROL ===

    0x01: {
        name: 'jump to label l001',
        template: 'jump to label l{label:2}',
        args: ['unused', 'label']
    },
    0x02: {
        name: 'jump to label l[a]',
        template: 'jump to label l[{var:2}]',
        args: ['unused', 'var']
    },
    0x03: {
        name: 'jump to subroutine at l001',
        template: 'jump to subroutine at l{label:2}',
        args: ['unused', 'label']
    },
    0x04: {
        name: 'jump to subroutine at l[a]',
        template: 'jump to subroutine at l[{var:2}]',
        args: ['unused', 'var']
    },
    0x05: {
        name: 'return from subroutine',
        template: 'return from subroutine',
        args: []
    },
    0x06: {
        name: 'stop program',
        template: 'stop program',
        args: []
    },

    // === VARIABLE OPERATIONS ===

    0x07: {
        name: 'set a = 000',
        template: 'set {var:1} = {num:2}',
        args: ['var', 'num']
    },
    0x08: {
        name: 'set a = [a]',
        template: 'set {var:1} = [{var:2}]',
        args: ['var', 'var']
    },
    0x09: {
        name: 'set a = rnd number 0 to 001',
        template: 'set {var:1} = rnd number 0 to {rndRange:2}',
        args: ['var', 'rndRange']
    },
    0x0A: {
        name: 'set a =value at data+[a]',
        template: 'set {var:1} =value at data+[{var:2}]',
        args: ['var', 'var']
    },
    0x0B: {
        name: 'set a = a + 000',
        template: 'set {var:1} = {var:1} + {num:2}',
        args: ['var', 'num']
    },
    0x0C: {
        name: 'set a = a + [a]',
        template: 'set {var:1} = {var:1} + [{var:2}]',
        args: ['var', 'var']
    },
    0x0D: {
        name: 'set a = a - 000',
        template: 'set {var:1} = {var:1} - {num:2}',
        args: ['var', 'num']
    },
    0x0E: {
        name: 'set a = a - [a]',
        template: 'set {var:1} = {var:1} - [{var:2}]',
        args: ['var', 'var']
    },
    0x0F: {
        name: 'set a = a x 000',
        template: 'set {var:1} = {var:1} x {num:2}',
        args: ['var', 'num']
    },
    0x10: {
        name: 'set a = a x [a]',
        template: 'set {var:1} = {var:1} x [{var:2}]',
        args: ['var', 'var']
    },

// Type formatters - convert raw arg value to display string
const gmTypeFormatters = {
    // Variable formatter: GM uses 1-based indexing (1='a', 2='b', ... 26='z')
    // If you see '`' (backtick, ASCII 96) instead of a letter, the template is
    // referencing the wrong arg (val=0 produces charCode 96). Check that the
    // template's {var:N} matches which arg the runtime actually uses.
    var: (val) => String.fromCharCode('a'.charCodeAt(0) + val - 1),
    num: (val) => String(val).padStart(3, '0'),
    label: (val) => String(val).padStart(3, '0'),
    sprite: (val) => String(val + 1),  // 0-based in bytecode, display as 1-based
    hitTarget: (val) => {
        // 0-7 = sprite 1-8, 8 = anyone, 9 = clr2/3
        if (val <= 7) return `sprite ${val + 1}`;
        if (val === 8) return 'anyone';
        if (val === 9) return 'clr2/3';
        return `sprite ${val + 1}`;
    },
    spriteName: (val, mediaStore) => mediaStore?.[val]?.name || '[      ]',
    scene: (val) => String(val + 1),  // 0-based in bytecode, display as 1-based
    sceneTarget: (val) => {
        if (val === 0) return 'scene1';
        if (val === 1) return 'scene2';
        if (val === 2) return 'both';
        return `scene${val}`;
    },
    sceneName: (val, mediaStore) => mediaStore?.[val]?.name || '[      ]',
    score: (val) => String(val + 1),  // 0-based in bytecode, display as 1-based
    scoreValue: (val) => String(val * 10).padStart(4, '0'),
    scoreComp: (val) => String(val * 1000).padStart(6, '0'),
    color: (val) => String(val).padStart(2, '0'),
    colorSlot: (val) => String(val + 1),  // 0-indexed in bytecode, display as 1-3
    plotColor: (val) => String(val),  // Plot color: 0=bg, 1-3=scene colors. 0-based display.
    sceneColorSlot: (val) => String(val).padStart(2, '0'),  // Scene color index 0-3
    colorName: (val, _, c64ColorNames) => c64ColorNames?.[val] || `color${val}`,
    color23: (val) => String(val + 1),  // Bytecode is 1-indexed (1=color2, 2=color3)
    joystick: (val) => String(val + 1),  // 0-based in bytecode, display as 1-based
    joyDir: (val) => ['up', 'down', 'left', 'right', 'off'][val] || 'off',
    button: (val) => String(val + 1),  // 0-based in bytecode, display as 1-based
    onOff: (val) => val ? 'off' : 'on',  // 0=on, 1=off in GM bytecode
    channel: (val) => String(val + 1),  // 0-based in bytecode, display as 1-based
    sound: (val, mediaStore) => mediaStore?.[val]?.name || '[      ]',
    song: (val, mediaStore) => mediaStore?.[val]?.name || '[      ]',
    volume: (val) => String(val).padStart(2, '0'),
    row: (val) => String(val).padStart(2, '0'),
    col: (val) => String(val).padStart(2, '0'),
    seconds: (val) => (val * 0.1).toFixed(1).padStart(4, '0'),  // "00.1", "01.0", "10.0", "25.5"
    string: (val, mediaStore) => mediaStore?.[val]?.name || '_____________________',
    animSpeed: (val) => String(val).padStart(3, '0'),
    rndRange: (val) => String(val).padStart(3, '0'),
    overUnder: (val) => val ? 'under' : 'over',
    alwaysOnce: (val) => val ? 'once' : 'always',
    direction: (val) => {
        // When val lands on a cardinal byte, the cardinal label REPLACES
        // the degree readout (matches GM). Other bytes get the standard
        // "${byte}  ${deg}°" display. The type-to-search letter input
        // uses display.includes(letter) for direction (see
        // findEnumValueForKey) so e.g. 'u' picks the byte whose display
        // contains "up" — the label is at the tail, not the head.
        const tail = val === 0   ? 'up'
                   : val === 64  ? 'right'
                   : val === 128 ? 'down'
                   : val === 192 ? 'left'
                   : `${String(Math.round((val / 256) * 360)).padStart(3, '0')}°`;
        return `${String(val).padStart(3, '0')}  ${tail}`;
    },
    unused: () => ''
};

// Format an instruction for display
function formatInstruction(opcode, arg1, arg2, mediaStore, c64ColorNames) {
    const op = gmOpcodes[opcode];
    if (!op) return `??? (0x${opcode.toString(16).padStart(2, '0')})`;
    if (!op.template) return '';

    // Replace {type:argnum} or {type:argnum+offset} placeholders
    return op.template.replace(/\{(\w+):(\d)(\+(\d+))?\}/g, (match, type, argNum, _, offset) => {
        let val = argNum === '1' ? arg1 : arg2;
        if (offset) val += parseInt(offset, 10);
        const formatter = gmTypeFormatters[type];
        if (!formatter) return match;
        return formatter(val, mediaStore, c64ColorNames);
    });
}

// a "sprite X is name" instruction executes. This matches real C64 hardware

//

//     different colors (e.g., player vs enemy variants of the same shape)
//   - On the real C64, each sprite slot has its own color 1 register
//   - Sharing instances would cause color changes to affect all slots using
//     that sprite, which breaks games that rely on per-slot colors

//   - getPalette() / setPalette([bg, c1, c2, c3]) — bulk

//   3 = "Color 3" (shared). See setColor() for the slot↔file-byte mapping.

    // sprites every quad MUST share the same animation length — they
    // animate in lockstep. We canonicalise on quad 0 for reads and
    // propagate writes to every quad so they can't drift.
    //
    // Distinct from totalFrames, which is the number of frame slots
    // actually stored (may exceed numFrames for hidden scratch frames).
    getNumFrames() {
        return this.sprite[0].numFrames;
    }
    setNumFrames(n) {
        const clamped = Math.max(1, Math.min(31, n | 0));
        for (const quad of this.sprite) {
            quad.numFrames = clamped;
        }
        this.dirty = true;
    }

    setPalette(palette) {
        this._bgColor  = palette[0];
        this._gmColor1 = palette[1];
        this._gmColor2 = palette[2];
        this._gmColor3 = palette[3];
        this.dirty = true;
    }

    // Palette indices map to C64 multicolor pixel values:
    //   [0] = pixel 00 = background (transparent)
    //   [1] = pixel 01 = _gmColor2 (GM "Color 2", shared) - multicolor only
    //   [2] = pixel 10 = _gmColor1 (GM "Color 1", unique)
    //   [3] = pixel 11 = _gmColor3 (GM "Color 3", shared) - multicolor only
    //
    // For hi-res sprites, pixel values are 0 or 1, so we put _gmColor1
    // in slot 1 (the rendering code uses palette[1] for set pixels).
    _getCurrentPalette() {
        const isMultiColor = this.sprite[0].isMultiColor;
        return [
            c64Palette[this._bgColor],   // Index 0 = background (transparent)
            isMultiColor ? c64Palette[this._gmColor2] : c64Palette[this._gmColor1],  // Index 1
            c64Palette[this._gmColor1],  // Index 2 = GM "Color 1" (unique sprite color)
            c64Palette[this._gmColor3]   // Index 3 = GM "Color 3" (shared)
        ];
    }

    // === FRAME RENDERING ===
    // Converts raw sprite data (imageData) into pixel arrays ready for blitting.
    //
    // C64 sprite pixel encoding:
    //   - Each row is 3 bytes (24 bits)
    //   - Multicolor: 2 bits per pixel = 4 pixels per byte = 12 fat pixels per row
    //   - Hi-res: 1 bit per pixel = 8 pixels per byte = 24 thin pixels per row
    //
    // We render at 320×200 resolution:
    //   - Multicolor fat pixels become 2×1 blocks
    //   - Hi-res thin pixels become 1×1 blocks
    //   - xDouble/yDouble flags multiply dimensions by 2
    //
    // Color index meanings:
    //   - Multicolor: 0=transparent, 1/2/3=sprite colors from palette
    //   - Hi-res: 0=transparent, 1=foreground color
    //
    // Output: Each frame stored as { pixels: Uint8Array, width, height }
    // where pixels is RGBA data (4 bytes per pixel) with alpha=0 for transparent.
    _renderFrames() {
        const xDouble = this.sprite[0].xDouble ? 2 : 1;
        const yDouble = this.sprite[0].yDouble ? 2 : 1;
        const isMultiColor = this.sprite[0].isMultiColor;

        // Frame dimensions in 320×200 space
        // Base: 24×21 (or 12×21 fat pixels for multicolor, rendered as 24×21)
        // Doubled: 48×42 (or 24×21 fat pixels rendered as 48×42)
        const frameWidth = gmSprite.SPRITE_WIDTH * xDouble;
        const frameHeight = gmSprite.SPRITE_HEIGHT * yDouble;

        // Get palette once - same for all quads
        const palette = this._getCurrentPalette();

        for (let quad = 0; quad < this.sprite.length; quad++) {
            this.sprite[quad].frames = [];

            for (let frame = 0; frame < this.sprite[quad].totalFrames; frame++) {
                // Create pixel array (RGBA, 4 bytes per pixel)
                // Uint8Array is zero-initialized, so alpha starts at 0 (transparent)
                const pixels = new Uint8Array(frameWidth * frameHeight * 4);

                const imageData = this.sprite[quad].imageData[frame];

                // Process each of the 21 rows. Only bytes 0..62 (row*3+col, 21 rows ×
                // 3 cols) are pixels; byte 63 is padding and is never read here — so a
                // frame is "visibly blank" iff bytes 0..62 are zero, regardless of 63.
                for (let row = 0; row < 21; row++) {
                    // Each row is 3 bytes
                    for (let col = 0; col < 3; col++) {
                        const byte = imageData[row * 3 + col];

                        if (isMultiColor) {
                            // === MULTICOLOR MODE ===
                            // 2 bits per pixel, 4 pixels per byte
                            // Bits 7-6 = pixel 0, bits 5-4 = pixel 1, etc.
                            // Each multicolor pixel spans 2 horizontal pixels in 320-wide space
                            for (let bitPair = 0; bitPair < 4; bitPair++) {
                                const colorIndex = (byte >> (6 - bitPair * 2)) & 0b11;
                                if (colorIndex === 0) continue; // transparent (background)

                                const color = palette[colorIndex];
                                // Calculate fat pixel X position (0-11 across sprite)
                                const fatPixelX = col * 4 + bitPair;

                                // Draw 2×1 block (each fat pixel = 2 horizontal pixels)
                                // If xDouble, draw 4×2; if yDouble, draw 2×2; if both, draw 4×4
                                for (let dy = 0; dy < yDouble; dy++) {
                                    for (let dx = 0; dx < 2 * xDouble; dx++) {
                                        const px = fatPixelX * 2 * xDouble + dx;
                                        const py = row * yDouble + dy;
                                        const idx = (py * frameWidth + px) * 4;
                                        pixels[idx] = color[0];     // R
                                        pixels[idx + 1] = color[1]; // G
                                        pixels[idx + 2] = color[2]; // B
                                        pixels[idx + 3] = 255;      // A (opaque)
                                    }
                                }
                            }
                        } else {
                            // === HI-RES MODE ===
                            // 1 bit per pixel, 8 pixels per byte
                            // Bit 7 = pixel 0 (leftmost), bit 0 = pixel 7 (rightmost)
                            // Each hi-res pixel is 1 pixel in 320-wide space
                            for (let bit = 0; bit < 8; bit++) {
                                const colorIndex = (byte >> (7 - bit)) & 0b1;
                                if (colorIndex === 0) continue; // transparent (background)

                                const color = palette[colorIndex];
                                // Calculate thin pixel X position (0-23 across sprite)
                                const pixelX = col * 8 + bit;

                                // Draw 1×1 block (each thin pixel = 1 pixel)
                                // If xDouble, draw 2×1; if yDouble, draw 1×2; if both, draw 2×2
                                for (let dy = 0; dy < yDouble; dy++) {
                                    for (let dx = 0; dx < xDouble; dx++) {
                                        const px = pixelX * xDouble + dx;
                                        const py = row * yDouble + dy;
                                        const idx = (py * frameWidth + px) * 4;
                                        pixels[idx] = color[0];     // R
                                        pixels[idx + 1] = color[1]; // G
                                        pixels[idx + 2] = color[2]; // B
                                        pixels[idx + 3] = 255;      // A (opaque)
                                    }
                                }
                            }
                        }
                    }
                }

                // Store rendered frame
                this.sprite[quad].frames[frame] = {
                    pixels: pixels,
                    width: frameWidth,
                    height: frameHeight
                };
            }
        }
    }

    // === ANIMATION SPEED ===
    // GameMaker animation speed ranges from 1-31 (slider shows 1-32 for UI).
    // At speed 31: frame advances every screen refresh (~30fps on NTSC C64)
    // At speed 30: frame advances every other refresh
    // At speed 29: frame advances every third refresh
    // Formula: framesToSkip = 32 - speed
    //
    // The caller controls the timing of animation calls (should be every ~33ms
    // to match NTSC C64 screen refresh), but the sprite uses skipFrameCounter
    // to throttle actual frame advances according to animSpeed.
    setAnimSpeed(speed) {
        if (speed >= 1 && speed <= 32) {
            this.animSpeed = speed;
            this.skipFrameCounter = undefined; // reset counter on speed change
        }
        return this.animSpeed;
    }

    // === RUNTIME COLOR CHANGES ===
    // Change a color in this sprite instance's palette.
    //
    // Because each sprite slot has its own gmSprite instance, this only affects
    // the slot that owns this instance. This is critical for programs that
    // use the same sprite image in multiple slots with different colors.
    //
    // colorSlot matches GM's terminology:
    //   0 = background
    //   1 = GM "Color 1" (unique sprite color, _gmColor1)
    //   2 = GM "Color 2" (shared, _gmColor2)
    //   3 = GM "Color 3" (shared, _gmColor3)
    //
    // c64ColorIndex: 0-15 (C64 palette index)
    //
    // Frames are NOT immediately re-rendered - just sets the dirty flag.
    // Actual re-render happens lazily when getFrame() is called.
    setColor(colorSlot, c64ColorIndex) {
        const color = c64ColorIndex & 0x0F;
        switch (colorSlot) {
            case 0: this._bgColor = color; break;
            case 1: this._gmColor1 = color; break;  // GM "Color 1"
            case 2: this._gmColor2 = color; break;  // GM "Color 2"
            case 3: this._gmColor3 = color; break;  // GM "Color 3"
            default: return; // invalid slot
        }
        this.dirty = true;
    }

    // Set shared colors (color 2 and 3).
    // On the real C64, colors 2 and 3 are shared across ALL hardware sprites.
    // The runtime (gmRuntime) handles this by calling setSharedColor on every
    // sprite slot's instance when a "sprite shared colrX" instruction executes.
    setSharedColor(colorSlot, c64ColorIndex) {
        // Only slots 2 and 3 are shared in multicolor mode
        if (colorSlot < 2 || colorSlot > 3) return;
        this.setColor(colorSlot, c64ColorIndex);
    }

    // Switch between multicolor and hi-res modes.
    // When switching modes, GameMaker swaps colors 1 and 2. From hex analysis:
    // multi→hi-res: the value at byte 12 (Color 2) moves to byte 28 (drawing color)
    // hi-res→multi: the drawing color becomes Color 2, old Color 2 becomes Color 1
    // This preserves the "main drawing color" semantic across mode changes.
    setMultiColorMode(isMultiColor) {
        const wasMultiColor = this.sprite[0].isMultiColor;
        if (wasMultiColor === isMultiColor) return; // No change

        // Swap colors 1 and 2 at instance level (sprite-wide palette)
        [this._gmColor1, this._gmColor2] = [this._gmColor2, this._gmColor1];

        // Propagate the mode flag to every quad. Per-quad colour fields are
        // not used at render time, so we don't swap them here.
        for (const quad of this.sprite) {
            quad.isMultiColor = isMultiColor;
        }

        this.dirty = true;
    }

    // Get frame dimensions for this sprite (in 320×200 pixels)
    getFrameDimensions() {
        const xDouble = this.sprite[0].xDouble ? 2 : 1;
        const yDouble = this.sprite[0].yDouble ? 2 : 1;
        return {
            width: gmSprite.SPRITE_WIDTH * xDouble,
            height: gmSprite.SPRITE_HEIGHT * yDouble
        };
    }

    // Get pixel data for a specific quad and frame.
    // This is the main entry point for rendering - called by blitToBuffer() and hasPixelAt().
    //
    // Implements lazy rendering: if the dirty flag is set (due to color changes),
    // all frames are re-rendered before returning. This ensures:
    //   - Color changes via setColor() are reflected in the next draw
    //   - Multiple color changes before drawing = single re-render
    //   - Sprites that aren't drawn don't waste cycles re-rendering
    //
    // Returns { pixels: Uint8Array, width, height } or null if invalid indices.
    getFrame(quadIndex, frameIndex) {
        if (quadIndex >= this.sprite.length) return null;
        if (frameIndex >= this.sprite[quadIndex].totalFrames) return null;

        // Lazy render: if colors changed, re-render all frames before returning
        if (this.dirty) {
            this._renderFrames();
            this.dirty = false;
        }

        return this.sprite[quadIndex].frames[frameIndex];
    }

    // === QUAD POSITIONING ===
    // Get the position of a subsprite (quad) in 320×200 coordinates.
    //
    // IMPORTANT: Subsprite xPosition offsets are ALWAYS stored in "fat pixel" units,
    // even for hi-res sprites. This was a source of bugs in the original gmSprite.js
    // where hi-res subsprites overlapped incorrectly.
    //
    // The fix: Always multiply xPosition by 2 to convert to 320×200 space.
    // Y positions are already in 200-tall space (no conversion needed).
    getQuadPosition(quadIndex, baseX, baseY) {
        if (quadIndex === 0) {
            return { x: baseX, y: baseY };
        }

        const spriteData = this.sprite[quadIndex];
        // Subsprite xPosition is ALWAYS in fat pixel units (regardless of multicolor/hi-res)
        // Convert to 320×200 space by multiplying by 2
        const xOffset = spriteData.xPosition * 2;
        const yOffset = spriteData.yPosition;

        return {
            x: baseX + xOffset,
            y: baseY + yOffset
        };
    }

    // === BLITTING ===
    // Copy sprite frame to a composite pixel buffer.
    //
    // Why not just use canvas drawImage()?
    // - putImageData() doesn't alpha-composite; it replaces pixels
    // - To overlap sprites, we must composite manually by skipping alpha=0 pixels
    // - This gives us "alpha blending" by only writing non-transparent pixels
    //
    // The composite buffer (e.g., c64Screen.pixels) collects all sprites,
    // then one putImageData() call displays the final result.
    //
    // Z-order: Quads are drawn back-to-front (highest quad index first)
    // because GameMaker assigns higher z-index to lower-numbered subsprites.
    // skipQuads: optional Set of quad indices to skip (when subsprite slots are overwritten)
    //
    // === COORDINATE WRAPPING ===
    // GM sprite coordinates wrap at 0-255 in GM space. A sprite moving left past x=0
    // wraps to x=255 and continues. Visually, parts of the sprite that extend past
    // the edge appear on the opposite side of the screen.
    //
    // We handle this by:
    // 1. Taking GM coordinates (gmX, gmY) as input
    // 2. For each pixel, calculating its wrapped GM position
    // 3. Converting to screen coordinates and drawing if visible
    //
    // GM to screen conversion:
    //   screenX = (gmX - 12) * 2   (fat pixels, with left border offset)
    //   screenY = gmY - 50          (with top border offset)
    //
    // Visible screen range in GM coords: X=12-171 (160 fat pixels), Y=50-249 (200 pixels)
    //
    // === PRIORITY MASK (optional) ===
    // For "sprite under colors 2/3" semantics — when supplied, sprite pixels
    // are skipped at destinations whose scene palette index is one of the
    // values in mask.skipIndices. The mask gives us the scene's 160×200
    // index buffer (one byte per fat pixel) so we can sample what palette
    // index was painted at each destination before deciding to overwrite.
    //   mask = { indexBuffer, indexWidth, indexHeight, skipIndices: Set<number> }
    // Without mask, sprites render on top (default "over").
    blitToBuffer(target, targetWidth, targetHeight, gmX, gmY, frameIndex, skipQuads = null, mask = null) {
        const xDouble = this.sprite[0].xDouble ? 2 : 1;
        const yDouble = this.sprite[0].yDouble ? 2 : 1;

        // Draw all quads (back to front for correct z-order)
        for (let quad = this.sprite.length - 1; quad >= 0; quad--) {
            // Skip quads whose slots have been overwritten with different sprites
            if (skipQuads && skipQuads.has(quad)) continue;
            const frame = this.getFrame(quad, frameIndex);
            if (!frame) continue;

            // Get quad position offset (subsprites have position relative to main sprite)
            let quadGmX = gmX;
            let quadGmY = gmY;
            if (quad > 0) {
                const spriteData = this.sprite[quad];
                // Subsprite positions are in fat pixel units, same as GM coords
                quadGmX += spriteData.xPosition;
                quadGmY += spriteData.yPosition;
            }

            // Floor base position (sprite positions can be fractional due to velocity)
            quadGmX = Math.floor(quadGmX);
            quadGmY = Math.floor(quadGmY);

            // Frame dimensions in screen pixels (already accounts for doubling)
            // frame.width = 24 * xDouble (48 if doubled)
            // frame.height = 21 * yDouble (42 if doubled)

            // Sprite dimensions in GM units (fat pixels for X, regular pixels for Y)
            // A normal sprite is 12 fat pixels wide, 21 pixels tall
            // xDouble doubles the visual size but the GM coordinate space stays the same
            const spriteWidthGm = 12 * xDouble;   // GM units (fat pixels)
            const spriteHeightGm = 21 * yDouble;  // GM units

            // Blit with coordinate wrapping
            // We iterate over GM coordinate offsets, then map to frame pixels
            for (let gmOffsetY = 0; gmOffsetY < spriteHeightGm; gmOffsetY++) {
                // Calculate wrapped GM Y coordinate
                const pixelGmY = (quadGmY + gmOffsetY) & 0xFF;
                // Convert to screen Y
                const screenY = pixelGmY - 50;
                if (screenY < 0 || screenY >= targetHeight) continue;

                // Map GM Y offset to frame pixel row
                const frameY = gmOffsetY;

                for (let gmOffsetX = 0; gmOffsetX < spriteWidthGm; gmOffsetX++) {
                    // Calculate wrapped GM X coordinate
                    const pixelGmX = (quadGmX + gmOffsetX) & 0xFF;
                    // Convert to screen X (GM fat pixel * 2 = screen pixels)
                    const screenX = (pixelGmX - 12) * 2;

                    // Map GM X offset to frame pixel column
                    // Each GM unit (fat pixel) = 2 screen pixels in the frame
                    const frameX = gmOffsetX * 2;

                    // Priority mask: sample the scene's palette index for this
                    // fat pixel ONCE per outer loop iteration. The scene buffer
                    // is 160×200 (one byte per fat pixel) and screenX/2 gives
                    // the fat-pixel column. Both screen sub-pixels share it.
                    let maskedHere = false;
                    if (mask) {
                        const indexX = screenX >> 1;
                        if (indexX >= 0 && indexX < mask.indexWidth &&
                            screenY >= 0 && screenY < mask.indexHeight) {
                            const sceneIdx = mask.indexBuffer[screenY * mask.indexWidth + indexX];
                            if (mask.skipIndices.has(sceneIdx)) maskedHere = true;
                        }
                    }

                    // Draw the 2 screen pixels that make up this fat pixel
                    for (let dx = 0; dx < 2; dx++) {
                        const srcX = frameX + dx;
                        if (srcX >= frame.width) continue;

                        const srcIdx = (frameY * frame.width + srcX) * 4;
                        const alpha = frame.pixels[srcIdx + 3];
                        if (alpha === 0) continue; // skip transparent pixels

                        const finalX = screenX + dx;
                        if (finalX < 0 || finalX >= targetWidth) continue;

                        if (maskedHere) continue; // sprite is "under" this scene pixel

                        const dstIdx = (screenY * targetWidth + finalX) * 4;
                        target[dstIdx] = frame.pixels[srcIdx];         // R
                        target[dstIdx + 1] = frame.pixels[srcIdx + 1]; // G
                        target[dstIdx + 2] = frame.pixels[srcIdx + 2]; // B
                        target[dstIdx + 3] = 255;                      // A (opaque)
                    }
                }
            }
        }
    }

    // === COLLISION DETECTION HELPERS ===
    // These methods support pixel-perfect collision detection.
    // Since all coordinates are now in 320×200 space, collision is straightforward:
    // just check if non-transparent pixels overlap at the same screen position.

    // Check if a pixel in this sprite is non-transparent at the given local position
    // localX/localY are relative to the quad's frame (0,0 is top-left of frame)
    hasPixelAt(quadIndex, frameIndex, localX, localY) {
        const frame = this.getFrame(quadIndex, frameIndex);
        if (!frame) return false;

        // Floor coordinates to ensure integer pixel lookup
        const x = Math.floor(localX);
        const y = Math.floor(localY);

        if (x < 0 || x >= frame.width || y < 0 || y >= frame.height) {
            return false;
        }
        const idx = (y * frame.width + x) * 4 + 3; // alpha channel
        return frame.pixels[idx] > 0;
    }

    // Get bounding box (hitbox) for a quad in 320×200 coordinates
    // Used for fast AABB collision check before pixel-perfect check
    getHitbox(quadIndex, baseX, baseY) {
        const pos = this.getQuadPosition(quadIndex, baseX, baseY);
        const dims = this.getFrameDimensions();
        return {
            x: pos.x,
            y: pos.y,
            width: dims.width,
            height: dims.height,
            quadIndex: quadIndex
        };
    }

    // Get hitboxes for all quads (quadIndex=-1) or a specific quad
    // Returns array of hitbox objects in 320×200 coordinates
    getHitboxes(baseX, baseY, quadIndex = -1) {
        const hitboxes = [];
        const startQuad = quadIndex === -1 ? 0 : quadIndex;
        const endQuad = quadIndex === -1 ? this.sprite[0].numSprites - 1 : quadIndex;

        for (let q = startQuad; q <= endQuad && q < this.sprite.length; q++) {
            hitboxes.push(this.getHitbox(q, baseX, baseY));
        }
        return hitboxes;
    }

    // === SERIALIZATION ===
    // Serialize sprite back to GameMaker .SPR file format.
    // Returns Uint8Array that can be written to D64 disk.
    // True iff `imageData` (a 63/64-byte frame buffer) contains any non-zero bytes.
    // NOTE: this scans ALL bytes, including the 64th (index 63) — which is padding
    // that the renderer never draws (see renderFrames: only row*3+col, indices
    // 0..62, become pixels). So this is a serialization/trim helper, NOT a test for
    // "visibly blank". GameMaker sometimes stores a non-zero byte 63 (e.g. 08 in
    // BOAT01/SPR), so a frame can carry data here and still render completely empty.
    // To ask "does this frame show anything?", check indices 0..62.
    static _frameHasData(imageData) {
        if (!imageData) return false;
        for (let i = 0; i < imageData.length; i++) {
            if (imageData[i] !== 0) return true;
        }
        return false;
    }

    // Number of frames to actually save for a quad: at least `numFrames` (the
    // animation count, so the loop has somewhere to land) but extended past
    // that to cover any painted scratch frames. Trailing blank frames beyond
    // both are dropped — matches real GM, and keeps middle blanks intact.
    static _framesToSaveForQuad(quad, numFrames) {
        if (!quad.imageData) return numFrames;
        let lastNonBlank = -1;
        for (let f = quad.imageData.length - 1; f >= 0; f--) {
            if (gmSprite._frameHasData(quad.imageData[f])) { lastNonBlank = f; break; }
        }
        return Math.max(numFrames, lastNonBlank + 1);
    }

    serialize() {
        const header = this.sprite[0];
        const numFrames = header.numFrames;
        const numQuads = header.numSprites;

        // Trim trailing blank frames per quad, but always keep at least the
        // anima range (numFrames) so the loop plays correctly even if those
        // frames are blank.
        const framesToSave = this.sprite.map(q => gmSprite._framesToSaveForQuad(q, numFrames));

        // Calculate total size. Every frame is 64 bytes, the last included -- GameMaker's own
        // files end with the final frame's 64th byte. (We used to write the last frame as 63: the
        // old D64 reader dropped each file's final byte, so that's what GameMaker files looked like.)
        let size = 37; // Main header
        size += framesToSave[0] * 64; // Main sprite frames
        for (let q = 1; q < numQuads; q++) {
            size += 32; // Subheader
            size += framesToSave[q] * 64; // Subsprite frames
        }

        const data = new Uint8Array(size);

        // Calculate X position for file format (hi-res coords, right edge + 24)
        // Parser normalizes ALL sprites to fat pixels (divides by 2), so we always multiply by 2
        let xPos = header.xPosition * 2; // Convert fat pixels back to hi-res coords
        xPos += 24; // GM stores position of right edge

        // Pre-calculate if any subsprite will have absolute X > 255
        const mainYFile = header.yPosition + 50;
        let anySubspriteExceedsX255 = false;
        for (let q = 1; q < numQuads; q++) {
            const subSprite = this.sprite[q];
            // Offsets are fat pixels in BOTH modes, so GameMaker always doubles them (verified on
            // the hi-res CTITLE and BOOM sprites, whose stored absolute x only matches with * 2).
            const subAbsX = xPos + subSprite.xPosition * 2;
            if (subAbsX > 255) {
                anySubspriteExceedsX255 = true;
                break;
            }
        }

        // === MAIN HEADER (37 bytes) ===

        // [0-4] Magic number
        data[0] = 0x1D;
        data[1] = 0x60;
        data[2] = 0x47;
        data[3] = 0x45;
        data[4] = 0x4B;

        // [5-10] Sprite name (6 chars, screen codes)
        const nameBytes = typeof encodeString === 'function'
            ? encodeString(header.spriteName, 6)
            : header.spriteName.padEnd(6, ' ').split('').map(c => c.charCodeAt(0));
        for (let i = 0; i < 6; i++) {
            data[5 + i] = nameBytes[i];
        }

        // [11] Unknown flag (always 0x01 in original files)
        data[11] = 0x01;

        // [12] GM Color 2 (shared)
        data[12] = this._gmColor2;

        // [13] GM Color 3 (shared)
        data[13] = this._gmColor3;

        // [14] Multicolor flag
        data[14] = header.isMultiColor ? 0x01 : 0x00;

        // [15] Number of frames (0-based)
        data[15] = numFrames - 1;

        // [16] X double flag
        data[16] = header.xDouble ? 0x01 : 0x00;

        // [17] Y double flag
        data[17] = header.yDouble ? 0x01 : 0x00;

        // [18] Background color
        data[18] = this._bgColor;

        // [19] Number of sprites/quads (0-based)
        data[19] = numQuads - 1;

        // [20-21] Quad data size (little-endian)
        const quadDataSize0 = 32 + framesToSave[0] * 64;
        data[20] = quadDataSize0 & 0xFF;
        data[21] = (quadDataSize0 >> 8) & 0xFF;

        // [22-23] Padding
        data[22] = 0x00;
        data[23] = 0x00;

        // [24] X position low byte
        data[24] = xPos & 0xFF;

        // [25] Y position (add 50 for GM screen offset)
        data[25] = header.yPosition + 50;

        // [26] X position high bit flags
        // A parsed sprite keeps GameMaker's other bits (see decodeSpriteData); a new one gets our
        // best guess for them.
        let byte26;
        if (this._byte26 !== undefined) {
            byte26 = this._byte26 & ~0x10;
        } else {
            byte26 = anySubspriteExceedsX255 ? 0x80 : 0x00;
        }
        if (xPos > 255) byte26 |= 0x10;
        data[26] = byte26;

        // [27] Sprite number (0 for main sprite)
        data[27] = 0;

        // [28] GM Color 1 (unique sprite color)
        data[28] = this._gmColor1;

        // [29-36] Padding
        for (let i = 29; i < 37; i++) {
            data[i] = 0x00;
        }

        let offset = 37;


        // Write frame data for main sprite
        for (let f = 0; f < framesToSave[0]; f++) {
            const imgData = this.sprite[0].imageData[f];
            for (let i = 0; i < 64; i++) {
                data[offset++] = imgData ? (imgData[i] || 0) : 0;
            }
        }

        // Write subsprites
        for (let q = 1; q < numQuads; q++) {
            const subSprite = this.sprite[q];
            const subHeaderStart = offset;

            // Byte 0 - marker
            data[offset++] = 0x2D;

            // Bytes 1-5 - Name (5 chars for subheader, screen codes)
            const subNameBytes = typeof encodeString === 'function'
                ? encodeString(subSprite.spriteName, 5)
                : subSprite.spriteName.padEnd(5, ' ').split('').map(c => c.charCodeAt(0));
            for (let i = 0; i < 5; i++) {
                data[offset++] = subNameBytes[i];
            }

            // Byte 6 - Unknown flag
            data[offset++] = 0x01;

            // Bytes 7-8 - Colors. We write the sprite-wide palette into
            // every subheader — the VIC applies one palette per sprite, so
            // per-quad colours would never have effect at render time.
            // (See "Palette API" above.)
            data[offset++] = this._gmColor2;
            data[offset++] = this._gmColor3;

            // Byte 9 - Mode
            data[offset++] = subSprite.isMultiColor ? 0x01 : 0x00;

            // Byte 10 - Num frames
            data[offset++] = numFrames - 1;

            // Bytes 11-12 - X/Y double
            data[offset++] = subSprite.xDouble ? 0x01 : 0x00;
            data[offset++] = subSprite.yDouble ? 0x01 : 0x00;

            // Byte 13 - Background (sprite-wide; see comment on bytes 7-8)
            data[offset++] = this._bgColor;

            // Byte 14 - num sprites
            data[offset++] = numQuads - 1;

            // Bytes 15-16 - Quad data size
            const quadDataSizeQ = 32 + framesToSave[q] * 64;
            data[offset++] = quadDataSizeQ & 0xFF;
            data[offset++] = (quadDataSizeQ >> 8) & 0xFF;

            // Bytes 17-18 - Position offsets (signed bytes)
            data[offset++] = subSprite.xPosition < 0 ? subSprite.xPosition + 256 : subSprite.xPosition;
            data[offset++] = subSprite.yPosition < 0 ? subSprite.yPosition + 256 : subSprite.yPosition;

            // Bytes 19-20 - Absolute position
            // Offsets are fat pixels in BOTH modes, so GameMaker always doubles them (verified on
            // the hi-res CTITLE and BOOM sprites, whose stored absolute x only matches with * 2).
            const subAbsX = xPos + subSprite.xPosition * 2;
            const subAbsY = mainYFile + subSprite.yPosition;
            data[offset++] = subAbsX & 0xFF;
            data[offset++] = subAbsY & 0xFF;

            // Byte 21 - padding
            data[offset++] = 0x00;

            // Byte 22 - Sprite number
            data[offset++] = q;

            // Byte 23 - Unique color (sprite-wide; see comment on bytes 7-8)
            data[offset++] = this._gmColor1;

            // Bytes 24-31 - padding to 32 bytes
            while (offset < subHeaderStart + 32) data[offset++] = 0x00;

            // Frame data for this subsprite
            for (let f = 0; f < framesToSave[q]; f++) {
                const imgData = subSprite.imageData[f];
                for (let i = 0; i < 64; i++) {
                    data[offset++] = imgData ? (imgData[i] || 0) : 0;
                }
            }
        }

        return data.slice(0, offset);
    }
}

// Make available globally for browser and Node.js testing
if (typeof globalThis !== 'undefined') {
    globalThis.gmSprite = gmSprite;
}
