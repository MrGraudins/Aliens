// headless game export, and any future embed iframe. Centralising it
// here means audio UX stays consistent — and a single click on the icon
// is both the user-gesture handler the browser autoplay policy requires
// AND the unmute toggle the user expects.
//
// "Muted" is the *effective* state: the icon shows a strike-through
// speaker when the user has explicitly muted OR when the AudioContext is
// browser-suspended. The user doesn't need to know the difference; one
// click resolves both.
//
// Wiring:
//
//   const indicator = new GMAudioIndicator(parentEl);
//   indicator.bind({
//       getMuted:        () => audioMuted,
//       setMuted:        (m) => { audioMuted = m; vm.setConfig({audioMuted: m}); },
//       getAudioContext: () => audioContext,
//       onUnlock:        () => { /* restart song, etc. */ }
//   });
//   // call indicator.refresh() any time external state changes.

class GMAudioIndicator {
    constructor(parent) {
        const btn = document.createElement('button');
        btn.className = 'gm-audio-indicator';
        btn.type = 'button';
        btn.title = 'Toggle sound';
        btn.setAttribute('aria-label', 'Toggle sound');
        parent.appendChild(btn);

        this.btn = btn;
        this.binding = null;
        this._renderedMuted = null; // last drawn state, for skip-if-unchanged

        btn.addEventListener('click', () => this._onClick());

        // Initial render — assume muted until bound and told otherwise.
        this._render(true);
    }

    bind({ getMuted, setMuted, getAudioContext, onUnlock }) {
        this.binding = { getMuted, setMuted, getAudioContext, onUnlock };
        this.refresh();
    }

    refresh() {
        // Lazy-attach the statechange listener the first time we see a
        // real AudioContext. Bind may have happened before the host
        // created the context (the editor lazy-inits audio on first run),
        // so we can't rely on context existing at bind time.
        if (this.binding && !this._statechangeAttached) {
            const ctx = this.binding.getAudioContext?.();
            if (ctx && typeof ctx.addEventListener === 'function') {
                ctx.addEventListener('statechange', () => this.refresh());
                this._statechangeAttached = true;
            }
        }
        this._render(this._isEffectivelyMuted());
    }

    _isEffectivelyMuted() {
        if (!this.binding) return true;
        if (this.binding.getMuted()) return true;
        const ctx = this.binding.getAudioContext?.();
        if (ctx && ctx.state === 'suspended') return true;
        return false;
    }

    // Touch devices have no hover to reveal a volume panel, so with a panel host set, a tap there
    // opens/closes the panel (host gets .gm-volume-open) instead of muting; muting is done by
    // sliding to zero. A tap that finds audio muted or browser-locked still unmutes first: that
    // tap is the user gesture the autoplay policy needs, so it can't be spent only on the panel.
    // Any press outside the host closes the panel. The panel opens upward unless there isn't room
    // above the button (host gets .gm-volume-below), since layouts put the controls at different
    // heights on different devices and orientations.
    enableTouchPanel(host) {
        this._panelHost = host;
        document.addEventListener('pointerdown', (e) => {
            if (!host.contains(e.target)) host.classList.remove('gm-volume-open');
        });
    }

    static _isTouchOnly() {
        return !!window.matchMedia?.('(hover: none)').matches;
    }

    _onClick() {
        if (!this.binding) return;
        if (this._panelHost && GMAudioIndicator._isTouchOnly()) {
            const host = this._panelHost;
            const open = this._isEffectivelyMuted() || !host.classList.contains('gm-volume-open');
            if (this._isEffectivelyMuted()) this._unmute();
            if (open) {
                const panel = host.firstElementChild;
                const needed = (panel ? panel.offsetHeight : 0) + 12;
                host.classList.toggle('gm-volume-below', host.getBoundingClientRect().top < needed);
            }
            host.classList.toggle('gm-volume-open', open);
            this.refresh();
            return;
        }
        if (this._isEffectivelyMuted()) {
            this._unmute();
        } else {
            this.binding.setMuted(true);
        }
        this.refresh();
    }

    // Clear user mute, resume the context if suspended (this click is the user gesture that lets
    // resume() actually work), then notify the host so it can restart any song that lost its
    // scheduling window during the suspension.
    _unmute() {
        this.binding.setMuted(false);
        const ctx = this.binding.getAudioContext?.();
        if (ctx && ctx.state === 'suspended') {
            ctx.resume().then(() => {
                if (this.binding.onUnlock) this.binding.onUnlock();
                this.refresh();
            });
        }
    }

    _render(muted) {
        if (this._renderedMuted === muted) return;
        this._renderedMuted = muted;
        this.btn.classList.toggle('muted', muted);
        this.btn.innerHTML = this._iconHTML(muted);
    }

    _iconHTML(muted) {
        // Simple inline SVG — speaker cone with optional sound-waves
        // (unmuted) or a strike-through (muted). currentColor lets CSS
        // recolour the whole icon.
        const speaker = '<path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/>';
        const waves   = '<path d="M14 8a4 4 0 0 1 0 8M17 5a8 8 0 0 1 0 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>';
        const slash   = '<line x1="3" y1="3" x2="21" y2="21" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>';
        const body = muted ? speaker + slash : speaker + waves;
        return `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${body}</svg>`;
    }
}

// Make available globally for browser <script> loads and Node.js ESM imports.
if (typeof globalThis !== 'undefined') {
    globalThis.GMAudioIndicator = GMAudioIndicator;
}
</script>
<script>// Poster preview generation — shared between program-editor.html and play.html.
//
// A "poster" is the frame you see behind the play-button overlay: the game
// simulated for a few seconds so the visitor sees something more interesting
// than a black canvas. It runs against a throwaway VM + fresh mediaStore so
// the real run (started when the user clicks play) isn't perturbed.
//
// Callers own their own screen instance and pass it in. Both hosts want the
// poster rendered on the same canvas the real VM will eventually use, so
// there's no benefit to owning the screen here.

globalThis.GMPoster = {
    // Parse `poster_seconds` from URL params.
    //   absent / non-numeric / negative → default 2s
    //   0                                → caller should skip poster entirely
    //   > 10                             → capped at 10s (protects against runaway URLs)
    //   decimals                         → rounded to 0.01s
    getPosterSeconds(params) {
        const raw = params.get('poster_seconds');
        if (raw === null) return 2;
        const parsed = parseFloat(raw);
        if (!isFinite(parsed) || parsed < 0) return 2;
        return Math.min(Math.round(parsed * 100) / 100, 10);
    },

    // Render a preview frame to `screen` by running a temp VM for
    // `posterSeconds` of simulated wallclock. `fileData` is the raw PRG
    // bytes — parsed fresh so we don't share mediaStore with the real run.
    //
    // Date.now is mocked to advance one frame per simulated frame so
    // `pause X.X` opcodes resolve without actually blocking. audioMuted
    // silences song-start opcodes even if an AudioContext already exists
    // from a previous run (relevant to program-editor.html; play.html's context
    // doesn't exist yet at poster time).
    async generatePoster({ screen, fileData, posterSeconds }) {
        if (!fileData || posterSeconds === 0) return;

        const realDateNow = Date.now.bind(Date);
        let simulatedNow = realDateNow();
        Date.now = () => simulatedNow;

        try {
            const programData = parseProgramData(fileData);
            const ast = buildAST(programData);
            const vm = new gmVM(screen);
            vm.loadProgram(ast, fileData, { audioMuted: true });
            vm.running = true;

            const totalFrames = Math.max(1, Math.round(posterSeconds * 60));
            const opsPerFrame = 50;
            const frameMs = 1000 / 60;
            // Mirror the real run loop: animation advances every other
            // frame so sprites land at ~30fps like on real hardware.
            let animToggle = false;
            for (let f = 0; f < totalFrames && vm.running; f++) {
                for (let i = 0; i < opsPerFrame && vm.running; i++) {
                    vm.step();
                }
                vm.updateSpritePositions();
                animToggle = !animToggle;
                vm.advanceSpriteAnimations(animToggle);
                simulatedNow += frameMs;
            }
            // Only the final frame matters — intermediate paints inside a
            // sync loop never composite anyway. renderPixels() paints the
            // current state without touching sprite positions or animation
            // (both already advanced in the loop above).
            vm.renderPixels();
        } catch (e) {
            console.warn('poster generation failed:', e.message);
        } finally {
            Date.now = realDateNow;
        }
    }
};
</script>
<script>// Shared player chrome behaviors — used by play.html, program-editor.html's game
// overlay, and the standalone Export Game to HTML bundle. Each host owns its own
// DOM structure (they only differ around it — program-editor.html has additional
// dev controls in the settings popup, play.html doesn't need a stop
// button, etc.), but the icon set, joystick presets, input listeners,
// pause-icon swap, and settings persistence are all identical, so they
// live here.

globalThis.GMPlayerChrome = (function () {

    // ---------- Icons ---------------------------------------------------

    // SVG strings inlined into buttons via .innerHTML. Same viewBox,
    // stroke width, and color tokens so all four buttons visually match.
    // `currentColor` lets each host color the icons via CSS.
    const ICONS = {
        // Play: rounded triangle. Larger stroke than the others because
        // it's the hero button in the play overlay.
        play:
            '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
            '<path d="M7 5 L19 12 L7 19 Z" fill="currentColor" stroke="currentColor" ' +
            'stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>' +
            '</svg>',

        // Pause: two rounded bars.
        pause:
            '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
            '<rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/>' +
            '<rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/>' +
            '</svg>',

        // Resume: same triangle as play, but with a lighter stroke — used
        // on the pause button when the VM is currently paused.
        resume:
            '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
            '<path d="M7 5 L19 12 L7 19 Z" fill="currentColor" stroke="currentColor" ' +
            'stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
            '</svg>',

        // Stop: single filled rounded square.
        stop:
            '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
            '<rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor"/>' +
            '</svg>',

        // Hamburger: three rounded horizontal bars.
        hamburger:
            '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
            '<rect x="4" y="6" width="16" height="2" rx="1" fill="currentColor"/>' +
            '<rect x="4" y="11" width="16" height="2" rx="1" fill="currentColor"/>' +
            '<rect x="4" y="16" width="16" height="2" rx="1" fill="currentColor"/>' +
            '</svg>'
    };

    // Swap a pause button between "showing pause" (VM running) and
    // "showing resume" (VM paused). Also updates aria-label.
    function setPauseIcon(btn, paused) {
        if (!btn) return;
        btn.innerHTML = paused ? ICONS.resume : ICONS.pause;
        btn.setAttribute('aria-label', paused ? 'Resume' : 'Pause');
    }

    // ---------- Joystick presets ---------------------------------------

    // Each preset maps `event.key` values to a *joystick action*:
    // 'up'/'down'/'left'/'right' set the corresponding joystick direction;
    // 'fire' sets the top-level button state (buttonN, not joystickN.fire —
    // that's the field the runtime actually reads).
    //
    // Presets are joystick-agnostic here. The setup wires each preset to a
    // specific joystick number at attach time, so the same 'cursors' preset
    // can drive joystick 1 in one game and joystick 2 in another. Games
    // that overlap keys across joysticks just fire both — that's the
    // user's choice to make when they pair presets.
    //
    // 'cursors' accepts both Enter and Meta as fire so it works for
    // finger positions that expect either. 'none' is the "this joystick
    // is unused" preset.
    const PRESETS = {
        cursors: {
            ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
            Enter: 'fire', Meta: 'fire'
        },
        esdf: {
            e: 'up', E: 'up', d: 'down', D: 'down',
            s: 'left', S: 'left', f: 'right', F: 'right',
            ' ': 'fire'
        },
        wasd: {
            w: 'up', W: 'up', s: 'down', S: 'down',
            a: 'left', A: 'left', d: 'right', D: 'right',
            ' ': 'fire'
        },
        ijkl: {
            i: 'up', I: 'up', k: 'down', K: 'down',
            j: 'left', J: 'left', l: 'right', L: 'right',
            Enter: 'fire'
        },
        none: {}
    };

    // Human-readable labels for populating the settings dropdowns.
    // Order here becomes the display order in the UI.
    const PRESET_LABELS = [
        ['cursors', 'Arrow keys + Enter'],
        ['esdf', 'ESDF + Space'],
        ['wasd', 'WASD + Space'],
        ['ijkl', 'IJKL + Enter'],
        ['none', '(off)']
    ];

    // Attach keydown/keyup listeners to `window`. On each event, look up
    // both joysticks' presets and mutate `inputState` accordingly.
    //
    // `getPresets()` returns { joy1: 'cursors', joy2: 'esdf' } — read at
    // event time so preset changes take effect immediately without
    // reattaching. `isEnabled()` gates event handling (games with no VM
    // running or a paused game shouldn't consume presses).
    //
    // Returns a `detach()` function for cleanup — useful for the editor
    // where the overlay comes and goes.
    function setupInputListeners({ inputState, getPresets, isEnabled }) {
        // Opposite direction for SOCD cleaning (see applyKey).
        const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };

        function applyKey(key, active, e) {
            const { joy1, joy2 } = getPresets();
            let consumed = false;
            const m1 = PRESETS[joy1] || {};
            const m2 = PRESETS[joy2] || {};

            const act1 = m1[key];
            if (act1) {
                if (act1 === 'fire') inputState.button1 = active;
                else setDirection(inputState.joystick1, act1, active);
                consumed = true;
            }
            const act2 = m2[key];
            if (act2) {
                if (act2 === 'fire') inputState.button2 = active;
                else setDirection(inputState.joystick2, act2, active);
                consumed = true;
            }
            if (consumed && e) e.preventDefault();
        }

        // SOCD cleaning: a physical joystick can't hold two opposite directions
        // at once, so on a press we force the opposite off — "last direction
        // wins". This is also the recovery path when a keyup goes missing (macOS
        // suppresses arrow keyups while Cmd/fire is held): pressing the other
        // way clears the stranded direction instead of the ship staying stuck.
        function setDirection(joystick, dir, active) {
            joystick[dir] = active;
            if (active) joystick[OPPOSITE[dir]] = false;
        }

        // Clear all four direction booleans on both joysticks. Used as a
        // recovery step when we can't trust that we saw all keyup events
        // (see onUp's Meta handling and the focus-loss listeners below).
        function clearAllDirections() {
            inputState.joystick1.up = false;
            inputState.joystick1.down = false;
            inputState.joystick1.left = false;
            inputState.joystick1.right = false;
            inputState.joystick2.up = false;
            inputState.joystick2.down = false;
            inputState.joystick2.left = false;
            inputState.joystick2.right = false;
        }

        // Full clear — everything to false. Used on focus loss so games
        // never end up with stranded held-key state after alt-tab, tab
        // switch, screen lock, or the browser losing focus for any reason.
        function clearAllInput() {
            clearAllDirections();
            inputState.button1 = false;
            inputState.button2 = false;
        }

        function onDown(e) { if (isEnabled()) applyKey(e.key, true, e); }

        // Meta (Cmd) keyup gets special treatment: on macOS, browsers
        // suppress keyup events for other keys while Cmd is held. That
        // means if the user holds ArrowRight, presses Cmd, then releases
        // ArrowRight while still holding Cmd, we never see the ArrowRight
        // keyup — joystick.right stays true even after the user let go.
        // Result: the ship keeps moving right until they press-and-release
        // it again. Longstanding platform quirk, not fixable at our
        // handler level.
        //
        // Workaround: on Meta keyup, conservatively clear all direction
        // booleans. Anything that was released during the Cmd-down window
        // gets un-stuck. A user still legitimately holding a direction
        // sees a brief pause and continues on the next auto-repeat
        // keydown (browsers keep firing those while a key is held) — a
        // minor UX quirk in exchange for no more stuck ship.
        function onUp(e) {
            if (!isEnabled()) return;
            applyKey(e.key, false, e);
            if (e.key === 'Meta') clearAllDirections();
        }

        // Capture phase so we run before any bubble-phase listeners that
        // might call stopImmediatePropagation (e.g., the editor's blocker
        // that stops editor shortcuts from firing during gameplay). We
        // preventDefault on matched keys but don't stop propagation
        // ourselves — the host's other handlers still get to run.
        window.addEventListener('keydown', onDown, true);
        window.addEventListener('keyup', onUp, true);

        // Belt-and-suspenders for the general "keys were held when focus
        // went away" case: alt-tab, screen lock, tab switch, browser lost
        // focus for any reason. Wipes everything so nothing carries over.
        function onFocusLoss() { clearAllInput(); }
        function onVisibilityChange() {
            if (document.hidden) clearAllInput();
        }
        window.addEventListener('blur', onFocusLoss);
        document.addEventListener('visibilitychange', onVisibilityChange);

        return () => {
            window.removeEventListener('keydown', onDown, true);
            window.removeEventListener('keyup', onUp, true);
            window.removeEventListener('blur', onFocusLoss);
            document.removeEventListener('visibilitychange', onVisibilityChange);
        };
    }

    // ---------- Settings persistence -----------------------------------

    // Each host uses a different localStorage key so a user's preset
    // choice in the editor doesn't leak into play.html and vice versa —
    // people may want different mappings for the two contexts.
    function loadInputSettings(storageKey, defaults) {
        try {
            const raw = localStorage.getItem(storageKey);
            if (!raw) return { ...defaults };
            const parsed = JSON.parse(raw);
            return { ...defaults, ...parsed };
        } catch (e) {
            return { ...defaults };
        }
    }

    function saveInputSettings(storageKey, settings) {
        try {
            localStorage.setItem(storageKey, JSON.stringify(settings));
        } catch (e) {
            // Quota exceeded or private mode — settings just don't stick.
        }
    }

    // Default choice used by every host: cursors for joystick 1, ESDF for
    // joystick 2. Matches the hardcoded mappings that used to live in each
    // host, so existing muscle memory carries over.
    const DEFAULT_INPUT_SETTINGS = { joy1: 'cursors', joy2: 'esdf' };

    // ---------- Public API ---------------------------------------------

    return {
        ICONS,
        PRESETS,
        PRESET_LABELS,
        DEFAULT_INPUT_SETTINGS,
        setPauseIcon,
        setupInputListeners,
        loadInputSettings,
        saveInputSettings
    };
})();
</script>
<script>// Shared disk-picker overlay used by play.html and every editor. Two states:
//   - drop-zone: "Drop a .d64 here" GameMaker-button, with a hidden file
//                input for click-to-choose fallback
//   - program-picker: list of files on the loaded disk, filtered to the
//                host's extension (PRG / SPR / PIC / SND / SNG)
//
// Callers mount once at page init, then either:
//   - call showProgramPicker() when they already have a disk (URL-driven
//     load with ?disk= but no ?file=)
//   - enable windowDropEnabled to auto-show the drop-zone on drag-and-
//     drop of a .d64 anywhere in the window
//
// Post-pick, callers get the file name + bytes + parsed D64 via
// onPickFile(name, bytes, disk, diskLabel). What they do with it varies
// by host (editor loads into the program listing, sprite-maker into the
// sprite canvas, play.html into the poster + play flow, etc.).
//
// Styling: GameMaker quit-menu aesthetic (dark gray screen, gray3-blue
// raised buttons). CSS injects once per page on first mount and lives
// under `.gmdp-*` class prefixes so it can't collide with host styles.

globalThis.GMDiskPicker = (function () {

    // The `--gameborder-h, 100vh` fallback lets the same rule work in
    // play.html (where --gameborder-h is defined and reflects the game
    // border's real height) AND in editors where the overlay covers the
    // viewport (no --gameborder-h; fall back to raw viewport height).
    const CSS = `
@font-face {
    font-family: C64;
    src: url(css/fonts/C64_Pro_Mono_Narrow8.woff2);
}

.gmdp-overlay {
    display: none;
    position: absolute;
    inset: 0;
    padding: max(0px, min(48px, calc((var(--gameborder-h, 100vh) - 400px) / 2)));
    box-sizing: border-box;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    background: rgb(0, 0, 0);
}
.gmdp-overlay.active { display: flex; }

.gmdp-content {
    height: 100%;
    aspect-ratio: 6 / 5;
    min-height: 400px;
    box-sizing: border-box;
    background: rgb(98, 98, 98);         /* c64-gray1 */
    font-family: C64, monospace;
    padding: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: rgb(205, 205, 205);
}

.gmdp-content code { font-family: inherit; font-size: inherit; }

.gmdp-content > * {
    width: 100%;
    max-width: 380px;
    text-align: center;
}

.gmdp-heading {
    font-size: 12px;
    margin: 0 0 14px 0;
    font-weight: normal;
    color: rgb(205, 205, 205);
}
.gmdp-disk-name {
    font-size: 11px;
    margin: 0 0 12px 0;
    color: rgb(205, 205, 205);
}

/* GameMaker raised button: gray3 fill, blue text, black 3D bevel via
   thicker bottom/right borders. Same as css/gm-ui.css's global button. */
.gmdp-drop-target {
    display: block;
    background: rgb(205, 205, 205);      /* c64-gray3 */
    color: rgb(25, 73, 180);             /* c64-blue */
    border: 3px solid black;
    border-bottom: 6px solid black;
    border-right: 6px solid black;
    padding: 16px 24px;
    cursor: pointer;
    transition: background 0.1s;
}
.gmdp-drop-target:hover,
.gmdp-drop-target.gmdp-drag-over {
    background: rgb(255, 255, 255);      /* c64-white */
}
.gmdp-drop-hint {
    font-size: 13px;
    margin-bottom: 6px;
}
.gmdp-drop-sub {
    font-size: 11px;
    opacity: 0.75;
}
.gmdp-drop-input { display: none; }

/* Program list — same raised-panel bevel, quit-menu-style link rows.
   max-height caps the panel so it always fits inside the 400px-min
   mini-screen (with room for the heading + disk-name above); long
   file lists scroll internally rather than pushing the panel out of
   the mini-screen and getting clipped. */
.gmdp-list {
    list-style: none;
    margin: 0;
    padding: 12px 20px;
    max-height: 220px;
    overflow-y: auto;
    background: rgb(205, 205, 205);
    border: 3px solid black;
    border-bottom: 6px solid black;
    border-right: 6px solid black;
    text-align: left;
    box-sizing: border-box;
}
.gmdp-list li {
    padding: 3px 8px;
    cursor: pointer;
    font-size: 12px;
    color: rgb(25, 73, 180);
    transition: color 0.1s;
}
.gmdp-list li:hover {
    color: rgb(169, 71, 100);            /* c64-red */
}

.gmdp-error {
    display: none;
    font-size: 11px;
    margin-top: 12px;
    color: rgb(169, 71, 100);
}
`;

    let cssInjected = false;
    function injectCSS() {
        if (cssInjected) return;
        const style = document.createElement('style');
        style.textContent = CSS;
        document.head.appendChild(style);
        cssInjected = true;
    }

    // Detect that a drag actually carries files (not, e.g., text or an
    // in-page HTML5 drag from a list). Some browsers redact file metadata
    // during drag for security, so this is a "yes, files are involved"
    // check rather than a `.d64`-specific one — the extension is checked
    // only on drop where we can read `file.name`.
    function dragCarriesFile(dt) {
        if (!dt) return false;
        const types = dt.types;
        // types is a DOMStringList; iterate with a loop that works both
        // for old and new browsers.
        for (let i = 0; i < types.length; i++) {
            if (types[i] === 'Files') return true;
        }
        return false;
    }

    function mount(hostEl, options) {
        const { extension, onPickFile, windowDropEnabled, disk } = options;
        // Optional: when a drop yields 2+ matches, call this instead of
        // showing the module's own overlay picker. Editors use it to
        // hand off to their existing file-popup UI (which already has
        // previews for sprites/scenes, etc.) so users only ever see one
        // picker. If not provided, the module's overlay picker is used.
        const customPicker = options.showPicker;
        injectCSS();

        const overlay = document.createElement('div');
        overlay.className = 'gmdp-overlay';
        overlay.innerHTML = `
            <div class="gmdp-content">
                <div class="gmdp-drop-section">
                    <label class="gmdp-drop-target">
                        <div class="gmdp-drop-hint">Drop a <code>.d64</code> here</div>
                        <div class="gmdp-drop-sub">or click to choose a file</div>
                        <input type="file" class="gmdp-drop-input" accept=".d64">
                    </label>
                    <div class="gmdp-error"></div>
                </div>
                <div class="gmdp-pick-section" style="display: none;">
                    <h2 class="gmdp-heading">Choose a program</h2>
                    <p class="gmdp-disk-name"></p>
                    <ul class="gmdp-list"></ul>
                </div>
            </div>
        `;
        hostEl.appendChild(overlay);

        const dropTarget  = overlay.querySelector('.gmdp-drop-target');
        const dropInput   = overlay.querySelector('.gmdp-drop-input');
        const dropSection = overlay.querySelector('.gmdp-drop-section');
        const pickSection = overlay.querySelector('.gmdp-pick-section');
        const errBox      = overlay.querySelector('.gmdp-error');
        const diskLabelEl = overlay.querySelector('.gmdp-disk-name');
        const listEl      = overlay.querySelector('.gmdp-list');

        function isVisible() { return overlay.classList.contains('active'); }
        function hide() { overlay.classList.remove('active'); }

        // Dismiss on Escape (matches every other popup in the app) and
        // on click of the dimmed backdrop. Without these, a "no /prg
        // files on disk" error left the overlay stuck with no visible
        // way out — the app looked frozen behind the modal. Both paths
        // work regardless of which section (drop-zone, pick, error) is
        // currently shown.
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isVisible()) hide();
        });
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) hide();
        });

        function showDropZone() {
            errBox.style.display = 'none';
            dropSection.style.display = '';
            pickSection.style.display = 'none';
            overlay.classList.add('active');
        }

        function showProgramPicker(disk, files, diskLabel) {
            diskLabelEl.textContent = diskLabel || '';
            listEl.innerHTML = '';
            for (const name of files) {
                const li = document.createElement('li');
                li.textContent = name;
                li.addEventListener('click', () => {
                    const bytes = disk.readFile(name);
                    if (!bytes) return;
                    hide();
                    onPickFile(name, bytes, disk, diskLabel);
                });
                listEl.appendChild(li);
            }
            dropSection.style.display = 'none';
            pickSection.style.display = '';
            overlay.classList.add('active');
        }

        function showError(msg) {
            errBox.textContent = msg;
            errBox.style.display = '';
            dropSection.style.display = '';
            pickSection.style.display = 'none';
            overlay.classList.add('active');
        }

        // Parse a File as a .d64, then run the same auto-load/pick logic
        // as the URL flow: 0 matches → error; 1 match → auto-pick;
        // multiple → show the program picker.
        //
        // If a GMDisk was passed to mount(), the dropped bytes get
        // promoted into the shared localStorage pool AND selected as the
        // current disk — so subsequent "file" button clicks see the
        // just-dropped disk, saves land in the right place, and other
        // editors see it too. addToPool dedupes by SHA-256 so re-dropping
        // the same disk is a no-op that just re-selects the existing
        // pool entry.
        async function handleFile(file) {
            errBox.style.display = 'none';
            try {
                const bytes = new Uint8Array(await file.arrayBuffer());
                const parsed = new D64(bytes);
                if (disk) {
                    try {
                        const id = await GMDisk.addToPool(bytes, file.name);
                        disk.selectDisk(id);
                    } catch (e) {
                        // Pool insert can fail (quota, private mode). Fall
                        // through with the in-memory disk — the current
                        // pick still works, just doesn't persist.
                        console.warn('GMDiskPicker: pool insert failed:', e.message);
                    }
                }
                // The host's `disk` object now points at the pool entry
                // (via selectDisk); fall back to the in-memory `parsed`
                // when no host disk was provided.
                const activeD64 = disk?.disk || parsed;
                // gmParser needs loadFileByName to resolve multi-part
                // sprite references etc. Point it at this disk.
                globalThis.loadFileByName = (name) => {
                    try { return activeD64.readFile(name); } catch (e) { return null; }
                };
                // Editor hosts pass a customPicker (the disk popup). For
                // those, drop == insert — always open the popup with the
                // dropped disk selected, and show every file on it. No
                // extension filtering, no "empty disk" error: the popup
                // handles all of that natively (with non-loadable rows
                // greyed out). Auto-load and the built-in program picker
                // stay for hosts without a customPicker, like play.html
                // where drop-to-play is the expected UX.
                if (customPicker) {
                    hide();
                    customPicker();
                    return;
                }

                const matches = GMTools.listFilesByExtension(activeD64, extension);

                // Standalone GameMaker exports (extension-less 191-block
                // files starting with the $0302 magic) also count as
                // loadable — see CLAUDE.md "Standalone files".
                if (matches.length === 0 && extension.toUpperCase() === '/PRG') {
                    for (const entry of activeD64.getDirectory()) {
                        if (entry.fileSize !== 191) continue;
                        try {
                            const data = activeD64.getChainedData(entry.startTrack, entry.startSector);
                            if (data && data.length >= 2 && data[0] === 0x02 && data[1] === 0x03) {
                                matches.push(entry.fileName);
                            }
                        } catch { /* not a standalone we can read; skip */ }
                    }
                }

                if (matches.length === 0) {
                    showError(`no ${extension.toLowerCase()} files on disk`);
                    return;
                }
                if (matches.length === 1) {
                    const name = matches[0];
                    const data = activeD64.readFile(name);
                    hide();
                    onPickFile(name, data, activeD64, file.name);
                    return;
                }
                showProgramPicker(activeD64, matches, file.name);
            } catch (e) {
                showError("that doesn't look like a valid .d64");
            }
        }

        // Drop handlers on the drop-target label — used when the user
        // drops directly onto the visible button.
        dropInput.addEventListener('change', () => {
            if (dropInput.files && dropInput.files[0]) handleFile(dropInput.files[0]);
        });
        dropTarget.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropTarget.classList.add('gmdp-drag-over');
        });
        dropTarget.addEventListener('dragleave', () => {
            dropTarget.classList.remove('gmdp-drag-over');
        });
        dropTarget.addEventListener('drop', (e) => {
            e.preventDefault();
            dropTarget.classList.remove('gmdp-drag-over');
            const file = e.dataTransfer?.files?.[0];
            if (file) handleFile(file);
        });

        // Window-level drop: any file dragged into the window shows the
        // overlay. If the overlay was already visible when the drag
        // started (e.g., URL missing ?file=), leave it visible on
        // dragleave — otherwise auto-hide when the drag exits the window.
        // Counter-based nesting handles dragenter/leave fluctuations as
        // the cursor crosses inner elements.
        if (windowDropEnabled) {
            let dragCounter = 0;
            let wasVisibleBeforeDrag = false;

            window.addEventListener('dragenter', (e) => {
                if (!dragCarriesFile(e.dataTransfer)) return;
                if (dragCounter === 0) {
                    wasVisibleBeforeDrag = isVisible();
                    showDropZone();
                }
                dragCounter++;
                e.preventDefault();
            });
            window.addEventListener('dragleave', (e) => {
                if (!dragCarriesFile(e.dataTransfer)) return;
                dragCounter--;
                if (dragCounter <= 0) {
                    dragCounter = 0;
                    if (!wasVisibleBeforeDrag) hide();
                }
            });
            window.addEventListener('dragover', (e) => {
                // Preventing default here is what lets `drop` fire.
                if (dragCarriesFile(e.dataTransfer)) e.preventDefault();
            });
            window.addEventListener('drop', (e) => {
                dragCounter = 0;
                if (!dragCarriesFile(e.dataTransfer)) return;
                e.preventDefault();
                const file = e.dataTransfer.files?.[0];
                if (file) handleFile(file);
                else if (!wasVisibleBeforeDrag) hide();
            });
        }

        return { showDropZone, showProgramPicker, showError, hide, isVisible };
    }

    return { mount };
})();
</script>
<script>// gmTouchControls.js — Virtual joystick + fire button overlay for mobile play.
//
// Mounts translucent controls onto the game canvas that write directly to the
// global inputState the VM reads each frame. Both play.html and program-editor.html
// (in play mode) use it.
//
// Usage:
//     const controls = GMTouchControls.mount(hostEl, { inputState });
//     // ... later ...
//     controls.unmount();
//
// Options:
//   inputState  — the object with joystick1/button1 fields (defaults to globalThis.inputState)
//   port        — which joystick port to write to (1 or 2, default 1)
//
// Device detection: shown only on touch-primary devices with a small viewport
// (phone-sized). Tablets and desktops keep the keyboard-driven UX. Use
// GMTouchControls.deviceMode() for the classification helper.

const GMTouchControls = {
    // === DEVICE CLASSIFICATION ===
    // "phone"   — small touch device (< 900px wide, coarse pointer). Full
    //             mobile treatment: hide chrome, show virtual controls.
    // "tablet"  — large touch device. Show virtual controls but keep the
    //             desktop chrome; user has room for both.
    // "desktop" — non-touch or fine-pointer. No virtual controls at all;
    //             keyboard driving.
    deviceMode() {
        const coarse = matchMedia('(pointer: coarse)').matches;
        const hasTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        if (!coarse && !hasTouch) return 'desktop';
        const small = window.innerWidth < 900;
        return small ? 'phone' : 'tablet';
    },

    // Simple boolean for "should we show virtual controls?" — true for both
    // phones and tablets; only desktops are excluded.
    shouldShowControls() {
        return this.deviceMode() !== 'desktop';
    },

    // Simple boolean for "should we hide the desktop chrome?" — phones only.
    // Tablets keep the chrome because they have screen real-estate for it.
    isPhoneLayout() {
        return this.deviceMode() === 'phone';
    },

    // === MOUNT ===
    mount(hostEl, { inputState = globalThis.inputState, port = 1 } = {}) {
        if (!inputState) throw new Error('GMTouchControls.mount: no inputState provided');
        if (this.shouldShowControls() === false) {
            return { unmount() {}, updateActiveJoystick() {} };
        }

        // === DOM ===
        // Single overlay element positioned absolutely over the host, holding
        // the joystick region on the left and the fire button on the right.
        // Everything uses `touch-action: none` so browser gestures (pinch,
        // scroll, double-tap zoom) don't interfere with game input.
        const overlay = document.createElement('div');
        overlay.className = 'gm-touch-overlay';

        const joystickEl = document.createElement('div');
        joystickEl.className = 'gm-touch-joystick';
        const puckEl = document.createElement('div');
        puckEl.className = 'gm-touch-joystick-puck';
        joystickEl.appendChild(puckEl);

        const fireEl = document.createElement('div');
        fireEl.className = 'gm-touch-fire';
        fireEl.textContent = '●';   // filled dot — reads as "button"

        overlay.appendChild(joystickEl);
        overlay.appendChild(fireEl);
        hostEl.appendChild(overlay);

        // === STATE ===
        // Track active touch identifiers so multi-touch works: joystick and
        // fire can be held simultaneously without either canceling the other.
        // When a finger moves off its zone, we keep its identifier bound to
        // the zone it started in — matches real d-pad/button behaviour.
        let joyTouchId = null;
        let fireTouchId = null;
        let joyCenterX = 0;
        let joyCenterY = 0;
        const JOY_DEADZONE = 12;     // pixels from center where no direction registers
        const JOY_MAX_OFFSET = 45;   // puck can move this far from center
        const joyKey = port === 2 ? 'joystick2' : 'joystick1';
        const btnKey = port === 2 ? 'button2'   : 'button1';

        // === EVENT HANDLERS ===
        // Refresh joystick center after any layout change (rotation, fullscreen).
        function refreshJoyCenter() {
            const rect = joystickEl.getBoundingClientRect();
            joyCenterX = rect.left + rect.width / 2;
            joyCenterY = rect.top + rect.height / 2;
        }

        function resetJoystickState() {
            inputState[joyKey].up = false;
            inputState[joyKey].down = false;
            inputState[joyKey].left = false;
            inputState[joyKey].right = false;
            puckEl.style.transform = '';
            joystickEl.classList.remove('gm-touch-active');
        }

        // Given a touch's page position relative to joystick center, update
        // the four boolean directions on inputState AND move the puck. Uses
        // an 8-way angular resolve with a small dead zone.
        function updateJoystick(touchX, touchY) {
            const dx = touchX - joyCenterX;
            const dy = touchY - joyCenterY;
            const dist = Math.hypot(dx, dy);

            // Puck follows finger but clamped to a max radius
            const clampedDist = Math.min(dist, JOY_MAX_OFFSET);
            const puckX = dist > 0 ? (dx / dist) * clampedDist : 0;
            const puckY = dist > 0 ? (dy / dist) * clampedDist : 0;
            puckEl.style.transform = `translate(${puckX}px, ${puckY}px)`;

            if (dist < JOY_DEADZONE) {
                inputState[joyKey].up = false;
                inputState[joyKey].down = false;
                inputState[joyKey].left = false;
                inputState[joyKey].right = false;
                return;
            }

            // 8-way octant resolve. Angle 0 = right; positive = down.
            // Boundaries at every 22.5° (halfway between adjacent octants).
            const angle = Math.atan2(dy, dx);
            const deg = (angle * 180 / Math.PI + 360) % 360;
            inputState[joyKey].right = deg >= 292.5 || deg < 67.5;
            inputState[joyKey].down  = deg >= 22.5  && deg < 157.5;
            inputState[joyKey].left  = deg >= 112.5 && deg < 247.5;
            inputState[joyKey].up    = deg >= 202.5 && deg < 337.5;

            for (const t of e.changedTouches) {
                const target = document.elementFromPoint(t.clientX, t.clientY);

                // doesn't have to land precisely on the puck.
                if (joyTouchId === null && (target === joystickEl || target === puckEl || joystickEl.contains(target))) {
                    joyTouchId = t.identifier;
                    refreshJoyCenter();
                    joystickEl.classList.add('gm-touch-active');
                    updateJoystick(t.clientX, t.clientY);
                    e.preventDefault();
                    continue;
                }
                // Fire button
                if (fireTouchId === null && (target === fireEl || fireEl.contains(target))) {
                    fireTouchId = t.identifier;
                    inputState[btnKey] = true;
                    fireEl.classList.add('gm-touch-active');
                    e.preventDefault();
                    continue;
                }
            }
        }

        function onTouchMove(e) {
            for (const t of e.changedTouches) {
                if (t.identifier === joyTouchId) {
                    updateJoystick(t.clientX, t.clientY);
                    e.preventDefault();
                }
                // Fire button is binary — no move handling needed for it
            }
        }

        function onTouchEnd(e) {
            for (const t of e.changedTouches) {
                if (t.identifier === joyTouchId) {
                    joyTouchId = null;
                    resetJoystickState();
                }
                if (t.identifier === fireTouchId) {
                    fireTouchId = null;
                    inputState[btnKey] = false;
                    fireEl.classList.remove('gm-touch-active');
                }
            }
        }

        // Attach at the overlay level (not window) so touches outside the
        // controls don't accidentally trigger them.
        overlay.addEventListener('touchstart', onTouchStart, { passive: false });
        overlay.addEventListener('touchmove',  onTouchMove,  { passive: false });
        overlay.addEventListener('touchend',   onTouchEnd,   { passive: false });
        overlay.addEventListener('touchcancel', onTouchEnd,  { passive: false });

        // Recompute joystick center on rotation/resize/fullscreen — the
        // element moves around visually and getBoundingClientRect() lies
        // if we cached it from before.
        window.addEventListener('resize', refreshJoyCenter);
        window.addEventListener('orientationchange', refreshJoyCenter);

        return {
            unmount() {
                overlay.remove();
                window.removeEventListener('resize', refreshJoyCenter);
                window.removeEventListener('orientationchange', refreshJoyCenter);
            },
            // For hosts that dynamically change joystick port (unusual)
            setPort(newPort) { /* reserved for later */ },
        };
    },
};

if (typeof globalThis !== 'undefined') {
    globalThis.GMTouchControls = GMTouchControls;
}
</script>

    joystick1: { up: false, down: false, left: false, right: false },
    joystick2: { up: false, down: false, left: false, right: false },
    button1: false,
    button2: false
};

function decode16bit(lo, hi) { return lo + (hi << 8); }

window.addEventListener('DOMContentLoaded', init);

async function init() {
    charset = new gmCharset();

    if (new URLSearchParams(location.search).get('nocredit') === '1') {
        document.querySelector('.credit').style.display = 'none';
    }

    // Tag body with phone-layout class before any layout math runs so
    // gameborder-h resolves against the mobile CSS from the first paint.
    // Tablets keep the desktop layout (they have room for chrome).
    if (GMTouchControls.isPhoneLayout()) {
        document.body.classList.add('mobile-phone');
    }

    // Populate hamburger button icon (declared as empty in HTML). Pause
    // icon initialized on first play state change.
    document.getElementById('hamburgerBtn').innerHTML = GMPlayerChrome.ICONS.hamburger;

    populateJoystickSelects();
    setupVolumeSlider();

    // Mount the shared disk picker inside the game border. Window-level
    // drops are enabled here too so someone with a game already loaded
    // can drag a fresh .d64 to swap games.
    picker = GMDiskPicker.mount(document.getElementById('gameBorder'), {
        extension: '/PRG',
        // Promote dropped disks into the shared localStorage pool + make
        // them the current disk. Other editors see the same pool.
        disk,
        windowDropEnabled: true,
        onPickFile: (name, bytes, d64 /*, diskLabel */) => {
            // gmParser needs loadFileByName to resolve multi-part sprite
            // references etc. — module wired it too, but re-set here so
            // we're consistent regardless of code path.
            globalThis.loadFileByName = (n) => {
                try { return d64.readFile(n); } catch (e) { return null; }
            };
            proceedWithProgram(name, bytes);
        }
    });

    document.getElementById('hamburgerBtn').addEventListener('click', toggleSettingsPopup);
    document.getElementById('playOverlay').addEventListener('click', startGame);
    document.getElementById('fullscreenToggle').addEventListener('click', toggleFullscreen);
    // Refresh fullscreen icon when the state actually changes (Escape key,
    // browser gesture) so it doesn't stick showing "enter fullscreen"
    // after the user has exited via a native path.
    document.addEventListener('fullscreenchange', refreshFullscreenIcon);
    document.addEventListener('webkitfullscreenchange', refreshFullscreenIcon);
    refreshFullscreenIcon();

    // Shared input listener — gates on vm being present and running so
    // key presses before start / after end don't leak into inputState.
    GMPlayerChrome.setupInputListeners({
        inputState,
        getPresets: () => inputSettings,
        isEnabled: () => vm && vm.running
    });

    // Close settings popup on click-outside or Escape.
    document.addEventListener('click', (e) => {
        const popup = document.getElementById('settingsPopup');
        if (!popup.classList.contains('active')) return;
        const burger = document.getElementById('hamburgerBtn');
        if (!popup.contains(e.target) && !burger.contains(e.target)) {
            popup.classList.remove('active');
        }
    });
    document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        const popup = document.getElementById('settingsPopup');
        if (popup.classList.contains('active')) popup.classList.remove('active');
    });

    await loadGame();
}

function toggleSettingsPopup(e) {
    if (e) e.stopPropagation();   // don't trip the click-outside handler
    document.getElementById('settingsPopup').classList.toggle('active');
}

// Apply a new volume level to both audio paths (SFX via host masterGain,
// music via vm.setConfig → _effectiveSongVolume), persist it, and resync
// the UI. The single choke point for every volume change so the slider,
// mute icon, and stored preference never drift apart.
function applyUserVolume(v, { persist = true } = {}) {
    userVolume = Math.max(0, Math.min(1, v));
    if (userVolume > 0) lastNonZeroVolume = userVolume;
    if (masterGain) masterGain.gain.value = SFX_BASELINE * userVolume;
    if (vm) vm.setConfig({ userVolume });
    if (persist) localStorage.setItem(VOLUME_KEY, String(userVolume));
    syncVolumeUI();
}

// Push current state out to the visible controls. Skips writing the slider
// while it's the one being dragged (activeElement) so we don't fight the
// user's own input mid-gesture.
function syncVolumeUI() {
    const slider = document.getElementById('volumeSlider');
    if (slider && document.activeElement !== slider) {
        slider.value = Math.round(userVolume * 100);
    }
    if (audioIndicator) audioIndicator.refresh();
}

// Volume slider — drives applyUserVolume live on drag. Crossing 0 mirrors
// the hard-mute flag so the speaker icon always tells the truth: slide to
// the bottom and it reads muted; slide back up and it clears.
function setupVolumeSlider() {
    const slider = document.getElementById('volumeSlider');
    slider.value = Math.round(userVolume * 100);
    slider.addEventListener('input', () => {
        const v = slider.value / 100;
        if (vm) {
            if (v === 0 && !vm.config.audioMuted) vm.setConfig({ audioMuted: true });
            else if (v > 0 && vm.config.audioMuted) vm.setConfig({ audioMuted: false });
        }
        applyUserVolume(v);
    });
}

// Fill the joy1/joy2 dropdowns from the shared PRESET_LABELS. Runs once
// at init. Selecting either dropdown updates inputSettings + persists.
function populateJoystickSelects() {
    for (const which of ['joy1', 'joy2']) {
        const sel = document.getElementById(which + 'Sel');
        sel.innerHTML = '';
        for (const [value, label] of GMPlayerChrome.PRESET_LABELS) {
            const opt = document.createElement('option');
            opt.value = value;
            opt.textContent = label;
            sel.appendChild(opt);
        }
        sel.value = inputSettings[which];
        sel.addEventListener('change', () => {
            inputSettings = { ...inputSettings, [which]: sel.value };
            GMPlayerChrome.saveInputSettings(INPUT_SETTINGS_KEY, inputSettings);
        });
    }
}

// Three entry modes:
//   1. Embedded (Export): EMBEDDED_PRG / EMBEDDED_D64 populated → skip
//      URL params entirely, decode bytes, jump straight to poster + play.
//   2. URL-driven: `?disk=<url>` present. `file=` optional — missing
//      falls back to auto-load (one PRG) or the program picker (2+).
//   3. Bare visit (no disk, no embedded): show the drop-zone so the
//      visitor can drop their own .d64.
async function loadGame() {
    if (EMBEDDED_PRG && EMBEDDED_D64) {
        const d64Bytes = _b64ToBytes(EMBEDDED_D64);
        const prgBytes = _b64ToBytes(EMBEDDED_PRG);
        const embeddedDisk = new D64(d64Bytes);
        globalThis.loadFileByName = (name) => {
            try { return embeddedDisk.readFile(name); } catch (e) { return null; }
        };
        proceedWithProgram('<embedded>', prgBytes);
        return;
    }

    const params = new URLSearchParams(location.search);
    if (!params.has('disk')) {
        picker.showDropZone();
        return;
    }

    const ok = await GMTools.loadDiskFromUrl({
        diskUrl: params.get('disk'), disk
    });
    if (!ok) {
        showPlayButtonError('invalid disk');
        return;
    }

    // gmParser needs this to compose multi-part sprites that reference
    // other files on the disk. Set up before any PRG parsing.
    globalThis.loadFileByName = (name) => disk.disk.readFile(name);

    const fileName = params.get('file');
    if (!fileName) {
        // No specific file requested — enumerate PRGs and auto-load if
        // there's only one, or hand off to the picker for multiple.
        const prgs = GMTools.listFilesByExtension(disk.disk, '/PRG');
        if (prgs.length === 0) {
            showPlayButtonError('no programs on disk');
            return;
        }
        if (prgs.length === 1) {
            proceedWithProgram(prgs[0], disk.disk.readFile(prgs[0]));
            return;
        }
        picker.showProgramPicker(disk.disk, prgs, disk.diskFileName || params.get('disk'));
        return;
    }

    const actualName = GMTools.findFileCaseInsensitive(disk.disk, fileName);
    if (!actualName) {
        showPlayButtonError('invalid file');
        return;
    }
    if (!actualName.toUpperCase().endsWith('/PRG')) {
        showPlayButtonError('invalid file type');
        return;
    }

    const fileData = disk.disk.readFile(actualName);
    if (!fileData) {
        showPlayButtonError('invalid file');
        return;
    }

    proceedWithProgram(actualName, fileData);
}

// Once we have a name + bytes for the program we want to run, this
// commits it, kicks off the poster, and reveals the play button.
// Shared by all three entry modes (embedded, URL, drop).
function proceedWithProgram(name, bytes) {
    currentFileName = name;
    currentFileData = bytes;
    currentProgramData = parseProgramData(bytes);
    picker.hide();
    document.getElementById('playOverlay').classList.add('active');
    // Fire-and-forget — a poster failure never blocks the play button.
    // The promise is exposed on window so tooling (add-community-disk,
    // future capture scripts) can `await` it instead of polling the
    // canvas. The name is namespaced to make its purpose obvious.
    window.__posterReady = generatePoster();
}

// Decode a base64 string to a Uint8Array. Chunk-loop because atob
// returns a binary string and we need byte codes.
function _b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
}

function showPlayButtonError(text) {
    const btn = document.getElementById('playButton');
    btn.textContent = text;
    btn.disabled = true;
    btn.setAttribute('aria-label', text);
    // The play overlay is hidden by default now — surface it so the
    // error message is actually visible.
    document.getElementById('playOverlay').classList.add('active');
}

// The play button is the user gesture that both starts the VM and
// unlocks the AudioContext. Everything audio-related happens inside
// this handler so browser autoplay policies stay satisfied.
async function startGame() {
    if (!currentProgramData) return;
    document.getElementById('playOverlay').classList.remove('active');

    if (!screen) screen = new c64Screen('gameCanvas');
    if (!vm) vm = new gmVM(screen);

    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioContext.createGain();
        masterGain.gain.value = SFX_BASELINE * userVolume;
        masterGain.connect(audioContext.destination);
    }
    if (audioContext.state === 'suspended') {
        audioContext.resume();
    }

    // Push the persisted user volume into the fresh vm's config so the
    // very first song starts at the right level (rather than defaulting
    // to 1.0 and then getting corrected on the first slider tick).
    vm.setConfig({ userVolume });

    if (!audioIndicator) {
        // Mount inside #volumeControl (in #gameControls) so it flexes with
        // the other icons and anchors the hover-up volume slider. (The
        // shared CSS defaults the indicator to position:absolute; our
        // #gameControls .gm-audio-indicator override neutralises that.)
        audioIndicator = new GMAudioIndicator(document.getElementById('volumeControl'));
        audioIndicator.enableTouchPanel(document.getElementById('volumeControl'));
        audioIndicator.bind({
            // Effectively muted whenever the hard-mute flag is set OR the
            // slider is at zero — keeps the icon truthful against both.
            getMuted: () => vm.config.audioMuted || userVolume === 0,
            setMuted: (muted) => {
                // Unmuting a zeroed slider would still be silent — restore
                // the last audible level so a click actually brings sound back.
                if (!muted && userVolume === 0) {
                    applyUserVolume(lastNonZeroVolume || 0.75);
                }
                vm.setConfig({ audioMuted: muted });
                syncVolumeUI();
            },
            getAudioContext: () => audioContext,
            onUnlock: () => {
                if (vm && vm.currentSong) {
                    try {
                        vm.currentSong.stop();
                        vm.currentSong.play();
                        vm.currentSong.setVolume(vm._effectiveSongVolume());
                    } catch (e) {
                        console.warn('Failed to restart song after audio unlock:', e.message);
                    }
                }
            }
        });
    }

    // Reveal the control cluster (hidden until first play) and wire the
    // pause button once. Icon reflects current vm.paused state.
    document.getElementById('gameControls').style.display = '';
    const pauseBtn = document.getElementById('pauseToggle');
    if (!pauseBtn.dataset.wired) {
        pauseBtn.dataset.wired = '1';
        pauseBtn.addEventListener('click', togglePause);
    }

    // Mount touch controls on the play area (idempotent — no-op on desktop
    // and if already mounted). We wait until startGame rather than mounting
    // in init so the joystick doesn't appear on top of the play overlay.
    if (!touchControls) {
        touchControls = GMTouchControls.mount(
            document.getElementById('playArea'),
            { inputState, port: 1 });
    }

    // Re-parse so the real run gets a fresh mediaStore, unmutated by
    // whatever the poster VM did.
    const programData = parseProgramData(currentFileData);
    const ast = buildAST(programData);
    vm.loadProgram(ast, currentFileData);
    // frameMs pinned to NTSC C64 rate (59.94Hz), catchup on so game speed
    // is wall-clock consistent even under browser throttling.
    vm.start({ opsPerFrame: 50, frameMs: 1000 / 59.94, catchup: true });
    GMPlayerChrome.setPauseIcon(pauseBtn, false);
}

function togglePause() {
    if (!vm) return;
    if (vm.paused) vm.resume();
    else vm.pause();
    GMPlayerChrome.setPauseIcon(document.getElementById('pauseToggle'), vm.paused);
}

// Fullscreen toggle — targets documentElement so the game AND any floating
// touch controls both scale into the fullscreen box. Uses webkit prefix
// as fallback for iPad Safari, which supports Fullscreen API only under
// that name. iOS iPhone Safari doesn't support it at all (silent no-op).
function toggleFullscreen() {
    const el = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
        const req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (req) req.call(el);
    }
}

function refreshFullscreenIcon() {
    const btn = document.getElementById('fullscreenToggle');
    if (!btn) return;
    const active = !!(document.fullscreenElement || document.webkitFullscreenElement);
    // "Enter" icon: outward arrows. "Exit" icon: inward arrows. Chosen for
    // shape recognition rather than reading — the fine strokes render fine
    // even in the reduced-opacity mobile chrome.
    btn.innerHTML = active
        ? `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
             <path d="M9 4 L9 9 L4 9 M15 4 L15 9 L20 9 M20 15 L15 15 L15 20 M4 15 L9 15 L9 20"
                   fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round"/>
           </svg>`
        : `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
             <path d="M4 9 L4 4 L9 4 M15 4 L20 4 L20 9 M20 15 L20 20 L15 20 M9 20 L4 20 L4 15"
                   fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round"/>
           </svg>`;
}

// Kick off a poster render on the game canvas. Screen has to exist first
// so the temp VM has something to draw on. Fire-and-forget — a poster
// failure never blocks the user from starting the game.
async function generatePoster() {
    if (!screen) screen = new c64Screen('gameCanvas');
    const params = new URLSearchParams(location.search);
    await GMPoster.generatePoster({
        screen,
        fileData: currentFileData,
        posterSeconds: GMPoster.getPosterSeconds(params)
    });
}
