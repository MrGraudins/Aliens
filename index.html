<script>// gmScene.js - GameMaker Scene (.PIC file) handler at 320×200 native resolution
//
// === SCENE FILE FORMAT ===
// GameMaker scenes are background images stored as .PIC files on disk.
// They use the C64's multicolor bitmap mode: 160×200 pixels with 4 colors.
//
// Header (6 bytes):
//   [0-4]   Magic number: 00 A0 47 45 4B
//   [5]     RLE flag: 0x00 = uncompressed, 0xFF = RLE compressed
//
// Image Data (8000 bytes uncompressed):
//   [6...8005] Pixel data, or RLE-compressed pairs if flag is 0xFF
//              Each byte contains 4 pixels (2 bits each):
//                bits 7-6 = pixel 0 (leftmost)
//                bits 5-4 = pixel 1
//                bits 3-2 = pixel 2
//                bits 1-0 = pixel 3 (rightmost)
//              Pixels are arranged in 4×8 tiles, filled top-to-bottom
//              within each tile, then left-to-right across the screen.
//
// Footer (10 bytes, after image data):
//   [0]     Colors 1 & 2: high nibble = color1, low nibble = color2
//   [1]     Color 3 in low nibble (high nibble unused)
//   [2]     Background color in low nibble (high nibble unused)
//   [3-8]   Scene name (6 PETSCII characters)
//   [9]     Padding
//
// RLE Compression (when flag = 0xFF):
//   Compressed data consists of pairs: (count-1, value)
//   Count byte 0x00 = repeat 1 time, 0xFF = repeat 256 times
//
// === 320×200 COORDINATE SYSTEM ===
// Like gmSprite, we work at the C64's true 320×200 resolution:
//   - Scene pixels are 160×200 "fat pixels" (multicolor mode)
//   - Each fat pixel becomes a 2×1 block in 320×200 space
//   - This matches how gmSprite renders multicolor sprites
//   - All coordinates align - no more scaling confusion
//
// === INDEXED PIXEL BUFFER ===
// We store pixels as color indices (0-3) rather than RGBA values.
// This allows efficient palette changes without re-parsing the file.
// At render time, indices are converted to actual colors.

class gmScene {

    // Scene dimensions
    static WIDTH = 160;    // Native multicolor width (fat pixels)
    static HEIGHT = 200;   // Native height (same as screen)

    // Tile dimensions for unpacking
    static TILE_WIDTH = 4;     // 4 fat pixels wide
    static TILE_HEIGHT = 8;    // 8 pixels tall
    static TILES_PER_ROW = 40; // 160 / 4 = 40 tiles across

    constructor(fileData) {
        this.name = "";

        // Palette colors (C64 color indices 0-15)
        this._bgColor = 0;
        this._color1 = 0;
        this._color2 = 0;
        this._color3 = 0;

        // Border color - used by runtime, defaults to black
        // Set via "scene X border = color" commands
        this.borderColor = 0;

        // === INDEXED PIXEL BUFFER ===
        // One byte per pixel, values 0-3 (color indices).
        // Stored in row-major order: buffer[y * 160 + x]
        // This is the "source of truth" for the scene's pixels.
        this.pixelBuffer = new Uint8Array(gmScene.WIDTH * gmScene.HEIGHT);

        // Dirty flag - tracks when re-rendering is needed
        // Set when pixels or palette colors change
        this.dirty = true;

        // === RGBA CACHE ===
        // Pre-rendered 320×200 RGBA pixel data for fast blitting.
        // Only regenerated when dirty=true.
        this.rgbaCache = new Uint8Array(320 * 200 * 4);

        // Parse file and populate pixelBuffer
        if (fileData) {
            this.parseSceneFile(fileData);
            this.unpackToBuffer();
        }
    }

    // === PALETTE PROPERTIES ===
    // Setters auto-mark dirty so render cache gets rebuilt
    get bgColor() { return this._bgColor; }
    set bgColor(v) { this._bgColor = v; this.dirty = true; }

    get color1() { return this._color1; }
    set color1(v) { this._color1 = v; this.dirty = true; }

    get color2() { return this._color2; }
    set color2(v) { this._color2 = v; this.dirty = true; }

    get color3() { return this._color3; }
    set color3(v) { this._color3 = v; this.dirty = true; }

    // For compatibility with code that calls this explicitly
    markColorsDirty() {
        this.dirty = true;
    }

    // Exposes the 160×200 palette-index buffer for consumers that need
    // pixel-level scene info beyond the rendered RGB. Returned array is
    // the live buffer — callers must not mutate it.
    getIndexBuffer() {
        return this.pixelBuffer;
    }

    // Build a priority mask in the shape gmSprite.blitToBuffer expects.
    // skipIndices is a Set of palette indices (0-3) that should hide a
    // sprite drawn with this mask — the caller picks which ones based on
    // the platform semantic they're modelling (e.g. C64 VIC sprite-priority
    // hides under colors 2 and 3, so the runtime passes Set([2, 3])).
    getUnderMask(skipIndices) {
        return {
            indexBuffer: this.pixelBuffer,
            indexWidth:  gmScene.WIDTH,
            indexHeight: gmScene.HEIGHT,
            skipIndices
        };
    }

    // Clear the scene - fill all pixels with background color (palette index 0)
    clear() {
        // Fill the pixel buffer with 0s (background color index)
        this.pixelBuffer.fill(0);
        this.dirty = true;
    }

    // === FILE PARSING ===
    parseSceneFile(fileData) {
        const headerLength = 6;
        const footerLength = 10;
        const imageLength = (160 * 200) / 4; // 4 pixels per byte = 8000 bytes

        // Check RLE flag (byte 5): 0xFF means compressed
        if (fileData[5] === 0xFF) {
            // GameMaker follows its RLE pairs with one stray byte (00/55/AA/FF in the originals,
            // unrelated to the image; its loader never reads it). Keep it so a re-save is identical.
            if ((fileData.length - headerLength) % 2 === 1) this._rleTrailer = fileData[fileData.length - 1];
            fileData = this.decodeRLE(fileData, headerLength, imageLength, footerLength);
        }

        // === FOOTER (PALETTE + NAME) ===
        // Footer starts after image data
        const footerOffset = headerLength + imageLength;
        const footerBytes = fileData.slice(footerOffset);

        // Color encoding (GameMaker packs colors into nibbles):
        //   Byte 0: color1 (high nibble), color2 (low nibble)
        //   Byte 1: color3 (low nibble)
        //   Byte 2: background (low nibble)
        this._color1  = footerBytes[0] >> 4;   // First 4 bits of Byte 0
        this._color2  = footerBytes[0] & 0x0F; // Last 4 bits of Byte 0
        this._color3  = footerBytes[1] & 0x0F; // Last 4 bits of Byte 1
        this._bgColor = footerBytes[2] & 0x0F; // Last 4 bits of Byte 2

        // Scene name: 6 PETSCII characters starting at byte 3
        // We use this embedded name instead of the disk filename
        this.name = decodeString(footerBytes.slice(3, 9)).trim();

        // Store raw image data for unpacking
        this.rawImageData = fileData.slice(headerLength, headerLength + imageLength);
    }

    // === RLE DECOMPRESSION ===
    // Most scenes are RLE-compressed to save disk space.
    // Format: pairs of (count-1, value) bytes
    //   count byte 0x00 = repeat 1 time
    //   count byte 0xFF = repeat 256 times
    decodeRLE(compressedData, headerLength, imageLength, footerLength) {
        const expandedData = new Uint8Array(headerLength + imageLength + footerLength);

        // Header is not compressed - copy directly
        expandedData.set(compressedData.slice(0, headerLength));

        // Expand RLE pairs
        let writeIndex = headerLength;
        for (let i = headerLength; i < compressedData.length; i += 2) {
            const repeatCount = compressedData[i] + 1; // 0x00 = 1, 0xFF = 256
            for (let r = 0; r < repeatCount; r++) {
                expandedData[writeIndex++] = compressedData[i + 1];
            }
        }

        return expandedData;
    }

    // === TILE UNPACKING ===
    // GameMaker stores image data in 4×8 pixel tiles, filled column-by-column
    // (top-to-bottom within tile, then left-to-right across screen).
    // Each byte contains 4 pixels (2 bits each).
    //
    // Tile layout visualization (for a 160×200 image):
    //   Tile 0 at (0,0), Tile 1 at (4,0), ... Tile 39 at (156,0)
    //   Tile 40 at (0,8), Tile 41 at (4,8), ...
    //   ... and so on for 25 rows of tiles (200/8 = 25)
    //
    // Within each tile, bytes are ordered top-to-bottom (8 bytes per tile).
    unpackToBuffer() {
        let currentTileX = 0;
        let currentTileY = 0;
        let currentRowInTile = 0;
        let dataIndex = 0;

        while (dataIndex < this.rawImageData.length) {
            const byte = this.rawImageData[dataIndex++];

            // Decode 4 pixels from this byte (2 bits each, MSB first)
            // Bits 7-6 = pixel 0, bits 5-4 = pixel 1, bits 3-2 = pixel 2, bits 1-0 = pixel 3
            const pixels = [
                (byte >> 6) & 0x03,
                (byte >> 4) & 0x03,
                (byte >> 2) & 0x03,
                byte & 0x03
            ];

            // Calculate position in 160×200 buffer
            const baseX = currentTileX * gmScene.TILE_WIDTH;
            const baseY = currentTileY * gmScene.TILE_HEIGHT + currentRowInTile;

            // Write 4 pixels to buffer
            for (let i = 0; i < 4; i++) {
                const x = baseX + i;
                if (x < 160 && baseY < 200) {
                    this.pixelBuffer[baseY * 160 + x] = pixels[i];
                }
            }

            // Advance through tile structure
            currentRowInTile++;
            if (currentRowInTile >= gmScene.TILE_HEIGHT) {
                currentRowInTile = 0;
                currentTileX++;
                if (currentTileX >= gmScene.TILES_PER_ROW) {
                    currentTileX = 0;
                    currentTileY++;
                }
            }
        }
    }

    // === PIXEL ACCESS ===
    // For editing scenes (future feature) or collision detection

    // Set a pixel in the indexed buffer (x: 0-159, y: 0-199, colorIndex: 0-3)
    setPixel(x, y, colorIndex) {
        if (x >= 0 && x < 160 && y >= 0 && y < 200) {
            this.pixelBuffer[y * 160 + x] = colorIndex & 0x03;
            this.dirty = true;
        }
    }

    // Get a pixel's color index (0-3)
    getPixel(x, y) {
        if (x >= 0 && x < 160 && y >= 0 && y < 200) {
            return this.pixelBuffer[y * 160 + x];
        }
        return 0;
    }

    // === PALETTE ===
    // Build current palette as array of RGB arrays from c64Palette
    _getCurrentPalette() {
        return [
            c64Palette[this._bgColor],  // Index 0 = background
            c64Palette[this._color1],   // Index 1
            c64Palette[this._color2],   // Index 2
            c64Palette[this._color3]    // Index 3
        ];
    }

    // === RGBA CACHE RENDERING ===
    // Convert indexed 160×200 buffer to RGBA 320×200 buffer.
    // Each fat pixel becomes a 2×1 block (matching multicolor sprite rendering).
    _renderToRgbaCache() {
        const palette = this._getCurrentPalette();

        for (let y = 0; y < 200; y++) {
            for (let x = 0; x < 160; x++) {
                const colorIndex = this.pixelBuffer[y * 160 + x];
                const color = palette[colorIndex];

                // Each fat pixel (x) becomes two pixels in 320-wide space (x*2 and x*2+1)
                const x320 = x * 2;
                const idx1 = (y * 320 + x320) * 4;
                const idx2 = (y * 320 + x320 + 1) * 4;

                // Left pixel
                this.rgbaCache[idx1] = color[0];     // R
                this.rgbaCache[idx1 + 1] = color[1]; // G
                this.rgbaCache[idx1 + 2] = color[2]; // B
                this.rgbaCache[idx1 + 3] = 255;      // A

                // Right pixel (same color - fat pixel)
                this.rgbaCache[idx2] = color[0];
                this.rgbaCache[idx2 + 1] = color[1];
                this.rgbaCache[idx2 + 2] = color[2];
                this.rgbaCache[idx2 + 3] = 255;
            }
        }

        this.dirty = false;
    }

    // === BLITTING ===
    // Copy scene to a target pixel buffer (e.g., c64Screen.pixels).
    // Unlike sprites, scenes have no transparency - they fill the entire screen.
    blitToBuffer(target, targetWidth, targetHeight) {
        // Rebuild RGBA cache if needed
        if (this.dirty) {
            this._renderToRgbaCache();
        }

        // Copy entire scene to target buffer
        // Scene is always 320×200, same as screen, so direct copy works
        if (targetWidth === 320 && targetHeight === 200) {
            target.set(this.rgbaCache);
        } else {
            // Fallback: copy pixel by pixel (shouldn't normally happen)
            for (let y = 0; y < 200 && y < targetHeight; y++) {
                for (let x = 0; x < 320 && x < targetWidth; x++) {
                    const srcIdx = (y * 320 + x) * 4;
                    const dstIdx = (y * targetWidth + x) * 4;
                    target[dstIdx] = this.rgbaCache[srcIdx];
                    target[dstIdx + 1] = this.rgbaCache[srcIdx + 1];
                    target[dstIdx + 2] = this.rgbaCache[srcIdx + 2];
                    target[dstIdx + 3] = this.rgbaCache[srcIdx + 3];
                }
            }
        }
    }

    // === RLE COMPRESSION ===
    // Compress data using RLE format: pairs of (count-1, value) bytes.
    // Maximum run length is 256 (encoded as 0xFF).
    encodeRLE(uncompressedData) {
        const compressed = [];
        let i = 0;

        while (i < uncompressedData.length) {
            const value = uncompressedData[i];
            let runLength = 1;

            // Count consecutive identical bytes (max 256)
            while (i + runLength < uncompressedData.length &&
                   uncompressedData[i + runLength] === value &&
                   runLength < 256) {
                runLength++;
            }

            // Output (count-1, value) pair
            compressed.push(runLength - 1);
            compressed.push(value);
            i += runLength;
        }

        return new Uint8Array(compressed);
    }

    // === SAVING ===
    // Pack the pixel buffer back into GameMaker .PIC format.
    // Automatically chooses RLE or uncompressed based on which is smaller.
    // Returns a Uint8Array ready to be saved to disk.
    save() {
        const headerLength = 6;
        const imageLength = 8000; // 160*200/4 = 8000 bytes
        const footerLength = 10;

        // First, generate the image data + footer (without header)
        const imageAndFooter = new Uint8Array(imageLength + footerLength);

        // === IMAGE DATA ===
        // Pack pixels into tiles (4×8), 4 pixels per byte
        let dataIndex = 0;
        let currentTileX = 0;
        let currentTileY = 0;
        let currentRowInTile = 0;

        while (dataIndex < imageLength) {
            const baseX = currentTileX * gmScene.TILE_WIDTH;
            const baseY = currentTileY * gmScene.TILE_HEIGHT + currentRowInTile;

            // Pack 4 pixels into one byte (2 bits each, MSB first)
            let byte = 0;
            for (let i = 0; i < 4; i++) {
                const x = baseX + i;
                const colorIndex = (x < 160 && baseY < 200)
                    ? this.pixelBuffer[baseY * 160 + x]
                    : 0;
                byte |= (colorIndex & 0x03) << (6 - i * 2);
            }
            imageAndFooter[dataIndex++] = byte;

            // Advance through tile structure
            currentRowInTile++;
            if (currentRowInTile >= gmScene.TILE_HEIGHT) {
                currentRowInTile = 0;
                currentTileX++;
                if (currentTileX >= gmScene.TILES_PER_ROW) {
                    currentTileX = 0;
                    currentTileY++;
                }
            }
        }

        // === FOOTER ===
        const footerOffset = imageLength;

        // Color encoding (packed nibbles):
        //   Byte 0: color1 (high nibble), color2 (low nibble)
        //   Byte 1: color3 (low nibble)
        //   Byte 2: background (low nibble)
        imageAndFooter[footerOffset] = (this._color1 << 4) | (this._color2 & 0x0F);
        imageAndFooter[footerOffset + 1] = this._color3 & 0x0F;
        imageAndFooter[footerOffset + 2] = this._bgColor & 0x0F;

        // Scene name: 6 screen code characters
        const name = (this.name || 'SCENE').padEnd(6, ' ').substring(0, 6).toUpperCase();
        const encodedName = encodeString(name, 6);
        for (let i = 0; i < 6; i++) {
            imageAndFooter[footerOffset + 3 + i] = encodedName[i];
        }

        // Padding byte
        imageAndFooter[footerOffset + 9] = 0x00;

        // === COMPRESSION DECISION ===
        // Try RLE compression and compare sizes. GameMaker's compressed stream covers one byte more
        // than the uncompressed footer: every original ends its RLE with a run of TWO zeros (01 00)
        // where the uncompressed file has one, so encode an extra 0x00 past the footer.
        const rleSource = new Uint8Array(imageAndFooter.length + 1);
        rleSource.set(imageAndFooter);
        const rleData = this.encodeRLE(rleSource);
        const uncompressedSize = headerLength + imageLength + footerLength;
        const compressedSize = headerLength + rleData.length;

        if (compressedSize < uncompressedSize) {
            // Use RLE compression
            const data = new Uint8Array(compressedSize + 1);

            // Header with RLE flag
            data[0] = 0x00;
            data[1] = 0xA0;
            data[2] = 0x47;
            data[3] = 0x45;
            data[4] = 0x4B;
            data[5] = 0xFF; // RLE flag: 0xFF = compressed

            // Compressed data, then GameMaker's stray trailing byte (see parseSceneFile)
            data.set(rleData, headerLength);
            data[compressedSize] = this._rleTrailer ?? 0x00;

            return data;
        } else {
            // Use uncompressed format
            const data = new Uint8Array(uncompressedSize);

            // Header without RLE flag
            data[0] = 0x00;
            data[1] = 0xA0;
            data[2] = 0x47;
            data[3] = 0x45;
            data[4] = 0x4B;
            data[5] = 0x00; // RLE flag: 0x00 = uncompressed

            // Uncompressed data
            data.set(imageAndFooter, headerLength);

            return data;
        }
    }

    // Create a blank scene with specified colors
    static createBlank(bgColor = 6, color1 = 1, color2 = 9, color3 = 0) {
        const scene = new gmScene();
        scene._bgColor = bgColor;
        scene._color1 = color1;
        scene._color2 = color2;
        scene._color3 = color3;
        scene.clear();
        scene.name = 'SCENE';
        return scene;
    }
}

// Make available globally for browser and Node.js testing
if (typeof globalThis !== 'undefined') {
    globalThis.gmScene = gmScene;
}

<script>// gmSound.js - GameMaker Sound (.SND file) handler
//
// === ARCHITECTURE ===
// gmSound parses GameMaker sound files and provides playback via Web Audio API.
// Each sound instance is independent, matching how gmSprite/gmScene work.
//
// === SOUND FILE FORMAT ===
// GameMaker sounds are stored as .SND files with this structure:
//   [0-4]   Magic number: 00 A0 47 45 4B
//   [5-10]  Filename (6 PETSCII characters)
//   [11]    Unknown
//   [12]    Repeat count (0 = play once, N = repeat N times)
//   [13]    Repeat delay (0-255, maps to 0-4 seconds)
//   [14]    Speed (XOR'd with 128)
//   [15]    EQ flag (high nibble) and volume (low nibble)
//   [16]    Unknown
//   [17]    Frame count
//   [18+]   Frame data (16 bytes per frame)
//
// === FRAME FORMAT (16 bytes each) ===
//   [0]     Waveform: 0x10=triangle, 0x20=sawtooth, 0x40=square, 0x80=noise
//   [1]     Attack (high nibble) / Decay (low nibble)
//   [2]     Sustain (high nibble) / Release (low nibble)
//   [3]     Frequency high byte
//   [4]     Frequency low byte
//   [5]     Speed (pitch sweep, XOR'd with 128)
//   [6]     Pulse width high byte
//   [7]     Pulse width low byte
//   [8]     Duration (in NTSC frames, ~60fps)
//   [9]     EQ low pass (low nibble, 0-7)
//   [10]    EQ band pass (high nibble, 0-15) / high pass (low nibble, 0-15)
//   [11]    Tie flag (high nibble = 0x80 means tie is on)
//   [12-15] Padding
//
// === SID CHIP EMULATION ===
// The C64's SID chip is emulated using Web Audio API:
//   - Triangle, sawtooth, square waves via PeriodicWave
//   - Noise via LFSR (Linear Feedback Shift Register)
//   - ADSR envelope via GainNode automation
//   - Frequency sweep via scheduled frequency changes

class gmSound {

    // Waveform constants (matches SID register values)
    static WAVE_TRIANGLE = 0x10;
    static WAVE_SAWTOOTH = 0x20;
    static WAVE_SQUARE = 0x40;
    static WAVE_NOISE = 0x80;

    // Waveform names for display
    static WAVE_NAMES = {
        0x10: "triangle",
        0x20: "sawtooth",
        0x40: "square",
        0x80: "noise"
    };

    // Attack times in ms (from C64 Programmer's Reference Guide)
    static ATTACK_TIMES = [2, 8, 16, 24, 38, 56, 68, 80, 100, 250, 500, 800, 1000, 3000, 5000, 8000];

    // Decay/Release times in ms (from C64 Programmer's Reference Guide)
    static DECAY_TIMES = [6, 24, 48, 72, 114, 168, 204, 240, 300, 700, 1500, 2400, 3000, 9000, 15000, 24000];

    // File structure constants
    static HEADER_SIZE = 18;
    static FRAME_SIZE = 16;
    static MAGIC = [0x00, 0xA0, 0x47, 0x45, 0x4B];

    // Persistent LFSR state - SID's noise LFSR runs continuously, never resets
    // This makes each noise trigger sound different (like real SID)
    static noiseLfsr = 0x7FFFFF;

    // Haptic feedback: fire the mobile vibration API when a sound uses the
    // noise waveform (0x80) or contains a low-frequency (< HAPTIC_LOW_FREQ_HZ)
    // frame. Only relevant on touch devices — desktop browsers ignore
    // navigator.vibrate. Music (gmMusic) is deliberately excluded — this
    // fires from gmSound.play() only, so a laser or explosion buzzes but
    // a bass note in a song doesn't.
    static HAPTIC_ENABLED = true;
    static HAPTIC_LOW_FREQ_HZ = 100;   // sub-100Hz counts as "bass thump"
    static HAPTIC_MAX_MS = 40;          // cap so a long explosion doesn't rattle for seconds

    constructor(fileData) {
        this.name = "";
        this.repeatCount = 0;
        this.repeatDelay = 0;
        this.speed = 0;
        this.eqOn = false;
        this.volume = 15;
        this.frames = [];

        // Audio state
        this.activeSources = [];
        this.audioContext = null;
        this.masterGain = null;

        if (fileData) {
            this.parse(fileData);
        }
    }

    // Parse sound file data
    parse(fileData) {
        // Verify magic number (warn but continue - some files may have different headers)
        let magicValid = true;
        for (let i = 0; i < 5; i++) {
            if (fileData[i] !== gmSound.MAGIC[i]) {
                magicValid = false;
                break;
            }
        }
        // Magic mismatch is tolerated (some period disks have alternate
        // header formats and the sound still plays), so no branch here.

        // Header fields
        this.name = this._decodeString(fileData.slice(5, 11));
        this.repeatCount = fileData[12];
        this.repeatDelay = fileData[13];
        this.speed = 255 - fileData[14];
        this.eqOn = (fileData[15] >> 4) > 7;
        this.volume = fileData[15] & 0x0F;
        // Bits 4-6 of byte 15 aren't modeled (most GameMaker files have 0x7_ here, some 0x0_),
        // but they must survive a re-save for the file to match what GameMaker wrote.
        this._byte15Extra = fileData[15] & 0x70;
        const frameCount = fileData[17];

        // Parse frames
        this.frames = [];
        for (let i = 0; i < frameCount; i++) {
            const o = gmSound.HEADER_SIZE + (i * gmSound.FRAME_SIZE);
            this.frames.push({
                wave: fileData[o],
                att: fileData[o + 1] >> 4,
                dec: fileData[o + 1] & 0x0F,
                sus: fileData[o + 2] >> 4,
                rel: fileData[o + 2] & 0x0F,
                freqHi: fileData[o + 3],
                freqLo: fileData[o + 4],
                spd: fileData[o + 5] ^ 0x80, // XOR 128: file format to display format
                pulseHi: fileData[o + 6],
                pulseLo: fileData[o + 7],
                dur: fileData[o + 8],
                eqLowPass: fileData[o + 9] & 0x0F,      // 0-7
                eqBandPass: fileData[o + 10] >> 4,      // 0-15
                eqHighPass: fileData[o + 10] & 0x0F,    // 0-15
                tie: (fileData[o + 11] >> 4) === 8,
                // The frame's raw 16 bytes, so serialize() can carry through bits we don't model
                // (e.g. byte 13 is 0x80 in one frame of SIREN/SND). Never mutated; frames created
                // in the editor simply have no _raw and those bits default to zero.
                _raw: fileData.slice(o, o + gmSound.FRAME_SIZE)
            });
        }
    }

    // Decode screen code string
    _decodeString(bytes) {
        return decodeString(bytes).trim();
    }

    // Encode string to screen codes (6 bytes, padded with spaces)
    _encodeString(str) {
        // Use encodeString from c64lib for screen codes (uppercase)
        return encodeString(str.toUpperCase(), 6);
    }

    // Serialize sound data back to file format
    // Returns Uint8Array suitable for writing to D64
    serialize() {
        const frameCount = this.frames.length;
        // Exactly header + frames: every original GameMaker .SND is 18 + 16 * frames bytes.
        // (This used to add a "trailing 00" byte; that was never in GameMaker's files.)
        const totalSize = gmSound.HEADER_SIZE + (frameCount * gmSound.FRAME_SIZE);
        const data = new Uint8Array(totalSize);

        // Magic number (bytes 0-4)
        for (let i = 0; i < 5; i++) {
            data[i] = gmSound.MAGIC[i];
        }

        // Name (bytes 5-10)
        const nameBytes = this._encodeString(this.name);
        for (let i = 0; i < 6; i++) {
            data[5 + i] = nameBytes[i];
        }

        // Unknown byte 11 (observed as 0x02 in files)
        data[11] = 0x02;

        // Repeat count (byte 12)
        data[12] = this.repeatCount;

        // Repeat delay (byte 13)
        data[13] = this.repeatDelay;

        // Speed (byte 14) - stored inverted
        data[14] = 255 - this.speed;

        // EQ on (bit 7) + Volume (bits 0-3) (byte 15)
        // eqOn: when true, high nibble > 7 (we use 0x80)
        data[15] = (this.eqOn ? 0x80 : 0x00) | (this._byte15Extra || 0) | (this.volume & 0x0F);

        // Unknown byte 16 (observed as 0x00)
        data[16] = 0x00;

        // Frame count (byte 17)
        data[17] = frameCount;

        // Serialize frames
        for (let i = 0; i < frameCount; i++) {
            const frame = this.frames[i];
            const o = gmSound.HEADER_SIZE + (i * gmSound.FRAME_SIZE);

            // Start from the frame's original bytes (if it came from a file) so unmodeled bits
            // round-trip; every modeled field below overwrites its own bits.
            if (frame._raw) data.set(frame._raw, o);

            // Wave type (byte 0)
            data[o] = frame.wave;

            // Attack (high nibble) + Decay (low nibble) (byte 1)
            data[o + 1] = ((frame.att & 0x0F) << 4) | (frame.dec & 0x0F);

            // Sustain (high nibble) + Release (low nibble) (byte 2)
            data[o + 2] = ((frame.sus & 0x0F) << 4) | (frame.rel & 0x0F);

            // Frequency hi (byte 3)
            data[o + 3] = frame.freqHi;

            // Frequency lo (byte 4)
            data[o + 4] = frame.freqLo;

            // Speed/sweep (byte 5) - XOR 128 to convert display format to file format
            data[o + 5] = frame.spd ^ 0x80;

            // Pulse width hi (byte 6)
            data[o + 6] = frame.pulseHi;

            // Pulse width lo (byte 7)
            data[o + 7] = frame.pulseLo;

            // Duration (byte 8)
            data[o + 8] = frame.dur;

            // EQ low pass (byte 9, low nibble)
            data[o + 9] = (data[o + 9] & 0xF0) | (frame.eqLowPass & 0x0F);

            // EQ band pass (high nibble) + high pass (low nibble) (byte 10)
            data[o + 10] = ((frame.eqBandPass & 0x0F) << 4) | (frame.eqHighPass & 0x0F);

            // Tie flag (byte 11) - 0x80 when tie is on
            data[o + 11] = (data[o + 11] & 0x0F) | (frame.tie ? 0x80 : 0x00);

            // Bytes 12-15 aren't modeled: carried from _raw above, else zero.
        }

        return data;
    }

    // Decode speed byte to sweep parameters
    // Returns { steps: number of freqHi steps, direction: +1 for up, -1 for down, active: boolean }
    // GM behavior:
    //   0 = no sweep (dead zone)
    //   1-127 = sweep UP (higher value = more steps = faster)
    //     1 = slowest up (1 step), 127 = fastest up (127 steps)
    //   128-254 = sweep DOWN (lower value = more steps = faster)
    //     128 = fastest down (127 steps), 254 = slowest down (1 step)
    //   255 = no sweep (dead zone)
    // Dead zone in practice: 0, 1, 254, 255 (too slow to hear within max duration)
    _decodeSpeed(byte) {
        if (byte === 0 || byte === 255) {
            return { steps: 0, direction: 0, active: false };
        } else if (byte >= 1 && byte <= 127) {
            // Sweep UP: 1 = 1 step (slow), 127 = 127 steps (fast)
            return { steps: byte, direction: 1, active: true };
        } else {
            // byte >= 128 && byte <= 254: Sweep DOWN
            // 128 = 127 steps (fast), 254 = 1 step (slow)
            return { steps: 255 - byte, direction: -1, active: true };
        }
    }

    // Convert C64 frequency register to Hz
    _freqToHz(hi, lo) {
        const fn = (hi << 8) | lo;
        return fn * 0.06097;
    }

    // Initialize audio context (must be called after user interaction)
    async initAudio() {
        if (!this.audioContext) {
            this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            this.masterGain = this.audioContext.createGain();
            this.masterGain.gain.value = 0.1;
            this.masterGain.connect(this.audioContext.destination);
        }
        // Resume if suspended (browsers require user gesture)
        if (this.audioContext.state === 'suspended') {
            this.audioContext.resume();
        }
    }

    // Stop all active playback
    stop() {
        // Cancel any pending batch scheduling
        if (this._scheduleTimerId) {
            clearTimeout(this._scheduleTimerId);
            this._scheduleTimerId = null;
        }
        this._currentRepeat = Infinity; // Prevent further batches

        // Cancel all frame change timers
        if (this._frameTimerIds) {
            this._frameTimerIds.forEach(id => clearTimeout(id));
            this._frameTimerIds = [];
        }

        this.activeSources.forEach(source => {
            try {
                source.stop();
            } catch (e) {
                // Already stopped
            }
        });
        this.activeSources = [];
    }

    // Pause playback - freezes audio exactly where it is.
    pause() {
        if (this.audioContext && this.activeSources.length > 0) {
            this.audioContext.suspend();
        }
    }

    // Resume playback from where it was paused.
    resume() {
        if (this.audioContext) {
            this.audioContext.resume();
        }
    }

    // Check if sound is currently playing
    isPlaying() {
        return this.activeSources && this.activeSources.length > 0;
    }

    // Play the sound
    async play(audioContext = null, masterGain = null) {
        // Use provided context or initialize our own
        if (audioContext) {
            this.audioContext = audioContext;
            this.masterGain = masterGain || audioContext.destination;
        } else {
            await this.initAudio();
        }

        this.stop();

        // Fire haptic feedback before we schedule audio — the vibration
        // should feel synchronous with the "trigger" event, not delayed
        // to when the first sample comes out of the mixer.
        this._triggerHaptic();

        const repeatDelaySeconds = (this.repeatDelay / 255) * 8;

        // Schedule repeats in batches to avoid overwhelming the audio system
        const batchSize = 8; // Number of repeats per batch
        this._currentRepeat = 0;
        this._repeatDelaySeconds = repeatDelaySeconds;
        this._batchSize = batchSize;
        this._scheduleTimerId = null;
        this._frameTimerIds = []; // Track frame change timers for cleanup

        // Start first batch with small delay to ensure all scheduling happens before playback
        this._scheduleBatch(this.audioContext.currentTime + 0.02); // 20ms buffer
    }

    // Set callback for frame changes during playback
    // callback receives (frameIndex, repeatIndex)
    setOnFrameChange(callback) {
        this._onFrameChange = callback;
    }

    // Scan frames for noise waveform or sub-100Hz frequency and, if found,
    // trigger a short vibration. Duration scales with the loudest frame's
    // envelope volume so a whisper-quiet sample doesn't get a punchy buzz.
    // No-op silently if the browser has no vibration API (all desktops).
    _triggerHaptic() {
        if (!gmSound.HAPTIC_ENABLED) return;
        if (typeof navigator === 'undefined' || !navigator.vibrate) return;

        let hasNoise = false;
        let hasLowFreq = false;
        let peakVol = 0;
        for (const frame of this.frames) {
            if (frame.wave === gmSound.WAVE_NOISE) hasNoise = true;
            const hz = this._freqToHz(frame.freqHi, frame.freqLo);
            if (hz > 0 && hz < gmSound.HAPTIC_LOW_FREQ_HZ) hasLowFreq = true;
            // frame.sus is 0-15; approximates the loudness we care about
            if (frame.sus > peakVol) peakVol = frame.sus;
        }
        if (!hasNoise && !hasLowFreq) return;

        // Scale 8..HAPTIC_MAX_MS by peak sustain — noise-only chirps get a
        // brief tick, thunder-y explosions get the full buzz.
        const volFactor = Math.max(0.25, peakVol / 15);
        const ms = Math.round(8 + (gmSound.HAPTIC_MAX_MS - 8) * volFactor);
        try { navigator.vibrate(ms); } catch (e) { /* some browsers throw in iframes */ }
    }

    // Schedule a batch of repeats
    _scheduleBatch(startTime) {
        if (this._currentRepeat > this.repeatCount) {
            return; // All repeats done
        }

        let time = startTime;
        const batchEnd = Math.min(this._currentRepeat + this._batchSize, this.repeatCount + 1);

        // Global speed affects duration interpretation
        // speed 254 = normal (1x), speed 127 = half speed (2x duration), etc.
        // Higher speed value = faster playback = shorter durations
        const speedMultiplier = (this.speed > 0) ? (254 / this.speed) : 254;

        for (let r = this._currentRepeat; r < batchEnd; r++) {
            for (let i = 0; i < this.frames.length; i++) {
                const frame = this.frames[i];
                const freq = this._freqToHz(frame.freqHi, frame.freqLo);
                const waveType = gmSound.WAVE_NAMES[frame.wave] || 'square';

                // Envelope durations (not affected by speed)
                const att = gmSound.ATTACK_TIMES[frame.att] / 1000;
                const dec = gmSound.DECAY_TIMES[frame.dec] / 1000;
                // Duration in seconds, scaled by global speed
                const dur = frame.dur * 0.01666667 * speedMultiplier; // NTSC frame to seconds (gate time)

                // Determine if this is the last frame of the last repeat
                const isLastFrame = (i === this.frames.length - 1) && (r === this.repeatCount);

                // Release only applies to the LAST frame when tie is on
                // All other frames are hard cuts at dur
                const rel = (frame.tie && isLastFrame) ? gmSound.DECAY_TIMES[frame.rel] / 1000 : 0;

                // Tiny gap between frames when tie is off (simulates SID gate)
                const gap = frame.tie ? 0 : 0.005; // 5ms gap

                // Sound plays for dur (minus gap if tie off), plus release on last frame
                const soundDuration = dur - gap + rel;

                const sweep = this._decodeSpeed(frame.spd);

                // Create sound source
                let source;
                if (waveType === "triangle") {
                    source = this._createTriangle(freq);
                } else if (waveType === "sawtooth") {
                    source = this._createSawtooth(freq);
                } else if (waveType === "square") {
                    const pulseWidth = (frame.pulseHi << 8) | frame.pulseLo;
                    source = this._createSquare(freq, pulseWidth);
                } else if (waveType === "noise") {
                    source = this._createNoise(soundDuration, frame.freqHi, frame.freqLo, sweep);
                } else {
                    source = this._createTriangle(freq);
                }

                // Per-sound volume (0..15) scales the whole envelope. Until
                // we plumbed this through, sound-maker's volume slider was
                // a no-op — it changed the stored value but the envelope
                // always ramped to 1.0.
                const vol = (this.volume & 0x0F) / 15;
                const sustainLevel = (frame.sus / 15) * vol;

                // Create envelope
                const { gainNode, schedule } = this._createEnvelope(att, dec, sustainLevel, rel, soundDuration, vol);

                // Frequency sweep for non-noise waveforms
                if (waveType !== "noise" && sweep.active) {
                    const sweepTotalDuration = 255 * 0.01666667; // Max duration for sweep timing
                    const segmentDuration = sweepTotalDuration / sweep.steps;
                    const effectiveDuration = Math.min(dur, sweepTotalDuration);

                    for (let j = 1; j <= sweep.steps; j++) {
                        const hi = (frame.freqHi + sweep.direction * j + 256) % 256;
                        const freqStep = this._freqToHz(hi, frame.freqLo);
                        const t = time + j * segmentDuration;
                        if (t > time + effectiveDuration) break;
                        source.frequency.setValueAtTime(freqStep, t);
                    }
                }

                // Create filter chain if EQ is enabled
                if (this.eqOn) {
                    const filterChain = this._createFilterChain(frame.eqLowPass, frame.eqBandPass, frame.eqHighPass);
                    source.connect(filterChain.input);
                    filterChain.output.connect(gainNode);
                } else {
                    source.connect(gainNode);
                }
                gainNode.connect(this.masterGain);

                // Start and schedule
                source.start(time);
                schedule(time);
                source.stop(time + soundDuration);

                this.activeSources.push(source);

                // Auto-cleanup when source finishes to prevent memory buildup
                source.onended = () => {
                    const idx = this.activeSources.indexOf(source);
                    if (idx !== -1) {
                        this.activeSources.splice(idx, 1);
                    }
                    try {
                        source.disconnect();
                        gainNode.disconnect();
                    } catch (e) {
                        // Already disconnected
                    }
                };

                // Schedule frame change callback
                if (this._onFrameChange) {
                    const frameIndex = i;
                    const repeatIndex = r;
                    const delay = (time - this.audioContext.currentTime) * 1000;
                    const timerId = setTimeout(() => {
                        if (this._onFrameChange) {
                            this._onFrameChange(frameIndex, repeatIndex);
                        }
                    }, Math.max(0, delay));
                    this._frameTimerIds.push(timerId);
                }

                time += dur; // Next frame starts after gate time (release overlaps)
            }

            // Delay between repeats
            if (r < this.repeatCount) {
                time += this._repeatDelaySeconds;
            }
        }

        this._currentRepeat = batchEnd;

        // Schedule next batch if there are more repeats
        if (this._currentRepeat <= this.repeatCount) {
            // Schedule next batch to start slightly before current batch ends
            const nextBatchDelay = (time - this.audioContext.currentTime - 0.5) * 1000;
            this._scheduleTimerId = setTimeout(() => {
                this._scheduleBatch(time);
            }, Math.max(100, nextBatchDelay));
        }
    }

    // Play a single note at the specified frequency and duration
    // Used by gmMusic to play instrument notes
    // Uses the first frame's settings for waveform, ADSR, pulse width, etc.
    // frequency: Hz
    // duration: seconds
    // startTime: audioContext time to start (defaults to now)
    // isTied: if true, note sustains; if false, staccato tap
    playNote(audioContext, masterGain, frequency, duration, startTime = null, isTied = true) {
        this.audioContext = audioContext;
        this.masterGain = masterGain || audioContext.destination;

        if (startTime === null) {
            startTime = audioContext.currentTime;
        }

        if (this.frames.length === 0) return;

        const frame = this.frames[0];
        const waveType = gmSound.WAVE_NAMES[frame.wave] || 'square';

        // ADSR from frame settings
        const att = gmSound.ATTACK_TIMES[frame.att] / 1000;
        const dec = gmSound.DECAY_TIMES[frame.dec] / 1000;
        const rel = gmSound.DECAY_TIMES[frame.rel] / 1000;
        const sustainLevel = frame.sus / 15;

        // Create sound source at the specified frequency
        let source;
        if (waveType === "triangle") {
            source = this._createTriangle(frequency);
        } else if (waveType === "sawtooth") {
            source = this._createSawtooth(frequency);
        } else if (waveType === "square") {
            const pulseWidth = (frame.pulseHi << 8) | frame.pulseLo;
            source = this._createSquare(frequency, pulseWidth);
        } else if (waveType === "noise") {
            source = this._createNoise(duration, Math.floor(frequency / 256), Math.floor(frequency) % 256);
        } else {
            source = this._createTriangle(frequency);
        }

        // Create gain node for envelope
        const gainNode = audioContext.createGain();
        gainNode.gain.value = 0;

        // Connect source -> gain -> master
        source.connect(gainNode);
        gainNode.connect(this.masterGain);

        if (isTied) {
            // Tied/legato: full ADSR, sustain fills nearly all of note duration
            // Release starts at 99% of duration for nearly seamless transitions
            const gateTime = duration * 0.99;
            const sustainDuration = Math.max(0, gateTime - att - dec);

            const attackEnd = startTime + att;
            const decayEnd = attackEnd + dec;
            const sustainEnd = decayEnd + sustainDuration;
            const releaseEnd = sustainEnd + rel;

            gainNode.gain.setValueAtTime(0, startTime);
            gainNode.gain.linearRampToValueAtTime(1.0, attackEnd);
            gainNode.gain.linearRampToValueAtTime(sustainLevel, decayEnd);
            gainNode.gain.setValueAtTime(sustainLevel, sustainEnd);
            gainNode.gain.linearRampToValueAtTime(0, releaseEnd);

            source.start(startTime);
            source.stop(releaseEnd + 0.01);
        } else {
            // Staccato: note plays for ~75% of duration, then releases
            // This creates separation between notes without being too choppy
            const gateTime = duration * 0.75;
            const sustainDuration = Math.max(0, gateTime - att - dec);

            const attackEnd = startTime + att;
            const decayEnd = attackEnd + dec;
            const sustainEnd = decayEnd + sustainDuration;
            const releaseEnd = sustainEnd + rel;

            gainNode.gain.setValueAtTime(0, startTime);
            gainNode.gain.linearRampToValueAtTime(1.0, attackEnd);
            gainNode.gain.linearRampToValueAtTime(sustainLevel, decayEnd);
            gainNode.gain.setValueAtTime(sustainLevel, sustainEnd);
            gainNode.gain.linearRampToValueAtTime(0, releaseEnd);

            source.start(startTime);
            source.stop(releaseEnd + 0.01);
        }

        this.activeSources.push(source);

        // Auto-cleanup when source finishes to prevent memory buildup
        source.onended = () => {
            const idx = this.activeSources.indexOf(source);
            if (idx !== -1) {
                this.activeSources.splice(idx, 1);
            }
            // Disconnect nodes to free audio resources
            try {
                source.disconnect();
                gainNode.disconnect();
            } catch (e) {
                // Already disconnected
            }
        };

        return source;
    }

    // Create SID-like triangle wave using band-limited PeriodicWave
    _createTriangle(frequency) {
        const oscillator = this.audioContext.createOscillator();
        const harmonics = 8;
        const real = new Float32Array(harmonics + 1);
        const imag = new Float32Array(harmonics + 1);

        for (let n = 1; n <= harmonics; n++) {
            if (n % 2 === 1) {
                const amp = 8 / (Math.PI ** 2 * n ** 2) * (n % 4 === 1 ? 1 : -1);
                imag[n] = amp;
            }
        }

        const wave = this.audioContext.createPeriodicWave(real, imag, { disableNormalization: true });
        oscillator.setPeriodicWave(wave);
        oscillator.frequency.setValueAtTime(frequency, this.audioContext.currentTime);
        return oscillator;
    }

    // Create SID-like sawtooth wave using band-limited PeriodicWave
    // Real sawtooth uses ALL harmonics with amplitude 2/n (alternating sign)
    // More harmonics = buzzier sound (SID has effectively infinite harmonics due to digital synthesis)
    _createSawtooth(frequency) {
        const oscillator = this.audioContext.createOscillator();
        const harmonics = 32;  // More harmonics for buzzier SID-like sound
        const real = new Float32Array(harmonics + 1);
        const imag = new Float32Array(harmonics + 1);

        // Sawtooth Fourier series: sum of (2/n) * sin(n*x) for n = 1, 2, 3...
        // Using negative values gives a falling sawtooth like the SID
        for (let n = 1; n <= harmonics; n++) {
            imag[n] = -2.0 / (n * Math.PI);
        }

        const wave = this.audioContext.createPeriodicWave(real, imag, { disableNormalization: true });
        oscillator.setPeriodicWave(wave);
        oscillator.frequency.setValueAtTime(frequency, this.audioContext.currentTime);
        return oscillator;
    }

    // Create SID-like square/pulse wave with variable pulse width using band-limited PeriodicWave
    // SID pulse width is 12-bit (0-4095):
    //   0 = 0% duty (silent), 2048 = 50% duty (classic square), 4095 = ~100% duty (silent)
    // Fourier series for pulse wave: sum of (2/(n*π)) * sin(n*π*d) * cos(n*x) for ALL n
    _createSquare(frequency, pulseWidth12bit = 2048) {
        // Convert to duty cycle (0.0 to 1.0)
        pulseWidth12bit = Math.max(1, Math.min(pulseWidth12bit, 4094));
        const dutyCycle = pulseWidth12bit / 4095;

        const oscillator = this.audioContext.createOscillator();

        const harmonics = 32;
        const real = new Float32Array(harmonics + 1);
        const imag = new Float32Array(harmonics + 1);

        // DC offset for pulse wave
        real[0] = 2 * dutyCycle - 1;

        // Pulse wave Fourier series uses ALL harmonics (not just odd)
        // Only at exactly 50% duty cycle do the even harmonics cancel out
        for (let n = 1; n <= harmonics; n++) {
            const amp = (2 / (n * Math.PI)) * Math.sin(n * Math.PI * dutyCycle);
            imag[n] = isNaN(amp) ? 0 : amp;
        }

        const wave = this.audioContext.createPeriodicWave(real, imag, { disableNormalization: true });
        oscillator.setPeriodicWave(wave);
        oscillator.frequency.setValueAtTime(frequency, this.audioContext.currentTime);
        return oscillator;
    }

    // Create SID-like filter chain
    // The SID has lowpass, bandpass, and highpass filters that can be combined
    // lowPass: 0-7 controls lowpass cutoff (0=off, 7=most filtering)
    // bandPass: 0-15 controls bandpass (0=off, 15=strongest)
    // highPass: 0-15 controls highpass (0=off, 15=most filtering)
    _createFilterChain(lowPass, bandPass, highPass) {
        // GameMaker EQ interpretation:
        // The three controls (lo 0-7, mid 0-15, hi 0-15) likely control a single
        // SID-style state-variable filter where:
        // - lo controls how much low frequencies pass (0=cut, 7=pass)
        // - mid controls mid-frequency resonance/presence (0=cut, 15=pass)
        // - hi controls how much high frequencies pass (0=cut, 15=pass)
        //
        // At 0/0/0: heavy filtering on all bands (but not silence)
        // At 7/15/15: neutral/bypass
        //
        // Implementation: Use shelving filters which cut/boost without going silent

        // Input gain node - SID filter has inherent volume drop when engaged
        const inputGain = this.audioContext.createGain();
        inputGain.gain.value = 0.63; // ~-4dB drop when EQ is on

        // Low shelf: controls bass frequencies
        // 0 = -6dB cut, 7 = 0dB (neutral) - lighter touch on bass
        const loShelf = this.audioContext.createBiquadFilter();
        loShelf.type = 'lowshelf';
        loShelf.frequency.value = 300; // Shelf frequency
        loShelf.gain.value = (lowPass / 7) * 6 - 6; // 0->-6dB, 7->0dB

        // Mid peaking: controls mid frequencies
        // 0 = -18dB cut at 1kHz, 15 = 0dB (neutral)
        const midPeak = this.audioContext.createBiquadFilter();
        midPeak.type = 'peaking';
        midPeak.frequency.value = 1000;
        midPeak.Q.value = 1.0;
        midPeak.gain.value = (bandPass / 15) * 18 - 18; // 0->-18dB, 15->0dB

        // High shelf: controls treble frequencies
        // 0 = -12dB cut, 15 = 0dB (neutral)
        const hiShelf = this.audioContext.createBiquadFilter();
        hiShelf.type = 'highshelf';
        hiShelf.frequency.value = 3000; // Shelf frequency
        hiShelf.gain.value = (highPass / 15) * 12 - 12; // 0->-12dB, 15->0dB

        // Chain them together
        inputGain.connect(loShelf);
        loShelf.connect(midPeak);
        midPeak.connect(hiShelf);

        return {
            input: inputGain,
            output: hiShelf
        };
    }

    // Create SID-like noise using LFSR
    // The SID noise is band-limited because the LFSR only shifts at the rate
    // set by the frequency register, and the output holds between shifts.
    // Lower frequency = fewer shifts = more "chunky" sound
    // Higher frequency = more shifts = smoother/brighter noise
    // sweep: optional { steps, direction, active } from _decodeSpeed
    _createNoise(durationSeconds, freqHi, freqLo, sweep = null) {
        const sampleRate = this.audioContext.sampleRate;
        const bufferSize = Math.floor(sampleRate * durationSeconds);
        const buffer = this.audioContext.createBuffer(1, bufferSize, sampleRate);
        const output = buffer.getChannelData(0);

        // Sweep setup (if active)
        // Sweep speed is constant regardless of sound duration
        let segmentSamples = bufferSize; // No sweep = one segment
        if (sweep && sweep.active) {
            const totalDuration = 255 * 0.01666667;
            segmentSamples = Math.floor((totalDuration * sampleRate) / sweep.steps);
        }

        // Use persistent LFSR state (SID's LFSR runs continuously, never resets)
        let lfsr = gmSound.noiseLfsr;
        let currentValue = 0;
        let samplesSinceShift = 0;

        for (let i = 0; i < bufferSize; i++) {
            // Calculate current frequency (with sweep if active)
            let hi = freqHi;
            if (sweep && sweep.active) {
                const segmentIndex = Math.floor(i / segmentSamples);
                hi = (freqHi + sweep.direction * segmentIndex + 256) % 256;
            }
            const frequency = (hi << 8) | freqLo;

            // SID runs at ~1MHz, frequency register controls LFSR shift rate
            // Scale factor to approximate SID timing feel
            const shiftInterval = Math.max(1, Math.floor(sampleRate / (Math.max(1, frequency) * 1)));

            // Track samples since last shift
            samplesSinceShift++;
            if (samplesSinceShift >= shiftInterval) {
                samplesSinceShift = 0;
                const bit = ((lfsr >> 22) ^ (lfsr >> 17)) & 1;
                lfsr = ((lfsr << 1) | bit) & 0x7FFFFF;

                // Extract 8 bits from specific LFSR positions (SID behavior)
                const sidNoiseByte =
                    ((lfsr >> 22) & 1) << 7 |
                    ((lfsr >> 20) & 1) << 6 |
                    ((lfsr >> 16) & 1) << 5 |
                    ((lfsr >> 13) & 1) << 4 |
                    ((lfsr >> 11) & 1) << 3 |
                    ((lfsr >> 7) & 1) << 2 |
                    ((lfsr >> 4) & 1) << 1 |
                    ((lfsr >> 2) & 1);

                currentValue = (sidNoiseByte / 127.5) - 1;
            }

            output[i] = currentValue;
        }

        // Save LFSR state for next noise sound
        gmSound.noiseLfsr = lfsr;

        const noiseSource = this.audioContext.createBufferSource();
        noiseSource.buffer = buffer;
        return noiseSource;
    }

    // Create ADSR envelope
    // soundDuration = how long the sound plays (dur - gap + release)
    // release = release time (0 for hard cut, >0 for fade out on last frame)
    _createEnvelope(attack, decay, sustain, release, soundDuration, peak = 1.0) {
        const gainNode = this.audioContext.createGain();

        const schedule = (startTime) => {
            // Gate time is soundDuration minus release
            const gateTime = soundDuration - release;
            const gateEnd = startTime + gateTime;

            gainNode.gain.setValueAtTime(0, startTime);

            if (gateTime >= attack + decay) {
                // Normal case: full attack, full decay, sustain until gate end
                const tAttackEnd = startTime + attack;
                const tDecayEnd = tAttackEnd + decay;

                gainNode.gain.linearRampToValueAtTime(peak, tAttackEnd);
                gainNode.gain.linearRampToValueAtTime(sustain, tDecayEnd);
                gainNode.gain.setValueAtTime(sustain, gateEnd);
                if (release > 0) {
                    gainNode.gain.linearRampToValueAtTime(0, gateEnd + release);
                } else {
                    // Hard cut
                    gainNode.gain.setValueAtTime(0, gateEnd);
                }
            } else if (gateTime >= attack) {
                // Gate ends during decay phase
                const tAttackEnd = startTime + attack;
                const decayProgress = (gateTime - attack) / decay;
                const levelAtGateEnd = peak - (peak - sustain) * decayProgress;

                gainNode.gain.linearRampToValueAtTime(peak, tAttackEnd);
                gainNode.gain.linearRampToValueAtTime(levelAtGateEnd, gateEnd);
                if (release > 0) {
                    gainNode.gain.linearRampToValueAtTime(0, gateEnd + release);
                } else {
                    gainNode.gain.setValueAtTime(0, gateEnd);
                }
            } else {
                // Gate ends during attack phase
                const attackProgress = gateTime / attack;
                const levelAtGateEnd = peak * attackProgress;

                gainNode.gain.linearRampToValueAtTime(levelAtGateEnd, gateEnd);
                if (release > 0) {
                    gainNode.gain.linearRampToValueAtTime(0, gateEnd + release);
                } else {
                    gainNode.gain.setValueAtTime(0, gateEnd);
                }
            }
        };

        return { gainNode, schedule };
    }

    // Get human-readable description
    getDescription() {
        let desc = `Sound: ${this.name}\n`;
        desc += `Repeats: ${this.repeatCount}, Delay: ${this.repeatDelay}\n`;
        desc += `Volume: ${this.volume}, EQ: ${this.eqOn ? 'on' : 'off'}\n`;
        desc += `Frames: ${this.frames.length}\n\n`;

        this.frames.forEach((frame, i) => {
            desc += `Frame ${i + 1}:\n`;
            desc += `  Wave: ${gmSound.WAVE_NAMES[frame.wave] || 'unknown'}\n`;
            desc += `  ADSR: ${frame.att}/${frame.dec}/${frame.sus}/${frame.rel}\n`;
            desc += `  Freq: ${frame.freqHi}/${frame.freqLo} (${this._freqToHz(frame.freqHi, frame.freqLo).toFixed(1)} Hz)\n`;
            desc += `  Duration: ${frame.dur} frames\n`;
            const sweep = this._decodeSpeed(frame.spd);
            desc += `  Sweep: ${frame.spd} (${sweep.active ? sweep.direction > 0 ? 'UP' : 'DOWN' : 'off'}, ${sweep.steps} steps)\n`;
            if (frame.wave === gmSound.WAVE_SQUARE) {
                desc += `  Pulse: ${(frame.pulseHi << 8) | frame.pulseLo}\n`;
            }
            desc += '\n';
        });

        return desc;
    }

    globalThis.gmSound = gmSound;
}

<script>// gmMusic.js - GameMaker Music (.SNG file) handler
//
// === ARCHITECTURE ===
// gmMusic parses GameMaker music files and provides playback via Web Audio API.
// Each music instance is independent, matching how gmSprite/gmScene/gmSound work.
// Songs have 3 channels, each with its own instrument and note sequence.
//
// === PERFORMANCE-OPTIMIZED PLAYBACK ===
// Uses 3 persistent oscillators (one per channel) matching SID hardware:
//   - Oscillators run continuously during playback
//   - Frequency changes scheduled via AudioParam automation
//   - ADSR envelopes scheduled on persistent gain nodes
//   - No per-note object creation = no GC pressure
//
// === MUSIC FILE FORMAT (.SNG) ===
// Reverse-engineered through testing with known note patterns.
//
// Header (bytes 0-33):
//   [0-1]   Load address: E0 0B
//   [2-4]   Magic: "GEK" (47 45 4B)
//   [5-10]  Song name (6 PETSCII characters)
//   [11-19] Unknown/unused
//   [20]    Tempo (80 ≈ 140 BPM, scales linearly)
//   [21]    Channel 1 instrument index (0-13)
//   [22]    Channel 2 instrument index (0-13)
//   [23]    Channel 3 instrument index (0-13)
//   [24-26] Header delimiter: FF FF FF
//   [27-33] Preamble (7 bytes, unknown purpose, varies per song)
//
// Note data (bytes 34+):
//   Notes are grouped BY CHANNEL, not by beat.
//   Each channel's notes are sequential <duration> <pitch> pairs.
//   FF FF marks the end of each channel, the last included (so a file ends FF FF).
//   (Songs saved by gmc64 before 2026-10 end in a single FF; parse() accepts either.)
//   Channel order: Ch1 (highest voice), Ch2 (mid), Ch3 (lowest/bass)
//
// === DURATION ENCODING ===
// Duration byte = base value + optional flags
//
// Base values (bits 0-4):
//   0x00 = 32nd note (1/8 beat)
//   0x01 = 16th note (1/4 beat)
//   0x03 = 8th note (1/2 beat)
//   0x05 = dotted 8th (3/4 beat)
//   0x07 = quarter note (1 beat)
//   0x0B = dotted quarter (1.5 beats)
//   0x0F = half note (2 beats)
//   0x17 = dotted half (3 beats)
//   0x1F = whole note (4 beats)
//
// Flags (bits 5-6):
//   +0x20 = tied (legato) - note sustains for 90% of duration
//   +0x40 = rest - pitch byte is ignored
//
// === PITCH ENCODING ===
// Pitch is a semitone value where 0x26 (38 decimal) = A440.
// Each +1 = one semitone up, each -1 = one semitone down.
// 12 semitones per octave.
//
// === INSTRUMENTS ===
// 14 instrument types (0-13):
//   0  = off (default triangle)
//   1  = bass (filtered triangle)
//   2  = cow bell (filtered square)
//   3  = cymbal (low-pass filtered noise)
//   4  = flute (triangle, soft attack)
//   5  = guitar (medium-filtered sawtooth)
//   6  = harpsichord (lightly-filtered sawtooth)
//   7  = piano (heavily-filtered sawtooth)
//   8  = saxophone (filtered sawtooth, soft attack)
//   9  = snare (high-pass filtered noise)
//   10 = synthesizer (unfiltered sawtooth)
//   11 = trumpet (filtered sawtooth, soft attack, short release)
//   12 = violin (filtered sawtooth, soft attack, long release)
//   13 = xylophone (triangle, percussive)

class gmMusic {
    // Base BPM at tempo 80 (measured against VICE emulator)
    static BASE_BPM = 140;

    // Instrument definitions - waveform, ADSR, and transpose settings
    // wave: 'triangle', 'sawtooth', 'square', 'noise'
    // att/dec/rel: indices into SID timing tables

    // pulseWidth: 0-4095 for square wave duty cycle
    // transpose: semitones to shift pitch
    static INSTRUMENTS = {
        0:  { name: 'off',         wave: 'triangle', att: 0,  dec: 4,  sus: 12, rel: 4,  pulseWidth: 2048, transpose: 0  },
        1:  { name: 'bass',        wave: 'triangle', att: 0,  dec: 5,  sus: 10, rel: 3,  pulseWidth: 2048, transpose: 0  },
        2:  { name: 'cow bell',    wave: 'square',   att: 0,  dec: 6,  sus: 0,  rel: 5,  pulseWidth: 1024, transpose: 24 },
        3:  { name: 'cymbal',      wave: 'noise',    att: 0,  dec: 9,  sus: 3,  rel: 8,  pulseWidth: 2048, transpose: 24 },
        4:  { name: 'flute',       wave: 'triangle', att: 4,  dec: 3,  sus: 13, rel: 5,  pulseWidth: 2048, transpose: 0  },
        5:  { name: 'guitar',      wave: 'square',   att: 0,  dec: 7,  sus: 4,  rel: 5,  pulseWidth: 1536, transpose: 0  },
        6:  { name: 'harpsichord', wave: 'square',   att: 0,  dec: 5,  sus: 2,  rel: 3,  pulseWidth: 2048, transpose: 0  },
        7:  { name: 'piano',       wave: 'square',   att: 0,  dec: 8,  sus: 5,  rel: 6,  pulseWidth: 1536, transpose: 0  },
        8:  { name: 'saxophone',   wave: 'sawtooth', att: 3,  dec: 4,  sus: 11, rel: 5,  pulseWidth: 2048, transpose: 0  },
        9:  { name: 'snare',       wave: 'noise',    att: 0,  dec: 4,  sus: 0,  rel: 2,  pulseWidth: 2048, transpose: 24 },
        10: { name: 'synthesizer', wave: 'sawtooth', att: 0,  dec: 4,  sus: 12, rel: 4,  pulseWidth: 2048, transpose: 0  },
        11: { name: 'trumpet',     wave: 'sawtooth', att: 3,  dec: 4,  sus: 10, rel: 3,  pulseWidth: 2048, transpose: 0  },
        12: { name: 'violin',      wave: 'sawtooth', att: 5,  dec: 4,  sus: 11, rel: 7,  pulseWidth: 2048, transpose: 0  },
        13: { name: 'xylophone',   wave: 'triangle', att: 0,  dec: 6,  sus: 0,  rel: 5,  pulseWidth: 2048, transpose: 0  }

    // SID ADSR timing tables (milliseconds)
    static ATTACK_MS = [2, 8, 16, 24, 38, 56, 68, 80, 100, 250, 500, 800, 1000, 3000, 5000, 8000];
    static DECAY_MS = [6, 24, 48, 72, 114, 168, 204, 240, 300, 700, 1500, 2400, 3000, 9000, 15000, 24000];

    constructor(fileData) {

        this.name = '';
        this.tempo = 80;
        this.bpm = gmMusic.BASE_BPM;
        this.quarterNoteDuration = 60 / gmMusic.BASE_BPM;
        this.instruments = [0, 0, 0];
        this.channels = [[], [], []];

        // Audio state
        this.audioCtx = null;
        this.isPlaying = false;
        this.stopTime = 0;

        // Persistent audio nodes (created on play, destroyed on stop)
        this.channelOscillators = [null, null, null];
        this.channelGains = [null, null, null];
        this.channelNoiseBuffers = [null, null, null];

    // Creates a new blank song for the editor
    static createBlank(options = {}) {

        song.name = (options.name || 'NEW').padEnd(6, ' ').substring(0, 6);
        song.tempo = options.tempo !== undefined ? options.tempo : 80;
        song.instruments = options.instruments || [7, 12, 1]; // piano, violin, bass

    parse() {
        this.name = this._decodeName(this.fileData.slice(5, 11));
        this.tempo = this.fileData[20];
        this.instruments = [
            this.fileData[21],
            this.fileData[22],

                isNullSlot: isNullSlot,

    _getDurationMultiplier(durationByte) {

            0x00: 0.125, 0x01: 0.25, 0x03: 0.5, 0x05: 0.75,
            0x07: 1.0, 0x0B: 1.5, 0x0F: 2.0, 0x17: 3.0, 0x1F: 4.0

    // Serialize song to .SNG format

        const ch2Size = this.channels[1].length * 2;

    _scheduleChannel(channel, audioStartTime, startBeat) {
