<style>
:root {
    --c64-black: #000;
    /* The bottom bar doubles as the C64-style bottom border, so the canvas
       has no padded frame of its own. Bar heights feed the canvas sizing
       math below — keep them here so the two stay in sync. The top bar
       is a thinner cosmetic strip (half the bottom) that frames the
       playfield symmetrically without stealing room for controls. */
    --bar-height: 44px;
    --top-height: 22px;

    /* #gameBorder's actual height — mirrors the canvas sizing formula so
       gmDiskPicker's responsive padding keys off the real available
       space rather than raw viewport height. The picker's CSS falls
       back to 100vh when this var isn't defined (editor pages don't). */
    --gameborder-h: min(75vw, calc(100vh - var(--bar-height) - var(--top-height)));
}
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--c64-black);
    color: #eee;
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden;
    /* Stop iOS from rubber-banding when a finger drags the joystick past
       the visible edge. touch-action: none on body prevents the browser
       from claiming any gesture; game controls fully own touch input. */
    overscroll-behavior: contain;
    touch-action: none;
    /* Respect notches/home indicators in landscape when fullscreen. */
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
}

body {
    display: flex;
    flex-direction: column;
}

/* Play area fills all vertical space above the bottom bar. min-height:0
   lets flex shrink it under content when the viewport is short (otherwise
   the canvas's intrinsic aspect-driven height would push the bar off-screen). */
#playArea {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

/* Thin top border strip — cosmetic only. Frames the playfield above so
   the canvas isn't flush with the browser chrome. Half the bottom bar's
   height because it doesn't hold any controls. */
#topBar {
    height: var(--top-height);
    flex-shrink: 0;
    background: var(--c64-black);
}

/* Dedicated bottom border strip — the credit link, pause toggle, and
   audio indicator live here rather than overlaying the play field. */
#bottomBar {
    height: var(--bar-height);
    flex-shrink: 0;
    position: relative;
    background: var(--c64-black);
}

/* Canvas wrapper — no padding: the bottom bar acts as the bottom border,
   and the black body background surrounds the canvas on the other sides.
   Kept as an element mostly for structural symmetry with program-editor.html and
   in case we want to reintroduce a runtime-tinted border later.
   overflow: hidden clips the picker-overlay if the viewport is too small
   to fit the mini-screen at its minimum size — better than letting it
   spill outside the play area. */
#gameBorder {
    display: inline-block;
    position: relative;
    overflow: hidden;
}

/* Canvas scales to fit viewport while preserving the CRT-authentic 6:5
   display aspect. image-rendering keeps pixels crisp at any scale. */
#gameCanvas {
    display: block;
    /* C64 pixels aren't square — the CRT-authentic display aspect is 6:5
       (matches program-editor.html's 480×400 canvas over 320×200 native data),
       NOT the raw 8:5 of the pixel resolution. Using native pixel aspect
       here makes everything look horizontally stretched.

       Width is the min of (a) 90% of viewport width and (b) the width that
       fits vertically: (viewport height − top border − bottom bar) × 6/5.
       Without the vertical clamp, aspect-ratio would derive a height that
       overflows #playArea and the canvas would clip instead of scaling
       down on short viewports. */
    width: min(90vw, calc((100vh - var(--bar-height) - var(--top-height)) * 6 / 5));
    aspect-ratio: 6 / 5;
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    max-width: 960px;
    /* Never render smaller than the editor's canonical 480×400 canvas.
       Below this viewport size the canvas would otherwise scale further
       down; on desktop that turns into a tiny thumbnail nobody wants.
       On mobile we drop the min in the media query below so the game
       fits the screen (see program-editor.html for the same reasoning). */
    min-width: 480px;
}
/* Mobile: let the canvas shrink to fit. On a 375×812 landscape phone
   the 480 minimum forces overflow past the bottom of the viewport,
   hiding the game bar and touch controls. C64 native is 320×200 so
   anything ≥ that is still playable. */
@media (max-width: 900px), (max-height: 500px) {
    #gameCanvas {
        min-width: 0;
    }
}

/* Full-canvas overlay with the play button. Sits above the game until the
   user clicks — at which point the click both starts the VM and unlocks
   the AudioContext in the same gesture (browser autoplay policy). Hidden
   by default so it doesn't cover the drop-zone; add `.active` once a
   program is loaded and ready to play, or on an error we want to surface. */
#playOverlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    align-items: center;
    justify-content: center;
    z-index: 100;
    cursor: pointer;
}
#playOverlay.active { display: flex; }

#playButton {
    width: 96px;
    height: 96px;
    padding: 0;
    background: rgba(255, 255, 255, 0.12);
    border: 2px solid rgba(255, 255, 255, 0.8);
    border-radius: 50%;
    color: white;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
}
#playButton:hover:not(:disabled) { background: rgba(255, 255, 255, 0.22); }
#playButton:disabled {
    cursor: default;
    width: auto;
    height: auto;
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 14px;
    opacity: 0.85;
}
#playButton svg { width: 44px; height: 44px; display: block; }

/* Right-side control cluster in the bottom bar. Visual order DOM=left→right:
   hamburger, pause, mute (audio indicator mounts last). */
#gameControls {
    position: absolute;
    right: 20px;
    bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
}

#gameControls button {
    width: 28px;
    height: 28px;
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 4px;
    cursor: pointer;
    color: rgba(255, 255, 255, 0.9);
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    transition: background 0.1s;
}
#gameControls button:hover { background: rgba(0, 0, 0, 0.75); }
#gameControls button svg { width: 100%; height: 100%; display: block; }

/* Audio indicator flexes with the other icons — override the shared
   CSS's default absolute positioning. */
#gameControls .gm-audio-indicator {
    position: static;
    bottom: auto;
    right: auto;
    width: 28px;
    height: 28px;
    padding: 4px;
}

/* Hamburger popup — opens above the bar, right-aligned. Houses the
   joystick preset selectors. */
#settingsPopup {
    display: none;
    position: absolute;
    bottom: calc(var(--bar-height) + 4px);
    right: 20px;
    background: rgba(0, 0, 0, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 4px;
    padding: 12px;
    z-index: 10;
    min-width: 220px;
    color: rgba(255, 255, 255, 0.9);
    font-size: 12px;
}
#settingsPopup.active { display: block; }

#settingsPopup .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
}
#settingsPopup .row:last-child { margin-bottom: 0; }

#settingsPopup .settings-section-label {
    color: rgba(255, 255, 255, 0.55);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 0 0 4px 0;
}

#settingsPopup select {
    font-family: inherit;
    font-size: 12px;
    padding: 2px 4px;
    background: rgba(255, 255, 255, 0.1);
    color: rgba(255, 255, 255, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.3);
}

/* Volume control — video-player style. The mute button (audio indicator)
   sits in the bar; a vertical slider floats directly above it so the user
   can drag straight up. Panel hidden until hover/focus. */
#volumeControl {
    position: relative;
    display: flex;
    align-items: center;
}
#volumePanel {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 4px;
    padding: 10px 4px;
    display: flex;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.12s ease;
    z-index: 10;
}
/* Invisible bridge over the gap between panel and button so the pointer
   can travel up without dropping :hover and collapsing the panel. */
#volumePanel::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    height: 8px;
}
/* Reveal: hover only where hover exists (touch browsers fake a sticky :hover
   on tap, which would open the panel and never let it close); keyboard focus
   via :focus-visible (a tap doesn't match it); and .gm-volume-open, which
   GMAudioIndicator.enableTouchPanel toggles on tap for touch devices. */
@media (hover: hover) {
    #volumeControl:hover #volumePanel {
        opacity: 1;
        visibility: visible;
    }
}
#volumeControl:has(:focus-visible) #volumePanel,
#volumeControl.gm-volume-open #volumePanel {
    opacity: 1;
    visibility: visible;
}
/* Opened by tap with too little room above (GMAudioIndicator picks this at
   open time), the panel drops below the button instead, bridge above it. */
#volumeControl.gm-volume-below #volumePanel {
    bottom: auto;
    top: calc(100% + 6px);
}
#volumeControl.gm-volume-below #volumePanel::after {
    top: auto;
    bottom: 100%;
}
/* Vertical range. writing-mode + direction:rtl gives min-at-bottom,
   max-at-top on modern browsers; accent-color restyles track/thumb. */
#volumeSlider {
    writing-mode: vertical-lr;
    direction: rtl;
    width: 18px;
    height: 90px;
    margin: 0;
    accent-color: rgba(255, 255, 255, 0.85);
    cursor: pointer;
    /* A vertical drag on the slider must move the thumb, not scroll the page. */
    touch-action: none;
}

/* Subtle attribution corner. Suppressed when ?nocredit is in the URL. */
/* Credit link — anchored to the left of #bottomBar, vertically centred.
   No z-index needed: the bar sits below playArea entirely, so the play
   overlay (which lives inside playArea) never covers it. */
.credit {
    position: absolute;
    top: 50%;
    left: 20px;
    transform: translateY(-50%);
    color: rgba(255, 255, 255, 0.5);
    font-size: 12px;
    text-decoration: none;
    font-family: monospace;
}
.credit:hover { color: rgba(255, 255, 255, 0.9); }

/* === TOUCH CONTROLS OVERLAY ===
   Rendered by js/gmTouchControls.js. Positioned absolutely over
   #playArea so it floats atop the canvas. pointer-events on children
   only — a passthrough parent lets tap-anywhere-else behaviour still
   reach the underlying canvas (e.g. the play overlay). */
.gm-touch-overlay {
    position: absolute;
    inset: 0;
    z-index: 50;      /* under playOverlay(100), above canvas */
    pointer-events: none;
    touch-action: none;
}
.gm-touch-joystick,
.gm-touch-fire {
    position: absolute;
    pointer-events: auto;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}
/* Left-anchored joystick base. Semi-translucent ring with a puck in the
   middle. Sized generously so it's usable with a thumb — thumb-friendly
   touch targets need ≥ 48pt/64px minimum, this is ~140. */
.gm-touch-joystick {
    left: 24px;
    bottom: 24px;
    width: 140px;
    height: 140px;
    border: 2px solid rgba(255, 255, 255, 0.25);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s;
}
.gm-touch-joystick.gm-touch-active { background: rgba(255, 255, 255, 0.12); }
.gm-touch-joystick-puck {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.35);
    border: 2px solid rgba(255, 255, 255, 0.55);
    pointer-events: none;    /* parent handles the touches */
    transition: transform 0.05s linear;
}
/* Right-anchored fire button. Round, large, tinted red for at-a-glance
   recognition. Pressed state darkens without shifting position. */
.gm-touch-fire {
    right: 24px;
    bottom: 40px;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: rgba(200, 40, 40, 0.35);
    border: 2px solid rgba(255, 255, 255, 0.55);
    color: rgba(255, 255, 255, 0.85);
    font-size: 42px;
    line-height: 92px;
    text-align: center;
    transition: background 0.05s;
}
.gm-touch-fire.gm-touch-active { background: rgba(200, 40, 40, 0.65); }

/* === PHONE LAYOUT MODE ===
   When body.mobile-phone is set (by JS at init after device detection):
     - top + bottom bars collapse to zero so the canvas fills the viewport
     - credit link + hamburger + volume popup are hidden (real estate)
     - canvas grows past its normal min-width limit and drops the 6:5
       aspect ratio in favour of contain-fit on the phone screen. */
body.mobile-phone #topBar { display: none; }
body.mobile-phone #bottomBar {
    height: 0;
    /* Keep positioned children (settings popup) but hide the bar itself. */
    background: transparent;
}
body.mobile-phone .credit,
body.mobile-phone #hamburgerBtn,
body.mobile-phone #settingsPopup { display: none !important; }
/* Canvas fills phone viewport, preserving 6:5 aspect but no min-width. */
body.mobile-phone #gameCanvas {
    width: min(100vw, calc(100vh * 6 / 5));
    height: min(100vh, calc(100vw * 5 / 6));
    max-width: none;
    min-width: 0;
}
/* On a phone we want the game controls (pause, fullscreen, mute)
   floating in the top-right rather than fighting for the bottom bar. */
body.mobile-phone #gameControls {
    top: 8px;
    right: 8px;
    bottom: auto;
    z-index: 60;
    opacity: 0.55;
}
body.mobile-phone #gameControls:hover { opacity: 1; }
</style>
</head>
<body>
<!-- Thin cosmetic top border strip; no interactive content. -->
<div id="topBar"></div>
<div id="playArea">
    <div id="gameBorder">
        <canvas id="gameCanvas" width="320" height="200"></canvas>
        <!-- audio indicator mounts here on first play -->
    </div>
    <div id="playOverlay">
        <button id="playButton" type="button" aria-label="Play">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M7 5 L19 12 L7 19 Z"
                      fill="currentColor"
                      stroke="currentColor"
                      stroke-width="3"
                      stroke-linejoin="round"
                      stroke-linecap="round"/>
            </svg>
        </button>
    </div>
    <!-- GMDiskPicker mounts its overlay here at init time (state managed
         from JS: drop-zone → program-picker → error). -->
</div>
<!-- Bottom border strip. Holds the credit link, control cluster (hamburger,
     pause, audio indicator), and the settings popup (opens above the bar).
     Sits below #playArea in the flex column, so the play overlay never
     covers these controls. -->
<div id="bottomBar">
    <a class="credit" href="https://gmc64.com" target="_blank" rel="noopener">gmc64.com</a>
    <!-- Hamburger, pause, fullscreen, audio-indicator (mounted). Hidden
         until first play. On phone layout mode the hamburger is hidden. -->
    <div id="gameControls" style="display: none;">
        <button id="hamburgerBtn" type="button" aria-label="Settings">
            <!-- icon injected in init() -->
        </button>
        <button id="pauseToggle" type="button" aria-label="Pause">
            <!-- icon injected on first pause state change -->
        </button>
        <button id="fullscreenToggle" type="button" aria-label="Fullscreen">
            <!-- fullscreen icon; toggles between "enter" and "exit" glyph
                 based on document.fullscreenElement -->
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M4 9 L4 4 L9 4 M15 4 L20 4 L20 9 M20 15 L20 20 L15 20 M9 20 L4 20 L4 15"
                      fill="none" stroke="currentColor" stroke-width="2"
                      stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <!-- Volume: mute button (GMAudioIndicator) mounts here; the vertical
             slider floats directly above it, revealed on hover. -->
        <div id="volumeControl">
            <div id="volumePanel">
                <input type="range" id="volumeSlider" min="0" max="100" step="1"
                       value="75" orient="vertical" aria-label="Volume">
            </div>
            <!-- audio indicator (mute button) mounts here at first play -->
        </div>
    </div>
    <div id="settingsPopup">
        <div class="settings-section-label">Controls</div>
        <div class="row">
            <label>Joystick 1</label>
            <select id="joy1Sel"></select>
        </div>
        <div class="row">
            <label>Joystick 2</label>
            <select id="joy2Sel"></select>
        </div>
    </div>
</div>

<!-- Runtime files. play.html deliberately does NOT include:
       - editor JS (instruction picker, arg editing, save/load UI, …)
       - standalone-source.js (only needed by editor's Export Game to HTML flow)
       - demo-disk-source.js (only relevant to editor's demo shortcut) -->
<script>/*

General Purpose c64 utilities

*/


// RGB values from VICE, names from GameMaker
// Access by index: c64Palette[0x05] or c64Palette[5]
// Access by name:  c64Palette.green or c64Palette['green']
const c64Palette = {
    // By index
    0x00: [0, 0, 0, 255],        // black
    0x01: [255, 255, 255, 255],  // white
    0x02: [169, 71, 100, 255],   // red
    0x03: [138, 230, 203, 255],  // cyan
    0x04: [154, 88, 185, 255],   // purple
    0x05: [114, 189, 103, 255],  // green
    0x06: [25, 73, 180, 255],    // blue
    0x07: [255, 248, 141, 255],  // yellow
    0x08: [196, 98, 65, 255],    // orange
    0x09: [151, 64, 0, 255],     // brown
    0x0A: [230, 134, 163, 255],  // lt red
    0x0B: [98, 98, 98, 255],     // gray 1
    0x0C: [148, 148, 148, 255],  // gray 2
    0x0D: [198, 255, 186, 255],  // lt green
    0x0E: [98, 145, 251, 255],   // lt blue
    0x0F: [205, 205, 205, 255],  // gray 3
};
// By name (references same arrays)
c64Palette.black   = c64Palette[0x00];
c64Palette.white   = c64Palette[0x01];
c64Palette.red     = c64Palette[0x02];
c64Palette.cyan    = c64Palette[0x03];
c64Palette.purple  = c64Palette[0x04];
c64Palette.green   = c64Palette[0x05];
c64Palette.blue    = c64Palette[0x06];
c64Palette.yellow  = c64Palette[0x07];
c64Palette.orange  = c64Palette[0x08];
c64Palette.brown   = c64Palette[0x09];
c64Palette.ltRed   = c64Palette[0x0A];
c64Palette.gray1   = c64Palette[0x0B];
c64Palette.gray2   = c64Palette[0x0C];
c64Palette.ltGreen = c64Palette[0x0D];
c64Palette.ltBlue  = c64Palette[0x0E];
c64Palette.gray3   = c64Palette[0x0F];

// color names as shown in GameMaker
const c64ColorNames = {
    0x00: "black",
    0x01: "white",
    0x02: "red",
    0x03: "cyan",
    0x04: "purple",
    0x05: "green",
    0x06: "blue",
    0x07: "yellow",
    0x08: "orange",
    0x09: "brown",
    0x0A: "lt red",
    0x0B: "gray 1",
    0x0C: "gray 2",
    0x0D: "lt grn",
    0x0E: "lt blu",
    0x0F: "gray 3",
};

// Convert C64/Gamemaker char to ASCII
const decodeChar = (byte) => {
    if (0x30 <= byte && byte <= 0x39) // digits
        return String.fromCharCode(byte);
    if (0x01 <= byte && byte <= 0x1A) // lowercase letters
        return String.fromCharCode(byte - 1 + 'a'.charCodeAt(0));
    if (byte === 0x2F) return '/';
    if (byte === 0x2D) return '-';
    if (byte === 0x2B) return '+';
    if (byte === 0x1C) return '=';
    if (byte === 0x20) return ' ';
    // PRINT STRING PADDING CHARACTER (0x3B / 59):
    // Print statements are always 20 bytes in the binary format. The actual text
    // content is followed by 0x3B bytes as padding. When displayed in the editor,
    // these decode to underscores '_' so you see "hello_______________". But when
    // the string is printed to a scene at runtime (see gmCharset.drawBytesToScene),
    // 0x3B bytes are skipped entirely - nothing is drawn for those positions.
    // This allows variable-length strings without leaving visible padding on screen.
    if (byte === 0x3B) return '_';
    if (byte === 0x22) return '.';
    if (byte === 0x1E) return '>';
    if (byte === 0x27) return "'";  // apostrophe (GM index 39)
    if (byte === 0x26) return '?';  // question mark (GM index 38)
    if (byte === 0x1B) return '[';
    if (byte === 0x1D) return ']';
    if (byte === 0x1F) return '<';
    return '�'; // Unknown byte
};

function decodeString(bytes) {
    return Array.from( bytes ).map(decodeChar).join('');
}

// Convert ASCII character to C64/GameMaker byte (inverse of decodeChar)
const encodeChar = (char) => {
    const code = char.charCodeAt(0);
    // Lowercase letters a-z → 0x01-0x1A
    if (code >= 0x61 && code <= 0x7A) return code - 0x60;
    // Uppercase letters A-Z → also 0x01-0x1A (treat as lowercase)
    if (code >= 0x41 && code <= 0x5A) return code - 0x40;
    // Digits 0-9 → 0x30-0x39 (same as ASCII)
    if (code >= 0x30 && code <= 0x39) return code;
    // Special characters
    if (char === '/') return 0x2F;
    if (char === '-') return 0x2D;
    if (char === '+') return 0x2B;
    if (char === '=') return 0x1C;
    if (char === ' ') return 0x20;
    if (char === '_') return 0x3B;  // Padding character
    if (char === '.') return 0x22;
    if (char === '>') return 0x1E;
    if (char === "'") return 0x27;
    if (char === '?') return 0x26;
    if (char === '[') return 0x1B;
    if (char === ']') return 0x1D;
    if (char === '<') return 0x1F;
    return 0x20;  // Default to space for unknown chars
};

function encodeString(str, length) {
    const bytes = [];
    for (let i = 0; i < length; i++) {
        if (i < str.length) {
            bytes.push(encodeChar(str[i]));
        } else {
            bytes.push(0x20);  // Pad with spaces
        }
    }
    return bytes;
}

// Make available globally for browser and Node.js testing
if (typeof globalThis !== 'undefined') {
    globalThis.c64Palette = c64Palette;
    globalThis.c64ColorNames = c64ColorNames;
    globalThis.decodeString = decodeString;
    globalThis.encodeString = encodeString;
    globalThis.decodeChar = decodeChar;
    globalThis.encodeChar = encodeChar;
}

<script>// c64Screen.js - Manages a 320×200 pixel buffer for C64 GameMaker display
//
// === ARCHITECTURE ===
// This is a thin layer that provides:
//   1. A pixel buffer (this.pixels) - where gmSprite and gmScene blit their graphics
//   2. A canvas - where the final composited image is displayed
//
// === WHY A PIXEL BUFFER? ===
// Canvas's putImageData() doesn't alpha-composite - it replaces pixels entirely.
// If sprite A draws, then sprite B does putImageData, B's transparent pixels
// would overwrite A's visible pixels with transparency (punching holes).
//
// Solution: All sprites blit to a shared pixel buffer, manually skipping
// transparent pixels. Then one putImageData() call displays the result.
//
// Flow: clear() → blit sprite 1 → blit sprite 2 → ... → present()
//
// === 320×200 NATIVE RESOLUTION ===
// This is the C64's true screen resolution:
//   - Hi-res mode: 320×200, 1 pixel = 1 pixel
//   - Multicolor mode: 160×200, but fat pixels displayed as 2×1 blocks
//
// By working at native resolution internally, all coordinates align.
// CSS handles final scaling to display size (e.g., 480×400 or 960×800).
// The `image-rendering: pixelated` CSS property ensures crisp pixel scaling.
//
// === DISPLAY SCALING ===
// The canvas HTML attribute sets the internal resolution (320×200).
// CSS width/height sets the display size. Common configurations:
//   - 480×400 (1.5×2): Good balance of size and sharpness (current default)
//   - 960×800 (3×4): Pixel-perfect for both multicolor and hi-res
//   - On high-DPI displays, the browser may further scale for crisp rendering

class c64Screen {
    static WIDTH = 320;   // True C64 horizontal resolution
    static HEIGHT = 200;  // True C64 vertical resolution

    constructor(canvasId) {
        // Accept canvas ID string or canvas element directly
        if (typeof canvasId === 'string') {
            this.canvas = document.getElementById(canvasId);
        } else {
            this.canvas = canvasId;
        }

        // Force canvas to native resolution (CSS handles display scaling)
        this.canvas.width = c64Screen.WIDTH;
        this.canvas.height = c64Screen.HEIGHT;

        this.ctx = this.canvas.getContext('2d');
        this.ctx.imageSmoothingEnabled = false; // Keep pixels crisp when scaling

        // === THE PIXEL BUFFER ===
        // This is the composite surface. Sprites blit here, skipping transparent
        // pixels to achieve proper overlapping. RGBA format, 4 bytes per pixel.
        this.pixels = new Uint8Array(c64Screen.WIDTH * c64Screen.HEIGHT * 4);

        // Pre-create ImageData object for efficient putImageData calls
        this.imageData = this.ctx.createImageData(c64Screen.WIDTH, c64Screen.HEIGHT);
    }

    // === CLEARING ===
    // Fill the entire pixel buffer with a solid color.
    // Called at the start of each frame before blitting sprites.
    // Default is black (0, 0, 0). Alpha is always set to 255 (opaque).
    clear(r = 0, g = 0, b = 0) {
        for (let i = 0; i < this.pixels.length; i += 4) {
            this.pixels[i] = r;
            this.pixels[i + 1] = g;
            this.pixels[i + 2] = b;
            this.pixels[i + 3] = 255;
        }
    }

    // Clear to fully transparent (alpha=0).
    // Used when the canvas overlays other content and sprites should appear
    // without a background color (e.g., sprite editor preview overlay).
    clearTransparent() {
        for (let i = 0; i < this.pixels.length; i += 4) {
            this.pixels[i] = 0;
            this.pixels[i + 1] = 0;
            this.pixels[i + 2] = 0;
            this.pixels[i + 3] = 0;
        }
    }

    // === SINGLE PIXEL ACCESS ===
    // For simple drawing operations or debugging.
    // Most rendering should use blitToBuffer() in gmSprite/gmScene instead.
    setPixel(x, y, r, g, b) {
        if (x < 0 || x >= c64Screen.WIDTH || y < 0 || y >= c64Screen.HEIGHT) return;
        const idx = (y * c64Screen.WIDTH + x) * 4;
        this.pixels[idx] = r;
        this.pixels[idx + 1] = g;
        this.pixels[idx + 2] = b;
        this.pixels[idx + 3] = 255;
    }

    // === PRESENTATION ===
    // Copy the pixel buffer to the canvas for display.
    // This is the ONLY call that actually updates what the user sees.
    // Call once per frame after all sprites have been blitted.
    //
    // putImageData() is a raw pixel copy - no alpha blending, no transforms.
    // That's why we composite in the pixel buffer first.
    present() {
        this.imageData.data.set(this.pixels);
        this.ctx.putImageData(this.imageData, 0, 0);
    }

}

<script>/**
 * d64lib.js - Pure C64/1541 D64 Disk Image Library
 *
 * A stateless library for reading and writing D64 disk images.
 * No DOM dependencies, no callbacks, no localStorage - just pure disk operations.
 *
 * Usage:
 *   const disk = new D64(arrayBuffer);  // Load from file
 *   const disk = D64.createEmpty();      // Create blank disk
 *
 *   const dir = disk.getDirectory();
 *   const fileData = disk.readFile('MYGAME/PRG');
 *   disk.writeFile('NEWFILE/PRG', data, D64.FILE_TYPE_PRG);
 *   disk.deleteFile('OLDFILE/PRG');
 *
 *   const blob = disk.toBlob();  // For download
 */

class D64 {
    // Disk geometry constants
    static DIR_TRACK = 18;
    static SECTOR_SIZE = 256;
    static MAX_TRACKS = 35;

    // Sectors per track - 1541 disk layout
    static SECTORS_PER_TRACK = [
        0,  // placeholder for index 0 (tracks are 1-indexed)
        21, 21, 21, 21, 21, 21, 21, 21, 21, 21, 21, 21, 21, 21, 21, 21, 21,  // tracks 1-17
        19, 19, 19, 19, 19, 19, 19,                                          // tracks 18-24
        18, 18, 18, 18, 18, 18,                                              // tracks 25-30
        17, 17, 17, 17, 17                                                   // tracks 31-35
    ];

    // File type constants (matching 1541 DOS)
    static FILE_TYPE_DEL = 0x00;
    static FILE_TYPE_SEQ = 0x81;
    static FILE_TYPE_PRG = 0x82;
    static FILE_TYPE_USR = 0x83;
    static FILE_TYPE_REL = 0x84;

    // Interleave for file data sectors (1541 uses 10)
    static FILE_INTERLEAVE = 10;

    // Standard D64 size (35 tracks)
    static DISK_SIZE = 174848;

    /**
     * Create a D64 instance from disk data
     * @param {Uint8Array|ArrayBuffer} data - Raw D64 disk image data
     */
    constructor(data) {
        if (data instanceof ArrayBuffer) {
            this.data = new Uint8Array(data);
        } else if (data instanceof Uint8Array) {
            this.data = data;
        } else {
            throw new Error('D64 constructor requires Uint8Array or ArrayBuffer');
        }
    }

    /**
     * Create an empty formatted D64 disk
     * @param {string} diskName - Name for the disk (max 16 chars)
     * @param {string} diskId - 2-character disk ID
     * @returns {D64} New D64 instance
     */
    static createEmpty(diskName = 'EMPTY DISK', diskId = '00') {
        const data = new Uint8Array(D64.DISK_SIZE);

        // Initialize BAM (track 18, sector 0)
        const bamOffset = D64._getTrackSectorOffset(D64.DIR_TRACK, 0);

        // First directory track/sector pointer
        data[bamOffset + 0] = D64.DIR_TRACK;
        data[bamOffset + 1] = 1;

        // DOS type
        data[bamOffset + 2] = 0x41;  // 'A' for 1541
        data[bamOffset + 3] = 0x00;

        // Initialize BAM entries for all tracks
        for (let track = 1; track <= D64.MAX_TRACKS; track++) {
            const sectors = D64.SECTORS_PER_TRACK[track];
            const offset = bamOffset + 4 + (track - 1) * 4;

            if (track === D64.DIR_TRACK) {
                // Directory track - mark sectors 0-1 as used, rest as free
                data[offset] = sectors - 2;  // free count
                data[offset + 1] = 0xFC;     // sectors 2-7 free
                data[offset + 2] = 0xFF;     // sectors 8-15 free
                data[offset + 3] = 0x07;     // sectors 16-18 free
            } else {
                // Data track - all sectors free
                data[offset] = sectors;
                // Set bitmap bits for available sectors
                const fullBytes = Math.floor(sectors / 8);
                const remainingBits = sectors % 8;
                for (let i = 0; i < fullBytes; i++) {
                    data[offset + 1 + i] = 0xFF;
                }
                if (remainingBits > 0) {
                    data[offset + 1 + fullBytes] = (1 << remainingBits) - 1;
                }
            }
        }

        // Disk name at BAM + 144
        const nameOffset = bamOffset + 144;
        const paddedName = diskName.substring(0, 16).toUpperCase().padEnd(16, '\xA0');
        for (let i = 0; i < 16; i++) {
            data[nameOffset + i] = paddedName.charCodeAt(i);
        }

        // Disk ID at BAM + 162
        data[bamOffset + 162] = diskId.charCodeAt(0) || 0x30;
        data[bamOffset + 163] = diskId.charCodeAt(1) || 0x30;

        // DOS type indicator
        data[bamOffset + 165] = 0x32;  // '2'
        data[bamOffset + 166] = 0x41;  // 'A'

        // Initialize first directory sector (track 18, sector 1)
        const dirOffset = D64._getTrackSectorOffset(D64.DIR_TRACK, 1);
        data[dirOffset + 0] = 0x00;   // End of chain
        data[dirOffset + 1] = 0xFF;   // Unused bytes marker

        return new D64(data);
    }

    // =========================================================================
    // DISK GEOMETRY
    // =========================================================================

    /**
     * Calculate byte offset for a track/sector
     * @param {number} track - Track number (1-35)
     * @param {number} sector - Sector number (0-20)
     * @returns {number} Byte offset in disk image
     */
    static _getTrackSectorOffset(track, sector) {
        if (track < 1 || track > D64.MAX_TRACKS) {
            throw new Error(`Invalid track: ${track}`);
        }
        if (sector < 0 || sector >= D64.SECTORS_PER_TRACK[track]) {
            throw new Error(`Invalid sector ${sector} for track ${track}`);
        }

        let offset = 0;
        for (let t = 1; t < track; t++) {
            offset += D64.SECTORS_PER_TRACK[t] * D64.SECTOR_SIZE;
        }
        offset += sector * D64.SECTOR_SIZE;
        return offset;
    }

    /**
     * Get byte offset for a track/sector (instance method)
     */
    getTrackSectorOffset(track, sector) {
        return D64._getTrackSectorOffset(track, sector);
    }

    // =========================================================================
    // READING
    // =========================================================================

    /**
     * Follow a sector chain and return all data
     * @param {number} track - Starting track
     * @param {number} sector - Starting sector
     * @param {boolean} includeLinks - Include T/S link bytes (for directory)
     * @returns {Uint8Array} Chained data
     */
    getChainedData(track, sector, includeLinks = false) {
        const chainData = [];
        const MAX_SECTORS = 768;  // Safety limit
        let sectorCount = 0;

        const dataStart = includeLinks ? 0 : 2;

        while (track !== 0) {
            const sectorOffset = D64._getTrackSectorOffset(track, sector);
            const sectorData = this.data.slice(sectorOffset, sectorOffset + D64.SECTOR_SIZE);

            const nextTrack = sectorData[0];
            const nextSector = sectorData[1];

            if (nextTrack === 0) {
                // Last sector: nextSector is the OFFSET OF THE LAST USED BYTE, so the exclusive
                // end is one past it. No special case for a full sector -- 254 bytes end at
                // offset 255 and slice(2, 256) returns all of them.
                //
                // This read `nextSector === 0 ? 256 : nextSector`, which was the exact MIRROR of
                // the writer's bug: slice is exclusive, so treating the pointer as one-past-the-end
                // undid the writer's +2, and 0 -> 256 undid its 254 -> 0. The two cancelled, every
                // round-trip through this library was byte-perfect, and nothing here could ever
                // detect either fault. Only a real KERNAL, which uses the actual convention, saw
                // the malformed disk. Fixing the writer alone therefore BREAKS this reader.
                //
                // Legacy repair: before that fix our writer stored 0 (not 255) for a final sector
                // holding a full 254 bytes. 0 and 1 are never valid here (they would mean the last
                // used byte sits inside the link bytes), so read either as a full sector. Without
                // this, a file saved by the old writer at an exact multiple of 254 bytes would
                // silently lose its last 254 bytes.
                const endOffset = nextSector < 2 ? 256 : nextSector + 1;
                chainData.push(...sectorData.slice(dataStart, endOffset));
                break;
            }

            chainData.push(...sectorData.slice(dataStart));

            track = nextTrack;
            sector = nextSector;

            if (++sectorCount > MAX_SECTORS) {
                throw new Error('Sector chain too long (possible corruption)');
            }
        }

        return new Uint8Array(chainData);
    }

    /**
     * Get disk name from BAM
     * @returns {string} Disk name
     */
    getDiskName() {
        const bamOffset = D64._getTrackSectorOffset(D64.DIR_TRACK, 0);
        const nameOffset = bamOffset + 144;
        const rawName = this.data.slice(nameOffset, nameOffset + 16);
        return D64._parseFileName(rawName);
    }

    /**
     * Parse directory and return file entries
     * @returns {Array} Array of {fileName, fileType, fileSize, startTrack, startSector}
     */
    getDirectory() {
        const directoryData = this.getChainedData(D64.DIR_TRACK, 1, true);
        const entries = [];
        const DIR_ENTRY_SIZE = 32;

        for (let offset = 0; offset < directoryData.length; offset += DIR_ENTRY_SIZE) {
            const entry = directoryData.slice(offset, offset + DIR_ENTRY_SIZE);

            // File type 0x00 = scratched/empty
            if (entry[2] === 0x00) continue;

            const fileName = D64._parseFileName(entry.slice(5, 21));
            const fileType = D64._parseFileType(entry[2]);

            if (fileType === 'DEL') continue;

            entries.push({
                fileName,
                fileType,
                fileSize: entry[30] | (entry[31] << 8),
                startTrack: entry[3],
                startSector: entry[4]
            });
        }

        return entries;
    }

    /**
     * Read a file by name
     * @param {string} fileName - File name to find
     * @returns {Uint8Array|null} File data or null if not found
     */
    readFile(fileName) {
        const normalizedName = fileName.trim().toUpperCase();
        const entry = this.getDirectory().find(
            e => e.fileName.trim().toUpperCase() === normalizedName
        );

        if (!entry) return null;

        return this.getChainedData(entry.startTrack, entry.startSector);
    }

    // =========================================================================
    // BAM (BLOCK AVAILABILITY MAP)
    // =========================================================================

    /**
     * Get BAM offset for a track
     */
    _getBAMOffset(track) {
        return D64._getTrackSectorOffset(D64.DIR_TRACK, 0) + 4 + (track - 1) * 4;
    }

    /**
     * Check if a sector is free
     */
    isSectorFree(track, sector) {
        const bamOffset = this._getBAMOffset(track);
        const byteIndex = Math.floor(sector / 8);
        const bitIndex = sector % 8;
        return (this.data[bamOffset + 1 + byteIndex] & (1 << bitIndex)) !== 0;
    }

    /**
     * Allocate a sector (mark as used)
     */
    _allocateSector(track, sector) {
        if (!this.isSectorFree(track, sector)) {
            throw new Error(`Sector ${track}/${sector} already allocated`);
        }

        const bamOffset = this._getBAMOffset(track);
        this.data[bamOffset]--;  // Decrement free count

        const byteIndex = Math.floor(sector / 8);
        const bitIndex = sector % 8;
        this.data[bamOffset + 1 + byteIndex] &= ~(1 << bitIndex);
    }

    /**
     * Free a sector (mark as available)
     */
    _freeSector(track, sector) {
        if (this.isSectorFree(track, sector)) return;

        const bamOffset = this._getBAMOffset(track);
        this.data[bamOffset]++;  // Increment free count

        const byteIndex = Math.floor(sector / 8);
        const bitIndex = sector % 8;
        this.data[bamOffset + 1 + byteIndex] |= (1 << bitIndex);
    }

    /**
     * Count total free blocks on disk
     */
    getFreeBlocks() {
        let total = 0;
        for (let track = 1; track <= D64.MAX_TRACKS; track++) {
            if (track === D64.DIR_TRACK) continue;
            total += this.data[this._getBAMOffset(track)];
        }
        return total;
    }

    // =========================================================================
    // SECTOR ALLOCATION
    // =========================================================================

    /**
     * Find a free sector on a specific track
     */
    _findFreeSectorOnTrack(track, startSector = 0) {
        const numSectors = D64.SECTORS_PER_TRACK[track];
        let sector = startSector;

        for (let i = 0; i < numSectors; i++) {
            if (this.isSectorFree(track, sector)) {
                return sector;
            }
            sector = (sector + 1) % numSectors;
        }
        return -1;
    }

    /**
     * Find any free sector on disk
     */
    _findFreeSector(preferTrack = 1, preferSector = 0) {
        // Try preferred track first
        if (preferTrack !== D64.DIR_TRACK) {
            const sector = this._findFreeSectorOnTrack(preferTrack, preferSector);
            if (sector !== -1) {
                return { track: preferTrack, sector };
            }
        }

        // Search all tracks
        for (let track = 1; track <= D64.MAX_TRACKS; track++) {
            if (track === D64.DIR_TRACK) continue;
            const sector = this._findFreeSectorOnTrack(track, 0);
            if (sector !== -1) {
                return { track, sector };
            }
        }
        return null;
    }

    /**
     * Allocate a chain of sectors
     */
    _allocateSectorChain(numSectors) {
        const chain = [];
        let currentTrack = 1;
        let currentSector = 0;

        for (let i = 0; i < numSectors; i++) {
            const nextSector = (currentSector + D64.FILE_INTERLEAVE) %
                               D64.SECTORS_PER_TRACK[currentTrack];
            const location = this._findFreeSector(currentTrack, nextSector);

            if (!location) {
                // Rollback
                for (const loc of chain) {
                    this._freeSector(loc.track, loc.sector);
                }
                return null;
            }

            this._allocateSector(location.track, location.sector);
            chain.push(location);

            currentTrack = location.track;
            currentSector = location.sector;
        }

        return chain;
    }

    // =========================================================================
    // WRITING
    // =========================================================================

    /**
     * Find an empty directory entry slot
     */
    _findEmptyDirectoryEntry() {
        let track = D64.DIR_TRACK;
        let sector = 1;

        while (track !== 0) {
            const sectorOffset = D64._getTrackSectorOffset(track, sector);

            for (let entry = 0; entry < 8; entry++) {
                const entryOffset = sectorOffset + entry * 32;
                if (this.data[entryOffset + 2] === 0x00) {
                    return { track, sector, offset: entry * 32 };
                }
            }

            const nextTrack = this.data[sectorOffset];
            const nextSector = this.data[sectorOffset + 1];

            if (nextTrack === 0) {
                // Try to extend directory
                const newDirSector = this._findFreeSectorOnTrack(D64.DIR_TRACK, sector);
                if (newDirSector !== -1 && newDirSector !== 0) {
                    this._allocateSector(D64.DIR_TRACK, newDirSector);
                    this.data[sectorOffset] = D64.DIR_TRACK;
                    this.data[sectorOffset + 1] = newDirSector;

                    const newOffset = D64._getTrackSectorOffset(D64.DIR_TRACK, newDirSector);
                    this.data.fill(0, newOffset, newOffset + 256);
                    this.data[newOffset + 1] = 0xFF;

                    return { track: D64.DIR_TRACK, sector: newDirSector, offset: 0 };
                }
                break;
            }

            track = nextTrack;
            sector = nextSector;
        }

        return null;
    }

    /**
     * Write file data to a sector chain
     */
    _writeFileData(fileData, sectorChain) {
        let dataOffset = 0;

        for (let i = 0; i < sectorChain.length; i++) {
            const { track, sector } = sectorChain[i];
            const sectorOffset = D64._getTrackSectorOffset(track, sector);

            const remainingData = fileData.length - dataOffset;
            const bytesThisSector = Math.min(254, remainingData);

            if (i < sectorChain.length - 1) {
                this.data[sectorOffset] = sectorChain[i + 1].track;
                this.data[sectorOffset + 1] = sectorChain[i + 1].sector;
            } else {
                // Last sector: byte 0 = $00, byte 1 = the OFFSET OF THE LAST USED BYTE.
                // Data occupies offsets 2..N+1 for N bytes, so byte 1 is N + 1 -- including the
                // full case, where 254 bytes end at offset 255. No special case is needed.
                //
                // This read `bytesThisSector === 254 ? 0 : bytesThisSector + 2`, which was wrong
                // twice. The +2 made EVERY file this writer has ever produced one byte too long:
                // the loader reads one byte past the file and stores it past the end. And the 254
                // case wrote 0, which is not a valid last-byte offset -- so any file whose length
                // is an exact multiple of 254 got a broken sector chain, c1541 reported "Track 0,
                // Sector 0 out of bounds", and the KERNAL hung at LOADING.
                //
                // Found in c64fps, which vendors this file: a 19,050-byte image (254 x 75) would
                // not boot while an 18,991-byte one did, so it looked like whichever feature last
                // changed the build size had broken something.
                this.data[sectorOffset] = 0x00;
                this.data[sectorOffset + 1] = bytesThisSector + 1;
            }

            for (let j = 0; j < bytesThisSector; j++) {
                this.data[sectorOffset + 2 + j] = fileData[dataOffset + j];
            }
            for (let j = bytesThisSector; j < 254; j++) {
                this.data[sectorOffset + 2 + j] = 0x00;
            }

            dataOffset += bytesThisSector;
        }
    }

    /**
     * Write a file to disk
     * @param {string} fileName - File name (max 16 chars)
     * @param {Uint8Array} fileData - File contents
     * @param {number} fileType - File type constant (default: PRG)
     * @returns {boolean} Success
     */
    writeFile(fileName, fileData, fileType = D64.FILE_TYPE_PRG) {
        if (!fileName || fileName.length === 0) {
            throw new Error('Invalid filename');
        }
        if (!fileData || fileData.length === 0) {
            throw new Error('No file data');
        }

        const numSectors = Math.ceil(fileData.length / 254);

        if (this.getFreeBlocks() < numSectors) {
            throw new Error(`Not enough space. Need ${numSectors}, have ${this.getFreeBlocks()}`);
        }

        const dirEntry = this._findEmptyDirectoryEntry();
        if (!dirEntry) {
            throw new Error('Directory is full');
        }

        const sectorChain = this._allocateSectorChain(numSectors);
        if (!sectorChain) {
            throw new Error('Failed to allocate sectors');
        }

        this._writeFileData(fileData, sectorChain);
        this._writeDirectoryEntry(dirEntry, fileName, fileType,
                                  sectorChain[0].track, sectorChain[0].sector, numSectors);

        return true;
    }

    /**
     * Write a directory entry
     */
    _writeDirectoryEntry(dirLocation, fileName, fileType, startTrack, startSector, blocks) {
        const sectorOffset = D64._getTrackSectorOffset(dirLocation.track, dirLocation.sector);
        const entryOffset = sectorOffset + dirLocation.offset;

        this.data[entryOffset + 2] = fileType;
        this.data[entryOffset + 3] = startTrack;
        this.data[entryOffset + 4] = startSector;

        // Filename in PETSCII (padded with $A0)
        const petsciiName = D64.stringToPetscii(fileName.substring(0, 16), 16);
        for (let i = 0; i < 16; i++) {
            this.data[entryOffset + 5 + i] = petsciiName[i];
        }

        // Clear unused fields
        for (let i = 21; i < 30; i++) {
            this.data[entryOffset + i] = 0x00;
        }

        // File size in blocks
        this.data[entryOffset + 30] = blocks & 0xFF;
        this.data[entryOffset + 31] = (blocks >> 8) & 0xFF;
    }

    /**
     * Delete a file from disk
     * @param {string} fileName - File to delete
     * @returns {boolean} Success
     */
    deleteFile(fileName) {
        const normalizedName = fileName.trim().toUpperCase();
        const entry = this.getDirectory().find(
            e => e.fileName.trim().toUpperCase() === normalizedName
        );

        if (!entry) {
            throw new Error(`File "${fileName}" not found`);
        }

        // Free sector chain
        let track = entry.startTrack;
        let sector = entry.startSector;
        let count = 0;

        while (track !== 0 && count < 800) {
            const sectorOffset = D64._getTrackSectorOffset(track, sector);
            const nextTrack = this.data[sectorOffset];
            const nextSector = this.data[sectorOffset + 1];

            this._freeSector(track, sector);

            track = nextTrack;
            sector = nextSector;
            count++;
        }

        // Scratch directory entry
        let dirTrack = D64.DIR_TRACK;
        let dirSector = 1;

        while (dirTrack !== 0) {
            const sectorOffset = D64._getTrackSectorOffset(dirTrack, dirSector);

            for (let e = 0; e < 8; e++) {
                const entryOffset = sectorOffset + e * 32;
                if (this.data[entryOffset + 3] === entry.startTrack &&
                    this.data[entryOffset + 4] === entry.startSector) {
                    this.data[entryOffset + 2] = 0x00;
                    return true;
                }
            }

            dirTrack = this.data[sectorOffset];
            dirSector = this.data[sectorOffset + 1];
        }

        throw new Error('Could not find directory entry');
    }

    // =========================================================================
    // EXPORT
    // =========================================================================

    /**
     * Get disk data as a Blob for download
     * @returns {Blob}
     */
    toBlob() {
        return new Blob([this.data], { type: 'application/octet-stream' });
    }

    /**
     * Get raw disk data
     * @returns {Uint8Array}
     */
    getData() {
        return this.data;
    }

    // =========================================================================
    // PETSCII / FILENAME HELPERS
    // =========================================================================

    /**
     * Convert PETSCII filename bytes to JavaScript string.
     * 1541 filenames use a subset of PETSCII where uppercase A-Z (0x41-0x5A)
     * and digits (0x30-0x39) match ASCII. Padding byte 0xA0 (shifted space)
     * is converted to regular space and trimmed.
     *
     * Note: This handles disk filenames only. For GM's screen code character
     * set (used in program text), see c64lib.js decodeChar/decodeString.
     *
     * @param {Uint8Array} rawName - Raw PETSCII bytes
     * @returns {string} Decoded filename
     */
    static petsciiToString(rawName) {
        return String.fromCharCode(...rawName).replace(/\xA0/g, ' ').trim();
    }

    /**
     * Convert JavaScript string to PETSCII filename bytes.
     * Converts to uppercase and pads with 0xA0 to specified length.
     *
     * @param {string} str - String to convert
     * @param {number} length - Target length (default 16 for filenames)
     * @returns {Uint8Array} PETSCII bytes
     */
    static stringToPetscii(str, length = 16) {
        const result = new Uint8Array(length);
        const upper = str.toUpperCase();
        for (let i = 0; i < length; i++) {
            if (i < upper.length) {
                const code = upper.charCodeAt(i);
                // Uppercase letters and digits map directly
                result[i] = code;
            } else {
                result[i] = 0xA0;  // Pad with shifted space
            }
        }
        return result;
    }

    // Private alias for internal use
    static _parseFileName(rawName) {
        return D64.petsciiToString(rawName);
    }

    /**
     * Parse file type byte to string
     * @param {number} fileTypeByte - File type byte from directory entry
     * @returns {string} File type name (DEL, SEQ, PRG, USR, REL, UNK)
     */
    static parseFileType(fileTypeByte) {
        const types = ['DEL', 'SEQ', 'PRG', 'USR', 'REL'];
        const type = types[fileTypeByte & 0x07] || 'UNK';
        return (fileTypeByte & 0x80) ? type : 'DEL';
    }

    // Private alias for internal use
    static _parseFileType(fileTypeByte) {
        return D64.parseFileType(fileTypeByte);
    }
}

// Make available globally for browser and Node.js testing
if (typeof globalThis !== 'undefined') {
    globalThis.D64 = D64;
}

<script>/**
 * gmDisk.js - GameMaker Disk Management Layer
 *
 * Wraps D64 (d64lib.js) with GM-specific functionality:
 * - localStorage persistence per page
 * - GM file type definitions (/SPR, /PIC, /SND, /SNG, /PRG)
 * - Unified popup UI for disk operations
 *
 * Usage:
 *   // Initialize (typically on page load)
 *   const disk = new GMDisk();
 *   disk.autoLoad();  // Load from localStorage if available
 *
 *   // Show file picker popup
 *   disk.showPopup({
 *       fileType: GMDisk.FILE_TYPES.SPRITE,
 *       onSelect: (fileName, data) => { ... }
 *   });
 *
 *   // Direct file operations
 *   const files = disk.listFiles(GMDisk.FILE_TYPES.SPRITE);
 *   const data = disk.loadFile('PLAYER/SPR');
 *   disk.saveFile('PLAYER/SPR', data);
 */

class GMDisk {
    // =========================================================================
    // FILE TYPE DEFINITIONS
    // =========================================================================

    static FILE_TYPES = {
        SPRITE:  { extension: '/SPR', label: 'Sprites',  filter: name => name.endsWith('/SPR') },
        SCENE:   { extension: '/PIC', label: 'Scenes',   filter: name => name.endsWith('/PIC') },
        SOUND:   { extension: '/SND', label: 'Sounds',   filter: name => name.endsWith('/SND') },
        MUSIC:   { extension: '/SNG', label: 'Music',    filter: name => name.endsWith('/SNG') },
        PROGRAM: { extension: '/PRG', label: 'Programs', filter: name => name.endsWith('/PRG') },
        ALL:     { extension: '',     label: 'All',      filter: () => true }
    };

    // Friendly singular type label shown in the directory's "type" column.
    static _typeLabel(ext) {
        switch ((ext || '').toUpperCase()) {
            case '/SPR': return 'sprite';
            case '/PIC': return 'scene';
            case '/SND': return 'sound';
            case '/SNG': return 'music';
            case '/PRG': return 'program';
            // Synthetic markers for non-extension groups. Neither is a
            // real disk extension — the popup uses them so the rows can
            // still label their type column.
            case 'STANDALONE': return 'standalone';
            case 'NON_GM':     return 'non-GameMaker';
            default:     return '';
        }
    }

    // Extension → editor page for cross-editor dispatch. Clicking a
    // dimmed non-primary GM file in the disk popup navigates the browser
    // to the target editor with ?disk=pool:<id>&file=<name> so the
    // target picks up the same disk and auto-loads the file.
    static _editorForExt(ext) {
        switch ((ext || '').toUpperCase()) {
            case '/SPR': return 'sprite-maker';
            case '/PIC': return 'scene-maker';
            case '/SND': return 'sound-maker';
            case '/SNG': return 'music-maker';
            case '/PRG': return 'program-editor';
            // Standalone exports (synthetic ext) also open in the program
            // editor — it's the only editor that detects the $0302 magic
            // and routes the bytes through standaloneToPRG. Dispatch to it
            // directly rather than the editor.html redirect stub.
            case 'STANDALONE': return 'program-editor';
            default:     return null;
        }
    }

    // GM's filename pattern: exactly 6 chars (space-padded if shorter) + slash
    // + 3-char known extension. This popup is a GM file finder, not a generic
    // disk browser, so anything else on the disk is silently skipped.
    static _isGmFile(fileName) {
        return /^.{6}\/(SPR|PIC|SND|SNG|PRG)$/i.test(fileName);
    }

    // Standalone GameMaker exports have no filename extension (single
    // words or numeric names like "ALIENS", "1", "2") but are distinguishable
    // by:
    //   - directory-entry block count of 191 (fixed size for the format)
    //   - load address $0302 in the first two bytes (the self-launching-
    //     via-IRQ-vector trick — no other C64 file type loads here)
    // Both checks are cheap: block count comes from the directory entry;
    // magic bytes require reading only the file's first sector.
    static _isStandaloneEntry(disk, entry) {
        if (entry.fileSize !== 191) return false;
        // getChainedData reads the whole chain — potentially ~48KB per call.
        // We only need the first two bytes, so limit to the start sector.
        // No public "read N bytes" method exists yet; the 191-block cost
        // per candidate is bearable given how few extension-less files
        // typically live on a GM disk.
        try {
            const data = disk.getChainedData(entry.startTrack, entry.startSector);
            return data && data.length >= 2 && data[0] === 0x02 && data[1] === 0x03;
        } catch (e) {
            return false;
        }
    }

    // Long disk filenames (uploaded .d64 files) can blow out the disk picker
    // layout. Collapse anything >30 chars to "first 20 … last 10" — keeps
    // the start (often the meaningful part) AND the tail (often a version
    // or unique suffix) while cutting boring middle.
    static _truncateDiskName(name) {
        if (!name || name.length <= 30) return name;
        return name.slice(0, 20) + '…' + name.slice(-10);
    }

    // =========================================================================
    // SHARED DISK POOL (static)
    // =========================================================================
    // All disks (inserted or created via Blank) live in a single shared pool in
    // localStorage. Each editor remembers which disk it's currently viewing.
    //
    // Storage layout:
    //   gm_disk_pool_index            JSON: [{id, name, diskName}, ...]
    //   gm_disk_pool_data_<id>        base64-encoded disk bytes per disk
    //   gm_disk_selection_<page>      id of disk currently selected by that tool

    static POOL_INDEX_KEY = 'gm_disk_pool_index';
    static POOL_DATA_PREFIX = 'gm_disk_pool_data_';
    static SELECTION_PREFIX = 'gm_disk_selection_';   // legacy per-editor selection (pre-shared)
    static CURRENT_KEY = 'gm_disk_current';           // the ONE working disk shared across all editors

    static _migrated = false;

    static getPool() {
        this._ensureMigrated();
        try {
            const raw = localStorage.getItem(this.POOL_INDEX_KEY);
            return raw ? JSON.parse(raw) : [];
        } catch (e) {
            return [];
        }
    }

    static _savePoolIndex(index) {
        localStorage.setItem(this.POOL_INDEX_KEY, JSON.stringify(index));
    }

    static _getDiskBytes(id) {
        const base64 = localStorage.getItem(this.POOL_DATA_PREFIX + id);
        if (!base64) return null;
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
    }

    static _putDiskBytes(id, bytes) {
        // String.fromCharCode.apply on a 174KB array blows the V8 arg limit, so
        // chunk it. 32KB chunks are well under the limit on every engine.
        const CHUNK = 0x8000;
        let binary = '';
        for (let i = 0; i < bytes.length; i += CHUNK) {
            binary += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
        }
        localStorage.setItem(this.POOL_DATA_PREFIX + id, btoa(binary));
    }

    static _newId() {
        return 'd_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
    }

    static async _hashBytes(bytes) {
        // Prefer crypto.subtle (available on HTTPS + localhost); fall
        // back to a non-crypto hash otherwise. We only use the result
        // for pool dedup, not for anything security-sensitive.
        //
        // The fallback matters because gmc64 gets tested / used over
        // LAN HTTP (`http://192.168.x.y:8000`) — Web Crypto requires a
        // "secure context" and refuses to expose `crypto.subtle` on
        // plain HTTP. Without a fallback, the demo disk (and every
        // disk add) fails with "undefined is not an object" here.
        if (globalThis.crypto && crypto.subtle && crypto.subtle.digest) {
            try {
                const buffer = await crypto.subtle.digest('SHA-256', bytes);
                return Array.from(new Uint8Array(buffer))
                    .map(b => b.toString(16).padStart(2, '0'))
                    .join('');
            } catch { /* fall through */ }
        }
        // FNV-1a with two independent 32-bit seeds → 64-bit fingerprint.
        // For a personal disk pool (dozens of entries at most) collision
        // odds are negligible. Prefix so a fallback hash can't collide
        // with a shorter prefix of a SHA-256 hash stored during a prior
        // HTTPS visit — matters if the user later crosses contexts.
        let h1 = 0x811c9dc5 | 0;   // FNV offset basis
        let h2 = 0x1b873593 | 0;   // second seed (arbitrary independent constant)
        for (let i = 0; i < bytes.length; i++) {
            h1 ^= bytes[i]; h1 = Math.imul(h1, 0x01000193);
            h2 ^= bytes[i]; h2 = Math.imul(h2, 0xcc9e2d51);
        }
        return 'fnv:' +
            (h1 >>> 0).toString(16).padStart(8, '0') +
            (h2 >>> 0).toString(16).padStart(8, '0');
    }

    /**
     * Backfill SHA-256 hashes for any pool entries that lack them (e.g. entries
     * migrated from the legacy per-tool storage layout, which was sync-only).
     */
    static async _ensureHashes() {
        const index = this.getPool();
        let changed = false;
        for (const entry of index) {
            if (entry.hash) continue;
            const bytes = this._getDiskBytes(entry.id);
            if (!bytes) continue;
            entry.hash = await this._hashBytes(bytes);
            changed = true;
        }
        if (changed) this._savePoolIndex(index);
    }

    /**
     * Add a disk to the pool, deduplicating by SHA-256 of the bytes. Returns the
     * id of the matching existing entry if one is found, otherwise the new id.
     */
    static async addToPool(bytes, name) {
        await this._ensureHashes();
        const hash = await this._hashBytes(bytes);

        const index = this.getPool();
        const existing = index.find(e => e.hash === hash);
        if (existing) return existing.id;

        const id = this._newId();
        const tempDisk = new D64(bytes);
        index.push({ id, name, diskName: tempDisk.getDiskName(), hash });
        this._putDiskBytes(id, bytes);
        this._savePoolIndex(index);
        return id;
    }

    /**
     * Remove a disk from the pool (global — affects all editors).
     */
    static removeFromPool(id) {
        const index = this.getPool().filter(e => e.id !== id);
        this._savePoolIndex(index);
        localStorage.removeItem(this.POOL_DATA_PREFIX + id);
    }

    /**
     * Update an existing pool entry's data and/or metadata.
     */
    static updatePoolEntry(id, { name, diskName, data } = {}) {
        const index = this.getPool();
        const entry = index.find(e => e.id === id);
        if (!entry) return;
        if (name !== undefined) entry.name = name;
        if (diskName !== undefined) entry.diskName = diskName;
        this._savePoolIndex(index);
        if (data !== undefined) this._putDiskBytes(id, data);
    }

    /**
     * One-time silent migration of legacy per-tool storage into the shared pool.
     * Legacy keys (gm_disk_<page>) are removed after migration.
     */
    static _ensureMigrated() {
        if (this._migrated) return;
        this._migrated = true;

        const pages = ['editor', 'sprite-maker', 'sound-maker', 'scene-maker', 'music-maker'];
        // Read the (recursive-safe) pool once; addToPool is async, so migration
        // must inline its work. Hashes are backfilled lazily by _ensureHashes.
        const index = this.getPool();
        let changed = false;
        for (const page of pages) {
            const dataKey = `gm_disk_${page}`;
            const nameKey = `${dataKey}_name`;
            const stored = localStorage.getItem(dataKey);
            if (!stored) continue;
            try {
                const binary = atob(stored);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                const name = localStorage.getItem(nameKey) || `${page}.d64`;

                const id = this._newId();
                const tempDisk = new D64(bytes);
                index.push({ id, name, diskName: tempDisk.getDiskName() });
                this._putDiskBytes(id, bytes);

                localStorage.setItem(this.SELECTION_PREFIX + page, id);
                localStorage.removeItem(dataKey);
                localStorage.removeItem(nameKey);
                changed = true;
            } catch (e) {
                console.warn('GMDisk: legacy migration failed for', page, e.message);
            }
        }
        if (changed) this._savePoolIndex(index);
    }

    /**
     * Seed the shared working-disk selection from a legacy per-editor selection (one-time upgrade).
     * Prefers `preferredKey` (this editor's old key); else the first surviving per-editor selection.
     * Returns a pool id that still exists, or null.
     */
    static _adoptLegacySelection(preferredKey) {
        const pool = this.getPool();
        const valid = id => id && pool.some(e => e.id === id);
        const pref = localStorage.getItem(preferredKey);
        if (valid(pref)) return pref;
        for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith(this.SELECTION_PREFIX)) {
                const v = localStorage.getItem(k);
                if (valid(v)) return v;
            }
        }
        return null;
    }

    // =========================================================================
    // CONSTRUCTOR
    // =========================================================================

    /**
     * Create a GMDisk instance
     * @param {Object} options
     * @param {string} options.selectionKey - per-tool selection key (default: auto from page name)
     * @param {HTMLElement} options.container - Container for popup (default: document.body)
     */
    constructor(options = {}) {
        const pageName = window.location.pathname.split('/').pop().replace('.html', '') || 'default';
        // One working disk shared across all editors: default to the shared CURRENT_KEY rather than a
        // per-editor key, so inserting/switching a disk in one editor is seen in every other editor.
        this.selectionKey = options.selectionKey || GMDisk.CURRENT_KEY;
        this._legacyKey = `${GMDisk.SELECTION_PREFIX}${pageName}`;   // pre-shared per-editor key, for the one-time upgrade seed

        this.container = options.container || document.body;

        // Current disk state — pointer into the shared pool
        this.disk = null;             // D64 instance for the currently-selected disk
        this.diskFileName = '';       // Original .d64 filename
        this.currentDiskId = null;    // Pool id of the currently-selected disk

        // Popup state
        this.popup = null;
        this.popupOptions = null;

        this.selectedIndex = -1;
        this.directoryEntries = [];

        this._onKeyDown = this._onKeyDown.bind(this);
    }

    // =========================================================================
    // PERSISTENCE — backed by the shared pool
    // =========================================================================

    /**
     * Push the in-memory disk back to the pool entry it came from.
     */
    save() {
        if (!this.disk || !this.currentDiskId) return false;
        try {
            GMDisk.updatePoolEntry(this.currentDiskId, {
                diskName: this.disk.getDiskName(),
                data: this.disk.getData()
            });
            return true;
        } catch (e) {
            console.warn('GMDisk: Failed to save to pool:', e.message);
            return false;
        }
    }

    /**
     * Load this tool's selected disk from the pool. If the selection is stale
     * or absent, falls back to the first disk in the pool.
     * @returns {boolean} true if a disk was loaded
     */
    load() {
        let savedId = localStorage.getItem(this.selectionKey);
        // Upgrade seed: the first time we read the shared key and it's empty, adopt any existing
        // per-editor selection so a user's current working disk carries over instead of jumping to
        // the first disk in the pool. Runs once (the write below makes it non-empty thereafter).
        if (!savedId && this.selectionKey === GMDisk.CURRENT_KEY) {
            savedId = GMDisk._adoptLegacySelection(this._legacyKey);
            if (savedId) localStorage.setItem(this.selectionKey, savedId);
        }
        if (savedId && this.selectDisk(savedId)) return true;

        // Stale or missing selection — fall back to first disk in pool
        const pool = GMDisk.getPool();
        if (pool.length > 0) return this.selectDisk(pool[0].id);

        // Pool empty
        this.disk = null;
        this.diskFileName = '';
        this.currentDiskId = null;
        localStorage.removeItem(this.selectionKey);
        return false;
    }

    /**
     * Switch this tool to a different disk from the pool.
     * @returns {boolean} true if the disk was loaded successfully
     */
    selectDisk(id) {
        const entry = GMDisk.getPool().find(e => e.id === id);
        if (!entry) return false;
        const bytes = GMDisk._getDiskBytes(id);
        if (!bytes) return false;
        try {
            this.disk = new D64(bytes);
            this.diskFileName = entry.name;
            this.currentDiskId = id;
            localStorage.setItem(this.selectionKey, id);
            return true;
        } catch (e) {
            console.warn('GMDisk: Failed to instantiate D64:', e.message);
            return false;
        }
    }

    /**
     * Keep this editor's inserted disk in sync when the shared working disk is switched in ANOTHER
     * tab. The `storage` event fires only in other tabs, so when CURRENT_KEY changes we silently
     * repoint this instance at the new disk — the picker / save / load then use it, like a 1541
     * where every tool reads whatever disk is in the drive. The current in-progress edit is left
     * untouched; the disk stays partitioned behind the file popup, so no UI notice is needed.
     */
    onExternalChange() {
        if (this.selectionKey !== GMDisk.CURRENT_KEY) return;   // only the shared working disk syncs cross-tab
        window.addEventListener('storage', (e) => {
            if (e.key !== GMDisk.CURRENT_KEY || !e.newValue) return;
            if (e.newValue === this.currentDiskId) return;       // already on this disk
            this.selectDisk(e.newValue);
        });
    }

    /**
     * Re-read the current disk's bytes from the shared pool, replacing
     * the in-memory D64 instance. Use this when another editor might
     * have written to the same disk (saved a sprite, scene, etc.) and
     * our cached `this.disk` would otherwise miss the new files.
     */
    refresh() {
        if (this.currentDiskId) this.selectDisk(this.currentDiskId);
    }

    /**
     * Eject the current disk: removes it from the shared pool (affects every
     * editor that was viewing it) and snaps this tool to the next available
     * disk in the pool (or no-disk if the pool is empty).
     */
    clear() {
        if (this.currentDiskId) {
            GMDisk.removeFromPool(this.currentDiskId);
        }
        this.currentDiskId = null;
        this.disk = null;
        this.diskFileName = '';
        localStorage.removeItem(this.selectionKey);

        // Snap to next available disk
        const pool = GMDisk.getPool();
        if (pool.length > 0) this.selectDisk(pool[0].id);
    }

    /**
     * Create a fresh blank disk, add it to the pool, and select it.
     * A random disk id is used so that clicking Blank D64 twice in a row
     * produces two distinct disks (otherwise the SHA-256 dedup would collapse
     * deterministic blank-disk bytes into a single pool entry).
     */
    async createBlank(name = null, diskId = null) {
        // Default to a unique auto-numbered name ("NEW DISK 01", "NEW DISK 02",
        // …) so successive Blank-Disk clicks don't pile up identically-named
        // files. Explicit names (passed by callers) pass through untouched.
        const useName = name || `NEW DISK ${String(GMDisk._nextNewDiskNumber()).padStart(2, '0')}`;
        const id2 = diskId || GMDisk._randomDiskId();
        const d64 = D64.createEmpty(useName, id2);
        const safeName = (useName.replace(/[^A-Z0-9 ]/gi, '').trim().toUpperCase() || 'NEW') + '.d64';
        const poolId = await GMDisk.addToPool(d64.getData(), safeName);
        this.selectDisk(poolId);
    }

    // Walk the pool looking for "NEW DISK NN" entries and return max+1. Used
    // by createBlank when no explicit name is passed. Counts both pool
    // filenames ("NEW DISK 03.d64") and disk names ("NEW DISK 03") so a
    // rename of either side still bumps the next auto-number correctly.
    static _nextNewDiskNumber() {
        const pool = GMDisk.getPool();
        let max = 0;
        const filenameRe = /^NEW DISK (\d+)\.d64$/i;
        const diskNameRe = /^NEW DISK (\d+)$/i;
        for (const entry of pool) {
            const m = (entry.name || '').match(filenameRe)
                  || (entry.diskName || '').match(diskNameRe);
            if (m) max = Math.max(max, parseInt(m[1], 10));
        }
        return max + 1;
    }

    static _randomDiskId() {
        const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        return chars[Math.floor(Math.random() * chars.length)] + chars[Math.floor(Math.random() * chars.length)];
    }

    /**
     * Auto-load on page open — selects this tool's last-used disk, or the
     * first disk in the pool if none was previously selected.
     */
    autoLoad() {
        return this.load();
    }

    // =========================================================================
    // DISK OPERATIONS
    // =========================================================================

    /**
     * Check if a disk is loaded
     */
    hasDisk() {
        return this.disk !== null;
    }

    /**
     * Get disk name
     */
    getDiskName() {
        return this.disk ? this.disk.getDiskName() : '';
    }

    /**
     * Get free blocks
     */
    getFreeBlocks() {
        return this.disk ? this.disk.getFreeBlocks() : 0;
    }

    /**
     * List files, optionally filtered by type
     * @param {Object} fileType - One of GMDisk.FILE_TYPES (optional)
     * @returns {Array} Array of directory entries
     */
    listFiles(fileType = null) {
        if (!this.disk) return [];

        const entries = this.disk.getDirectory();
        if (!fileType || fileType === GMDisk.FILE_TYPES.ALL) {
            return entries;
        }
        return entries.filter(e => fileType.filter(e.fileName));
    }

    /**
     * Load a file by name
     * @param {string} fileName
     * @returns {Uint8Array|null}
     */
    loadFile(fileName) {
        if (!this.disk) return null;
        return this.disk.readFile(fileName);
    }

    /**
     * Save a file to disk
     * @param {string} fileName
     * @param {Uint8Array} data
     * @param {boolean} overwrite - Delete existing file first (default: true)
     * @returns {boolean}
     */
    saveFile(fileName, data, overwrite = true) {
        if (!this.disk) return false;

        try {
            // Check if file exists
            const existing = this.disk.getDirectory().find(
                e => e.fileName.trim().toUpperCase() === fileName.trim().toUpperCase()
            );

            if (existing) {
                if (overwrite) {
                    this.disk.deleteFile(fileName);
                } else {
                    throw new Error(`File "${fileName}" already exists`);
                }
            }

            this.disk.writeFile(fileName, data, D64.FILE_TYPE_PRG);
            this.save();  // Persist to localStorage
            return true;
        } catch (e) {
            console.error('GMDisk: saveFile failed:', e.message);
            return false;
        }
    }

    /**
     * Delete a file
     * @param {string} fileName
     * @returns {boolean}
     */
    deleteFile(fileName) {
        if (!this.disk) return false;

        try {
            this.disk.deleteFile(fileName);
            this.save();
            return true;
        } catch (e) {
            console.error('GMDisk: deleteFile failed:', e.message);
            return false;
        }
    }

    /**
     * Download disk as .d64 file
     * @param {string} filename - Download filename (default: original name or 'disk.d64')
     */
    download(filename = null) {
        if (!this.disk) return;

        const downloadName = filename || this.diskFileName || 'disk.d64';
        const blob = this.disk.toBlob();
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = downloadName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // =========================================================================
    // FILE INPUT HANDLING
    // =========================================================================

    /**
     * Load a D64 from a File object (from file input)
     * @param {File} file
     * @returns {Promise<boolean>}
     */
    async loadFromFile(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const bytes = new Uint8Array(e.target.result);
                    new D64(bytes); // validate
                    const ok = await this._insertBytes(bytes, file.name);
                    resolve(ok);
                } catch (err) {
                    console.error('GMDisk: Failed to load D64:', err.message);
                    resolve(false);
                }
            };
            reader.onerror = () => resolve(false);
            reader.readAsArrayBuffer(file);
        });
    }

    /**
     * Insert bytes into the pool with collision handling. Returns true if a disk
     * was selected (whether by adding or by switching to an existing entry).
     *
     * - same hash → silent dedup (select existing)
